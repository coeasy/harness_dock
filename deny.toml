# HarnessDock Rust supply-chain policy.
#
# PRs run bans/licenses/sources only. Network-backed RustSec advisory checks
# remain in the scheduled cargo-audit job so registry/feed outages do not make
# ordinary code PRs nondeterministic.

[graph]
all-features = true

[advisories]
yanked = "warn"
unmaintained = "workspace"

[bans]
# Tauri and platform crates legitimately carry parallel target-specific
# versions. Track duplication as debt without making routine dependency
# resolution impossible; wildcard requirements and unexpected sources remain
# hard failures.
multiple-versions = "warn"
wildcards = "deny"
highlight = "simplest-path"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[licenses]
confidence-threshold = 0.90
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "OpenSSL",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
