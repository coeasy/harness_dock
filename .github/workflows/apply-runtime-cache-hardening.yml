name: apply-runtime-cache-hardening

on:
  push:
    branches:
      - fix/v0.1.1-runtime-cache-hardening

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/v0.1.1-runtime-cache-hardening
      - name: Apply runtime composition hardening
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          prepare = Path('packages/client-runtime/src/prepare-cli.ts')
          text = prepare.read_text()
          if 'const RUNTIME_LAYOUT_VERSION = 2' not in text:
              raise SystemExit('runtime layout version pattern not found')
          text = text.replace('const RUNTIME_LAYOUT_VERSION = 2', 'const RUNTIME_LAYOUT_VERSION = 3', 1)
          marker = "      '--include=optional',"
          if marker not in text:
              raise SystemExit('target-native optional marker not found')
          text = text.replace(marker, "      '--omit=optional',", 1)
          prepare.write_text(text)
          PY

          git diff --check
          git diff -- packages/client-runtime/src/prepare-cli.ts
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/client-runtime/src/prepare-cli.ts
          git commit -m "fix: keep target-native repair optional-free"
          git push origin HEAD:fix/v0.1.1-runtime-cache-hardening
