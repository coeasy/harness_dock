name: v020-round2-redaction-apply

on:
  push:
    branches:
      - refactor/v0.2.0-shell-first
    paths:
      - '.github/workflows/v020-round2-redaction-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Linux Tauri dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2
      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: rustfmt
      - name: Apply public diagnostics redaction boundary
        run: python scripts/_apply-v020-round2.py
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Rebuild independent Harness Shell and Gateway
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @dsh/plugin-harness-shell build
          node scripts/check-shell-package.mjs
          pnpm --filter @dsh/tauri bundle:sidecar
      - name: Validate round two completely
        shell: bash
        run: |
          set -euo pipefail
          pnpm check:versions
          pnpm check:release
          pnpm test
          cargo fmt --manifest-path apps/tauri/src-tauri/Cargo.toml -- --check
          cargo metadata --locked --manifest-path apps/tauri/src-tauri/Cargo.toml --format-version 1 > /dev/null
          cargo check --locked --manifest-path apps/tauri/src-tauri/Cargo.toml
          cargo test --locked --manifest-path apps/tauri/src-tauri/Cargo.toml --lib
      - name: Commit only fully validated round-two fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'coeasy'
          git config user.email 'mdonetwo@yeah.net'
          git add apps/tauri/web/app.js packages/plugin-harness-shell/web/shell.js tests/parity/public-diagnostics-redaction.test.ts
          git diff --cached --quiet && { echo 'No validated round-two changes to commit.'; exit 1; }
          git commit -m 'security: redact public runtime diagnostics'
          git push origin HEAD:refactor/v0.2.0-shell-first
