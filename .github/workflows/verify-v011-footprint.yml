name: verify-v011-footprint

on:
  push:
    branches:
      - fix/v0.1.1-full-runtime-footprint

permissions:
  contents: read
  actions: read

jobs:
  linux-full:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      NODE_OPTIONS: '--max-old-space-size=4096'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Download verified upstream packed closure
        uses: actions/download-artifact@v8
        with:
          name: upstream-dsh-packed
          path: upstream-packed
          repository: coeasy/harness_dock
          run-id: 33282687034
          github-token: ${{ github.token }}
      - name: Build optimized Linux runtime
        run: pnpm --filter @dsh/client-runtime bundle-runtime -- --force --runtime-dir runtimes/verify-linux --platform linux --arch x64
        env:
          DSH_PACKED_RUNTIME_DIR: upstream-packed
      - name: Report runtime footprint
        shell: bash
        run: |
          set -euo pipefail
          du -sh runtimes/verify-linux
          du -sh runtimes/verify-linux/node_modules/* 2>/dev/null | sort -h | tail -n 25
      - name: Build Linux Full package
        run: node apps/desktop/scripts/pack.mjs --os linux --scenario full
        env:
          GH_OWNER: coeasy
          GH_REPO: harness_dock
          DSH_SKIP_RUNTIME_PREPARE: '1'
          DSH_RUNTIME_DIR: runtimes/verify-linux
      - name: Smoke packaged runtime
        run: pnpm --filter @dsh/client-runtime smoke-runtime -- --runtime-dir apps/desktop/release/full/linux-unpacked/resources/dsh-runtime --plugin apps/desktop/release/full/linux-unpacked/resources/plugin-embedded-client/index.js
      - name: Enforce existing size budget
        run: pnpm check:size
