name: v020-core-hardening-apply-v6

on:
  push:
    branches:
      - refactor/v0.2.0-shell-first
    paths:
      - '.github/workflows/v020-core-hardening-apply-v6.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Linux Tauri dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2
      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Prepare and apply core migration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          source = Path('scripts/_apply-v020-core-hardening.mjs').read_text()
          marker = "writeFileSync('tests/parity/v020-core-contract.test.ts'"
          if source.count(marker) != 1:
              raise SystemExit('guarded migrator marker is missing or ambiguous')
          Path('/tmp/apply-v020-core-hardening.mjs').write_text(source.split(marker, 1)[0])
          PY
          node --check /tmp/apply-v020-core-hardening.mjs
          node /tmp/apply-v020-core-hardening.mjs
          python scripts/_apply-v020-gateway-lifecycle.py
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Rebuild independent Harness Shell package
        run: pnpm --filter @dsh/plugin-harness-shell build
      - name: Format Rust
        run: cargo fmt --manifest-path apps/tauri/src-tauri/Cargo.toml
      - name: Validate complete v0.2.0 host contract
        shell: bash
        run: |
          set -euo pipefail
          pnpm check:versions
          pnpm check:release
          pnpm test
          cargo fmt --manifest-path apps/tauri/src-tauri/Cargo.toml -- --check
          cargo check --manifest-path apps/tauri/src-tauri/Cargo.toml
      - name: Commit only fully validated business changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'coeasy'
          git config user.email 'mdonetwo@yeah.net'
          git add \
            README.md \
            docs/plan/v0.2.0-shell-first-implementation.md \
            apps/tauri/src-tauri/src/runtime.rs \
            apps/tauri/src-tauri/src/harness_window.rs \
            apps/tauri/src-tauri/src/gateway_host.rs \
            apps/tauri/web/app.js \
            packages/plugin-harness-shell/src/index.ts \
            packages/plugin-harness-shell/lib/index.js \
            packages/plugin-harness-shell/web/shell.js \
            tests/parity/tauri-host.test.ts \
            tests/parity/tauri-shell-fail-open.test.ts \
            tests/parity/gateway-lifecycle-contract.test.ts \
            tests/parity/v020-core-contract.test.ts
          git diff --cached --quiet && { echo 'No fully validated business changes to commit.'; exit 1; }
          git commit -m 'refactor: harden v0.2.0 managed host contract'
          git push origin HEAD:refactor/v0.2.0-shell-first
          git push origin --delete tmp || true
