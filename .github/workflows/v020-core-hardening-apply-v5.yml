name: v020-core-hardening-apply-v5

on:
  push:
    branches:
      - refactor/v0.2.0-shell-first
    paths:
      - '.github/workflows/v020-core-hardening-apply-v5.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Prepare guarded core migrator
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          source = Path('scripts/_apply-v020-core-hardening.mjs').read_text()
          marker = "writeFileSync('tests/parity/v020-core-contract.test.ts'"
          if source.count(marker) != 1:
              raise SystemExit('guarded migrator test-generation marker is missing or ambiguous')
          Path('/tmp/apply-v020-core-hardening.mjs').write_text(source.split(marker, 1)[0])
          PY
          node --check /tmp/apply-v020-core-hardening.mjs

      - name: Apply planned core hardening
        run: node /tmp/apply-v020-core-hardening.mjs

      - name: Serialize Gateway start and stop and fix semantic tray assertion
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          gateway_path = Path('apps/tauri/src-tauri/src/gateway_host.rs')
          gateway = gateway_path.read_text()

          old = '''fn claim_gateway_start(state: &State<'_, AppState>) -> Result<GatewayStartGuard, String> {
              let starting = Arc::clone(&state.gateway_starting);
              if starting.swap(true, Ordering::AcqRel) {
                  return Err("Gateway 正在处理另一个启动操作，请稍候再试。".into());
              }
              let claim = GatewayStartGuard(starting);
              if state.quitting.load(Ordering::Acquire)
                  || state.runtime_restarting.load(Ordering::Acquire)
                  || state.runtime_stopping.load(Ordering::Acquire)
              {
                  return Err("Runtime 正在处理生命周期操作，暂时无法启动 Gateway。".into());
              }
              Ok(claim)
          }
          '''
          new = '''fn claim_gateway_start(state: &State<'_, AppState>) -> Result<GatewayStartGuard, String> {
              let lifecycle = Arc::clone(&state.gateway_starting);
              if lifecycle.swap(true, Ordering::AcqRel) {
                  return Err("Gateway 正在处理另一个生命周期操作，请稍候再启动。".into());
              }
              let claim = GatewayStartGuard(lifecycle);
              if state.quitting.load(Ordering::Acquire)
                  || state.runtime_restarting.load(Ordering::Acquire)
                  || state.runtime_stopping.load(Ordering::Acquire)
              {
                  return Err("Runtime 正在处理生命周期操作，暂时无法启动 Gateway。".into());
              }
              Ok(claim)
          }

          fn claim_gateway_stop(state: &State<'_, AppState>) -> Result<GatewayStartGuard, String> {
              let lifecycle = Arc::clone(&state.gateway_starting);
              if lifecycle.swap(true, Ordering::AcqRel) {
                  return Err("Gateway 正在处理另一个生命周期操作，请稍候再停止。".into());
              }
              Ok(GatewayStartGuard(lifecycle))
          }
          '''
          if gateway.count(old) != 1:
              raise SystemExit(f'claim_gateway_start anchor count={gateway.count(old)}')
          gateway = gateway.replace(old, new, 1)

          old_stop = '''pub fn gateway_host_stop(state: State<'_, AppState>) -> Result<GatewayHostStatus, String> {
              let mut guard = state
                  .gateway
                  .lock()
                  .map_err(|_| "Gateway 状态锁已损坏。".to_string())?;
              if state.gateway_starting.load(Ordering::Acquire) {
                  return Err("Gateway 正在启动，请稍候再停止。".into());
              }
              if let Some(mut process) = guard.take() {
                  process.stop();
              }
              Ok(stopped())
          }
          '''
          new_stop = '''pub fn gateway_host_stop(state: State<'_, AppState>) -> Result<GatewayHostStatus, String> {
              let _stopping = claim_gateway_stop(&state)?;
              let mut guard = state
                  .gateway
                  .lock()
                  .map_err(|_| "Gateway 状态锁已损坏。".to_string())?;
              if let Some(mut process) = guard.take() {
                  process.stop();
              }
              Ok(stopped())
          }
          '''
          if gateway.count(old_stop) != 1:
              raise SystemExit(f'gateway_host_stop anchor count={gateway.count(old_stop)}')
          gateway = gateway.replace(old_stop, new_stop, 1)
          gateway_path.write_text(gateway)

          test_path = Path('tests/parity/tauri-host.test.ts')
          test = test_path.read_text()
          old_assert = '    expect(tray).toContain(\'"tray-gateway", "移动设备 / Gateway"\')'
          new_assert = '    expect(tray).toContain(\'"tray-gateway"\')\n    expect(tray).toContain(\'"移动设备 / Gateway"\')'
          if test.count(old_assert) != 1:
              raise SystemExit(f'tray assertion anchor count={test.count(old_assert)}')
          test_path.write_text(test.replace(old_assert, new_assert, 1))
          PY

      - run: pnpm install --frozen-lockfile --prefer-offline

      - name: Rebuild independent Harness Shell package
        run: pnpm --filter @dsh/plugin-harness-shell build

      - name: Format Rust
        run: cargo fmt --manifest-path apps/tauri/src-tauri/Cargo.toml

      - name: Validate JavaScript, release and Rust contracts
        shell: bash
        run: |
          set -euo pipefail
          pnpm check:versions
          pnpm check:release
          pnpm test
          cargo fmt --manifest-path apps/tauri/src-tauri/Cargo.toml -- --check
          cargo check --manifest-path apps/tauri/src-tauri/Cargo.toml

      - name: Commit validated business hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'coeasy'
          git config user.email 'mdonetwo@yeah.net'
          git add \
            README.md \
            docs/plan/v0.2.0-shell-first-implementation.md \
            apps/tauri/src-tauri/src/runtime.rs \
            apps/tauri/src-tauri/src/harness_window.rs \
            apps/tauri/src-tauri/src/gateway_host.rs \
            apps/tauri/web/app.js \
            packages/plugin-harness-shell/src/index.ts \
            packages/plugin-harness-shell/lib/index.js \
            packages/plugin-harness-shell/web/shell.js \
            tests/parity/tauri-host.test.ts \
            tests/parity/tauri-shell-fail-open.test.ts \
            tests/parity/gateway-lifecycle-contract.test.ts \
            tests/parity/v020-core-contract.test.ts
          git diff --cached --quiet && { echo 'No validated business changes to commit.'; exit 1; }
          git commit -m 'refactor: harden v0.2.0 managed host contract'
          git push origin HEAD:refactor/v0.2.0-shell-first
          git push origin --delete tmp || true
