name: v012-version-helper

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  sync-generated-version-metadata:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'release/v0.1.2-alignment' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Align Cargo.lock root package version
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const rootVersion = JSON.parse(fs.readFileSync('package.json', 'utf8')).version
          if (rootVersion !== '0.1.2') throw new Error(`unexpected release version: ${rootVersion}`)

          const cargoToml = fs.readFileSync('apps/tauri/src-tauri/Cargo.toml', 'utf8')
          const cargoVersion = cargoToml.match(/^version\s*=\s*"([^"]+)"\s*$/m)?.[1]
          if (cargoVersion !== rootVersion) throw new Error(`Cargo.toml=${cargoVersion} root=${rootVersion}`)

          const lockPath = 'apps/tauri/src-tauri/Cargo.lock'
          let lock = fs.readFileSync(lockPath, 'utf8')
          const pattern = /(\[\[package\]\]\nname = "harnessdock-tauri"\nversion = ")[^"]+("\n)/
          if (!pattern.test(lock)) throw new Error('harnessdock-tauri entry missing from Cargo.lock')
          lock = lock.replace(pattern, `$1${rootVersion}$2`)
          fs.writeFileSync(lockPath, lock)
          NODE
          git diff --check

      - name: Commit synchronized Cargo.lock
        shell: bash
        run: |
          if git diff --quiet -- apps/tauri/src-tauri/Cargo.lock; then
            echo 'Cargo.lock already aligned.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/tauri/src-tauri/Cargo.lock
          git commit -m 'chore: sync v0.1.2 Cargo.lock metadata'
          git push origin HEAD:${{ github.head_ref }}
