name: tauri-ci

on:
  pull_request:
    paths:
      - 'apps/tauri/**'
      - 'packages/bootstrap/**'
      - 'packages/client-runtime/**'
      - 'packages/docs-sync/**'
      - 'packages/plugin-embedded-client/**'
      - 'scripts/check-tauri-host.mjs'
      - 'package.json'
      - '.github/workflows/tauri-ci.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: tauri-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  TAURI_CLI_VERSION: '2.11.0'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm check:versions
      - run: pnpm check:tauri
      - run: node --check apps/tauri/src/app.js
      - run: node --check apps/tauri/src-tauri/resources/gateway-host.mjs
      - run: pnpm test
      - name: Install Linux Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust compile check
        id: cargo
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo check --manifest-path apps/tauri/src-tauri/Cargo.toml 2>&1 | tee cargo-check.log
      - name: Publish Cargo diagnostics to PR
        if: steps.cargo.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs')
            const marker = '<!-- tauri-cargo-diagnostic -->'
            const raw = fs.existsSync('cargo-check.log') ? fs.readFileSync('cargo-check.log', 'utf8') : 'cargo-check.log was not produced'
            const tail = raw.length > 16000 ? raw.slice(-16000) : raw
            const body = `${marker}\n### Tauri Cargo diagnostic\n\nExact-head: \`${context.sha}\`\n\n\`\`\`text\n${tail}\n\`\`\``
            const { owner, repo } = context.repo
            const issue_number = context.issue.number
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 })
            const existing = comments.find((comment) => comment.user?.type === 'Bot' && comment.body?.includes(marker))
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body })
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body })
            }
      - name: Enforce Rust compile gate
        if: steps.cargo.outcome == 'failure'
        run: exit 1

  android:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve Android NDK
        shell: bash
        run: |
          set -euo pipefail
          ndk=$(find "$ANDROID_SDK_ROOT/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          test -n "$ndk"
          echo "NDK_HOME=$ndk" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
      - name: Initialize Android target
        working-directory: apps/tauri
        run: npx --yes @tauri-apps/cli@${TAURI_CLI_VERSION} android init --ci
      - name: Build Android debug APK
        working-directory: apps/tauri
        run: npx --yes @tauri-apps/cli@${TAURI_CLI_VERSION} android build --debug --apk --target aarch64
      - uses: actions/upload-artifact@v7
        with:
          name: HarnessDock-0.2.0-android-aarch64-debug
          path: apps/tauri/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7

  ios-simulator:
    needs: validate
    runs-on: macos-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim
      - name: Initialize iOS target
        working-directory: apps/tauri
        run: npx --yes @tauri-apps/cli@${TAURI_CLI_VERSION} ios init --ci
      - name: Build unsigned iOS simulator app
        working-directory: apps/tauri
        run: npx --yes @tauri-apps/cli@${TAURI_CLI_VERSION} ios build --debug --target aarch64-sim --no-sign
      - uses: actions/upload-artifact@v7
        with:
          name: HarnessDock-0.2.0-ios-simulator
          path: apps/tauri/src-tauri/gen/apple/build/**/*.app
          if-no-files-found: error
          retention-days: 7
