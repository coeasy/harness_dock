name: tauri-ci

on:
  pull_request:
    paths:
      - 'apps/tauri/**'
      - 'packages/bootstrap/**'
      - 'packages/client-runtime/**'
      - 'packages/docs-sync/**'
      - 'packages/plugin-embedded-client/**'
      - 'scripts/check-tauri-host.mjs'
      - 'package.json'
      - '.github/workflows/tauri-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tauri-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  TAURI_CLI_VERSION: '2.11.0'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm check:versions
      - run: pnpm check:tauri
      - run: node --check apps/tauri/src/app.js
      - run: node --check apps/tauri/src-tauri/resources/gateway-host.mjs
      - run: pnpm test
      - name: Install Linux Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust compile check
        run: cargo check --manifest-path apps/tauri/src-tauri/Cargo.toml

  android:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve Android NDK
        shell: bash
        run: |
          set -euo pipefail
          ndk=$(find "$ANDROID_SDK_ROOT/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          test -n "$ndk"
          echo "NDK_HOME=$ndk" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
      - name: Initialize Android target
        working-directory: apps/tauri
        run: npx --yes @tauri-apps/cli@${TAURI_CLI_VERSION} android init --ci
      - name: Build Android debug APK
        working-directory: apps/tauri
        run: npx --yes @tauri-apps/cli@${TAURI_CLI_VERSION} android build --debug --apk --target aarch64
      - uses: actions/upload-artifact@v7
        with:
          name: HarnessDock-0.2.0-android-aarch64-debug
          path: apps/tauri/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7

  ios-simulator:
    needs: validate
    runs-on: macos-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim
      - name: Initialize iOS target
        working-directory: apps/tauri
        run: npx --yes @tauri-apps/cli@${TAURI_CLI_VERSION} ios init --ci
      - name: Build unsigned iOS simulator app
        working-directory: apps/tauri
        run: npx --yes @tauri-apps/cli@${TAURI_CLI_VERSION} ios build --debug --target aarch64-sim --no-sign
      - uses: actions/upload-artifact@v7
        with:
          name: HarnessDock-0.2.0-ios-simulator
          path: apps/tauri/src-tauri/gen/apple/build/**/*.app
          if-no-files-found: error
          retention-days: 7
