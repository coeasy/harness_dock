name: tauri-ci

on:
  push:
    branches:
      - main
      - 'refactor/**'
    paths:
      - 'apps/tauri/**'
      - 'packages/bootstrap/**'
      - 'packages/client-runtime/**'
      - 'packages/plugin-embedded-client/**'
      - 'packages/plugin-harness-shell/**'
      - 'protocol/**'
      - 'scripts/check-embedded-runtime.mjs'
      - 'scripts/check-mobile-contract.mjs'
      - 'scripts/check-tauri-source-layout.mjs'
      - 'scripts/generate-shell-contract.mjs'
      - 'scripts/generate-runtime-ready-contract.mjs'
      - 'tests/parity/**'
      - 'rust-toolchain.toml'
      - '.github/workflows/tauri-ci.yml'
  pull_request:
    paths:
      - 'apps/tauri/**'
      - 'packages/bootstrap/**'
      - 'packages/client-runtime/**'
      - 'packages/plugin-embedded-client/**'
      - 'packages/plugin-harness-shell/**'
      - 'protocol/**'
      - 'scripts/check-embedded-runtime.mjs'
      - 'scripts/check-mobile-contract.mjs'
      - 'scripts/check-tauri-source-layout.mjs'
      - 'scripts/generate-shell-contract.mjs'
      - 'scripts/generate-runtime-ready-contract.mjs'
      - 'tests/parity/**'
      - 'rust-toolchain.toml'
      - '.github/workflows/tauri-ci.yml'

concurrency:
  group: tauri-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  auto-clippy-fix:
    if: github.event_name == 'push' && github.ref_name == 'refactor/v4-full-implementation'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/v4-full-implementation
      - name: Install Linux Tauri dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/tauri/src-tauri
      - name: Apply machine-applicable Clippy fixes
        shell: bash
        run: |
          set +e
          cargo clippy --fix --allow-dirty --allow-staged --locked --manifest-path apps/tauri/src-tauri/Cargo.toml --all-targets -- -D warnings
          status=$?
          set -e
          cargo fmt --manifest-path apps/tauri/src-tauri/Cargo.toml --all
          echo "clippy --fix exit status: $status (non-machine-applicable lints are handled manually)"
      - name: Commit compiler-approved fixes if needed
        shell: bash
        run: |
          if git diff --quiet -- apps/tauri/src-tauri; then
            echo "no machine-applicable fixes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/tauri/src-tauri
          git diff --cached --check
          git commit -m "style: apply Rust 1.98 Clippy fixes"
          git push origin HEAD:refactor/v4-full-implementation

  shared-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Verify generated and release contracts
        run: pnpm check:versions
      - name: Verify mobile least-privilege capability
        run: node scripts/check-mobile-contract.mjs
      - name: Verify sealed embedded Runtime contract
        run: pnpm check:embedded-runtime
      - run: pnpm --filter @dsh/bootstrap build
      - run: pnpm --filter @dsh/client-runtime build
      - run: pnpm --filter @dsh/plugin-embedded-client build
      - run: pnpm --filter @dsh/plugin-harness-shell build
      - run: pnpm vitest run packages/bootstrap/tests/mobile-gateway-contract.test.ts packages/bootstrap/tests/gateway.test.ts packages/bootstrap/tests/runtime-lease.test.ts packages/client-runtime/tests/runtime.test.ts tests/parity/*.test.ts

  desktop-rust:
    name: desktop-rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/tauri/src-tauri
      - name: Check Native Host
        run: cargo check --locked --manifest-path apps/tauri/src-tauri/Cargo.toml
      - name: Test Native Host actors and Gateway
        run: cargo test --locked --manifest-path apps/tauri/src-tauri/Cargo.toml --lib

  android-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Verify mobile capability before generating native project
        run: node scripts/check-mobile-contract.mjs
      - name: Install Linux Tauri dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/tauri/src-tauri
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version 2.11.4 --locked
      - name: Resolve Android NDK
        shell: bash
        run: |
          set -euo pipefail
          ndk="${ANDROID_NDK_LATEST_HOME:-}"
          if [ -z "$ndk" ]; then ndk="$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"; fi
          test -d "$ndk"
          echo "NDK_HOME=$ndk" >> "$GITHUB_ENV"
      - name: Initialize Android project
        working-directory: apps/tauri
        run: cargo tauri android init --ci --skip-targets-install
      - name: Build Android smoke APK
        working-directory: apps/tauri
        run: cargo tauri android build --apk --target aarch64 --ci
      - name: Check Android smoke package size
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find apps/tauri/src-tauri/gen/android/app/build/outputs -type f -name '*.apk' -print | sort | head -1)"
          test -n "$apk"
          node scripts/check-android-package.mjs "$apk"

  ios-smoke:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Verify mobile capability before generating native project
        run: node scripts/check-mobile-contract.mjs
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          targets: aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/tauri/src-tauri
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version 2.11.4 --locked
      - name: Initialize iOS project
        working-directory: apps/tauri
        run: cargo tauri ios init --ci --skip-targets-install
      - name: Build iOS simulator app
        working-directory: apps/tauri
        run: cargo tauri ios build --debug --target aarch64-sim --ci
