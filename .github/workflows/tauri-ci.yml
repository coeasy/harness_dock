name: tauri-ci

on:
  push:
    branches:
      - feat/tauri-v0.2.0
  pull_request:
    paths:
      - 'apps/tauri/**'
      - 'packages/client-runtime/**'
      - 'packages/bootstrap/**'
      - '.github/workflows/tauri-ci.yml'
      - 'package.json'

permissions:
  contents: read

concurrency:
  group: tauri-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust-check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/tauri/src-tauri
      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: cargo fmt --manifest-path apps/tauri/src-tauri/Cargo.toml -- --check
      - run: cargo check --manifest-path apps/tauri/src-tauri/Cargo.toml --all-targets

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/tauri/src-tauri
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version '^2.0.0' --locked
      - name: Initialize Android project
        working-directory: apps/tauri
        run: cargo tauri android init --ci
      - name: Build Android APK
        working-directory: apps/tauri
        run: cargo tauri android build --apk --target aarch64 --ci
      - uses: actions/upload-artifact@v7
        with:
          name: harnessdock-android-ci
          path: apps/tauri/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          compression-level: 0

  ios-simulator:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/tauri/src-tauri
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version '^2.0.0' --locked
      - name: Initialize iOS project
        working-directory: apps/tauri
        run: cargo tauri ios init --ci
      - name: Compile iOS simulator target
        working-directory: apps/tauri
        run: cargo tauri ios build --debug --target aarch64-sim --ci
