name: bootstrap-v0.1.0

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/bootstrap-v0.1.0.yml'

permissions:
  contents: write
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Move v0.1.0 tag to validated release commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: '95803dc1245736ce737e34f988a49ece19fe6027'
        shell: bash
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v0.1.0" >/dev/null 2>&1; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/v0.1.0" \
              -f sha="$RELEASE_SHA" \
              -F force=true >/dev/null
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref='refs/tags/v0.1.0' \
              -f sha="$RELEASE_SHA" >/dev/null
          fi
          echo "v0.1.0 -> $RELEASE_SHA"

      - name: Dispatch final full v0.1.0 release from tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run release.yml --repo "${GITHUB_REPOSITORY}" --ref v0.1.0 \
            -f release_tag=v0.1.0 \
            -f target=all
