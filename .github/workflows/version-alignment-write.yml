name: version-alignment-write

on:
  push:
    branches:
      - release/v0.1.2-alignment

permissions:
  contents: write

jobs:
  sync-generated-version-metadata:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/v0.1.2-alignment

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Sync generated version metadata
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const rootVersion = JSON.parse(fs.readFileSync('package.json', 'utf8')).version
          const cargoToml = fs.readFileSync('apps/tauri/src-tauri/Cargo.toml', 'utf8')
          const cargoVersion = cargoToml.match(/^version\s*=\s*"([^"]+)"\s*$/m)?.[1]
          if (cargoVersion !== rootVersion) {
            throw new Error(`Cargo.toml version ${cargoVersion} does not match root ${rootVersion}`)
          }

          const lockPath = 'apps/tauri/src-tauri/Cargo.lock'
          let lock = fs.readFileSync(lockPath, 'utf8')
          const pattern = /(\[\[package\]\]\nname = "harnessdock-tauri"\nversion = ")[^"]+("\n)/
          if (!pattern.test(lock)) throw new Error('harnessdock-tauri package entry not found in Cargo.lock')
          lock = lock.replace(pattern, `$1${rootVersion}$2`)
          fs.writeFileSync(lockPath, lock)

          const releasePath = '.github/workflows/release.yml'
          let release = fs.readFileSync(releasePath, 'utf8')
          release = release.replace(
            /Exact beta tag to publish \(for example v[^)]+\)/,
            `Exact beta tag to publish (for example v${rootVersion}-beta.1)`,
          )
          fs.writeFileSync(releasePath, release)
          NODE

          git diff --check
          git diff -- apps/tauri/src-tauri/Cargo.lock .github/workflows/release.yml

      - name: Commit generated metadata
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Generated metadata already aligned.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/tauri/src-tauri/Cargo.lock .github/workflows/release.yml
          git commit -m 'chore: sync v0.1.2 generated version metadata'
          git push origin HEAD:release/v0.1.2-alignment
