name: v020-reproducibility-apply-v3

on:
  push:
    branches:
      - refactor/v0.2.0-shell-first
    paths:
      - '.github/workflows/v020-reproducibility-apply-v3.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Linux Tauri dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2
      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: rustfmt
      - name: Freeze dependency graph and apply guarded migration
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile --manifest-path apps/tauri/src-tauri/Cargo.toml
          test -s apps/tauri/src-tauri/Cargo.lock
          python scripts/_apply-v020-reproducibility.py
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Rebuild and verify publishable Harness Shell
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @dsh/plugin-harness-shell build
          node scripts/check-shell-package.mjs
      - name: Validate frozen v0.2.0 release contracts
        shell: bash
        run: |
          set -euo pipefail
          pnpm check:versions
          pnpm check:release
          pnpm test
          cargo metadata --locked --manifest-path apps/tauri/src-tauri/Cargo.toml --format-version 1 > /dev/null
          cargo check --locked --manifest-path apps/tauri/src-tauri/Cargo.toml
          cargo test --locked --manifest-path apps/tauri/src-tauri/Cargo.toml --lib
      - name: Commit only fully validated reproducibility changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'coeasy'
          git config user.email 'mdonetwo@yeah.net'
          git add rust-toolchain.toml package.json apps/tauri/package.json apps/tauri/src-tauri/Cargo.lock scripts/check-versions.mjs scripts/check-shell-package.mjs tests/parity/reproducible-release-contract.test.ts .github/workflows/ci.yml .github/workflows/tauri-ci.yml .github/workflows/tauri-candidate.yml
          git diff --cached --quiet && { echo 'No validated reproducibility changes to commit.'; exit 1; }
          git commit -m 'build: freeze Tauri toolchain and verify shell package'
          git push origin HEAD:refactor/v0.2.0-shell-first
