name: Refresh Tauri Lockfile

on:
  push:
    branches:
      - refactor/v0.2.0-shell-first
    paths:
      - apps/tauri/src-tauri/Cargo.toml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-tauri-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/v0.2.0-shell-first
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve lockfile from Cargo registry
        run: cargo fetch --manifest-path apps/tauri/src-tauri/Cargo.toml
      - name: Commit resolved lockfile
        shell: bash
        run: |
          if git diff --quiet -- apps/tauri/src-tauri/Cargo.lock; then
            echo "Cargo.lock already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/tauri/src-tauri/Cargo.lock
          git commit -m "chore: refresh Tauri lockfile"
          git push origin HEAD:refactor/v0.2.0-shell-first
