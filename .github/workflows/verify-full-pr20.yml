name: verify-full-pr20

on:
  push:
    branches:
      - fix/release-smoke-actions

permissions:
  contents: read

concurrency:
  group: verify-full-pr20-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target_os: win
            platform: win32
            arch: x64
            runtime_dir: runtimes/pack
          - runner: ubuntu-latest
            target_os: linux
            platform: linux
            arch: x64
            runtime_dir: runtimes/pack
          - runner: macos-latest
            target_os: mac
            platform: darwin
            arch: x64
            runtime_dir: runtimes/pack-x64
          - runner: macos-latest
            target_os: mac
            platform: darwin
            arch: arm64
            runtime_dir: runtimes/pack-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      NODE_OPTIONS: '--max-old-space-size=4096'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Prepare target runtime
        run: pnpm --filter @dsh/client-runtime bundle-runtime
        env:
          DSH_RUNTIME_PLATFORM: ${{ matrix.platform }}
          DSH_RUNTIME_ARCH: ${{ matrix.arch }}
          DSH_RUNTIME_DIR: ${{ matrix.runtime_dir }}
      - name: Build full package
        run: node apps/desktop/scripts/pack.mjs --os ${{ matrix.target_os }} --scenario full --arch ${{ matrix.arch }}
        env:
          GH_OWNER: ${{ github.repository_owner }}
          GH_REPO: ${{ github.event.repository.name }}
          DSH_SKIP_RUNTIME_PREPARE: '1'
          DSH_RUNTIME_DIR: ${{ matrix.runtime_dir }}
      - name: Smoke test bundled runtime
        run: pnpm --filter @dsh/client-runtime smoke-runtime -- --runtime-dir ${{ matrix.runtime_dir }} --plugin packages/plugin-embedded-client/lib/index.js
      - name: Inventory release files
        shell: bash
        run: |
          set -euo pipefail
          find apps/desktop/release/full -maxdepth 1 -type f -print | sort
          case '${{ matrix.target_os }}' in
            win)
              test -f apps/desktop/release/full/HarnessDock-Setup-0.1.0-win-x64-full.exe
              test -f apps/desktop/release/full/HarnessDock-Portable-0.1.0-win-x64-full.exe
              test -f apps/desktop/release/full/HarnessDock-0.1.0-win-x64-full.zip
              ;;
            linux)
              test -f apps/desktop/release/full/HarnessDock-0.1.0-linux-x86_64-full.AppImage
              test -f apps/desktop/release/full/HarnessDock-0.1.0-linux-amd64-full.deb
              ;;
            mac)
              test -f apps/desktop/release/full/HarnessDock-0.1.0-mac-${{ matrix.arch }}-full.dmg
              test -f apps/desktop/release/full/HarnessDock-0.1.0-mac-${{ matrix.arch }}-full.zip
              ;;
          esac
      - uses: actions/upload-artifact@v7
        with:
          name: verify-full-${{ matrix.target_os }}-${{ matrix.arch }}
          path: |
            apps/desktop/release/full/*.exe
            apps/desktop/release/full/*.dmg
            apps/desktop/release/full/*.zip
            apps/desktop/release/full/*.AppImage
            apps/desktop/release/full/*.deb
            apps/desktop/release/full/*.blockmap
            apps/desktop/release/full/latest*.yml
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
