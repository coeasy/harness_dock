name: mobile-preview

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'packages/bootstrap/src/runtime-provider.ts'
      - 'packages/bootstrap/src/host-capabilities.ts'
      - 'packages/bootstrap/src/gateway.ts'
      - 'packages/bootstrap/tests/runtime-provider.test.ts'
      - 'packages/bootstrap/tests/gateway.test.ts'
      - 'apps/desktop/src/boot/boot-flow.ts'
      - 'apps/desktop/src/shutdown.ts'
      - '.github/workflows/mobile-preview.yml'
      - 'package.json'

permissions:
  contents: read

concurrency:
  group: mobile-preview-${{ github.ref }}
  cancel-in-progress: true

env:
  PERRY_VERSION: '0.5.1220'
  PERRY_NO_TELEMETRY: '1'
  CI: 'true'
  PERRY_IOS_SIM_CROSS_SHA256: '140c2dd79ffe785b142dd9c79cbda1bc02b63837a3aac2bbcd7f0de2dd99a3d6'
  PERRY_ANDROID_CROSS_SHA256: '66b365a385dacc7b439ab664d55fcb210b19ad85801d6e23fa5db5abd68189fe'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm test
      - run: pnpm check:mobile-host

  ios-simulator:
    needs: validate
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: npm install -g @perryts/perry@0.5.1220
      - run: perry --version
      - run: perry check apps/mobile/src/main.ts --strict

      # Perry's npm host package does not bundle cross-target runtime archives.
      # Use the immutable cross bundle published with the pinned Perry release,
      # verify its release SHA256 + manifest, then point the compiler at it.
      - name: Provision pinned Perry iOS simulator cross runtime
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/perry-cross-aarch64-apple-ios-sim.tar.gz"
          runtime_dir="$RUNNER_TEMP/perry-cross-ios-simulator"
          rm -rf "$runtime_dir"
          mkdir -p "$runtime_dir"
          curl --fail --location --retry 3 --retry-all-errors \
            "https://github.com/PerryTS/perry/releases/download/v${PERRY_VERSION}/perry-cross-aarch64-apple-ios-sim.tar.gz" \
            --output "$archive"
          actual="$(shasum -a 256 "$archive" | awk '{print $1}')"
          test "$actual" = "$PERRY_IOS_SIM_CROSS_SHA256"
          tar -xzf "$archive" -C "$runtime_dir"
          test -f "$runtime_dir/libperry_runtime.a"
          test -f "$runtime_dir/libperry_stdlib.a"
          test -f "$runtime_dir/libperry_ui_ios.a"
          jq -e --arg version "$PERRY_VERSION" \
            '.perry_version == $version and .target_triple == "aarch64-apple-ios-sim" and (.files | length >= 3)' \
            "$runtime_dir/manifest.json" >/dev/null
          echo "PERRY_RUNTIME_DIR=$runtime_dir" >> "$GITHUB_ENV"

      - run: mkdir -p apps/mobile/release/ios-simulator
      - run: pnpm build:mobile:ios-sim
      - uses: actions/upload-artifact@v7
        with:
          name: harnessdock-mobile-ios-simulator
          path: apps/mobile/release/ios-simulator/*
          if-no-files-found: error
          retention-days: 7

  android:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Discover preinstalled Android NDK
        shell: bash
        run: |
          set -euo pipefail
          NDK="$(find "$ANDROID_SDK_ROOT/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -n "$NDK"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"
      - run: npm install -g @perryts/perry@0.5.1220
      - run: perry --version
      - run: perry check apps/mobile/src/main.ts --strict

      - name: Provision pinned Perry Android cross runtime
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/perry-cross-aarch64-linux-android.tar.gz"
          runtime_dir="$RUNNER_TEMP/perry-cross-android"
          rm -rf "$runtime_dir"
          mkdir -p "$runtime_dir"
          curl --fail --location --retry 3 --retry-all-errors \
            "https://github.com/PerryTS/perry/releases/download/v${PERRY_VERSION}/perry-cross-aarch64-linux-android.tar.gz" \
            --output "$archive"
          actual="$(sha256sum "$archive" | awk '{print $1}')"
          test "$actual" = "$PERRY_ANDROID_CROSS_SHA256"
          tar -xzf "$archive" -C "$runtime_dir"
          test -f "$runtime_dir/libperry_runtime.a"
          test -f "$runtime_dir/libperry_stdlib.a"
          test -f "$runtime_dir/libperry_ui_android.a"
          jq -e --arg version "$PERRY_VERSION" \
            '.perry_version == $version and .target_triple == "aarch64-linux-android" and (.files | length >= 3)' \
            "$runtime_dir/manifest.json" >/dev/null
          echo "PERRY_RUNTIME_DIR=$runtime_dir" >> "$GITHUB_ENV"

      - run: mkdir -p apps/mobile/release/android
      - run: pnpm build:mobile:android
      - uses: actions/upload-artifact@v7
        with:
          name: harnessdock-mobile-android
          path: apps/mobile/release/android/*
          if-no-files-found: error
          retention-days: 7
