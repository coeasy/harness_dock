name: v020-core-hardening-apply-v2

on:
  push:
    branches:
      - refactor/v0.2.0-shell-first
    paths:
      - '.github/workflows/v020-core-hardening-apply-v2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply v0.2.0 core hardening
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def edit(path, fn):
              p = Path(path)
              before = p.read_text()
              after = fn(before)
              if after == before:
                  raise SystemExit(f'{path}: edit produced no change')
              p.write_text(after)

          def sub_once(text, pattern, replacement, *, flags=0, label='pattern'):
              updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return updated

          # Runtime ready: exact HTTP 127.0.0.1 origin with an explicit ephemeral port.
          def patch_runtime(text):
              text = sub_once(
                  text,
                  r'''    if host != "127\.0\.0\.1" \|\| \(app_url\.scheme\(\) != "http" && app_url\.scheme\(\) != "https"\) \{\n        return Err\("Runtime Web URL 必须使用受管的 127\.0\.0\.1 HTTP\(S\) 地址。"\.into\(\)\);\n    \}\n    if !app_url\.username\(\)\.is_empty\(\) \|\| app_url\.password\(\)\.is_some\(\) \{\n        return Err\("Runtime Web URL 不能包含用户名或密码。"\.into\(\)\);\n    \}\n    let app_port = app_url\.port\(\)\.unwrap_or\(if app_url\.scheme\(\) == "https" \{ 443 \} else \{ 80 \}\);''',
                  '''    if host != "127.0.0.1" || app_url.scheme() != "http" {
              return Err("Runtime Web URL 必须使用受管的 http://127.0.0.1:<port> 地址。".into());
          }
          if !app_url.username().is_empty() || app_url.password().is_some() {
              return Err("Runtime Web URL 不能包含用户名或密码。".into());
          }
          let app_port = app_url
              .port()
              .ok_or_else(|| "Runtime Web URL 必须显式包含受管端口。".to_string())?;''',
                  label='runtime ready URL contract')
              marker = '        let localhost_alias = r#"{\\"url\\":\\"http://localhost:43123/?token=launch\\",\\"host\\":\\"localhost\\",\\"port\\":43123,\\"pid\\":42,\\"dshVersion\\":\\"0.1.2-alpha.1\\"}"#;'
              # Source text contains JSON quotes directly inside a Rust raw string.
              marker = '        let localhost_alias = r#"{"url":"http://localhost:43123/?token=launch","host":"localhost","port":43123,"pid":42,"dshVersion":"0.1.2-alpha.1"}"#;'
              if marker not in text:
                  raise SystemExit('runtime strict tests: localhost anchor missing')
              text = text.replace(marker, marker + '\n        let https_alias = r#"{"url":"https://127.0.0.1:43123/?token=launch","host":"127.0.0.1","port":43123,"pid":42,"dshVersion":"0.1.2-alpha.1"}"#;\n        let missing_port = r#"{"url":"http://127.0.0.1/?token=launch","host":"127.0.0.1","port":43123,"pid":42,"dshVersion":"0.1.2-alpha.1"}"#;', 1)
              anchor = '        assert!(validated_ready(localhost_alias, "0.1.2-alpha.1", 42).is_err());'
              if anchor not in text:
                  raise SystemExit('runtime strict tests: assertion anchor missing')
              text = text.replace(anchor, anchor + '\n        assert!(validated_ready(https_alias, "0.1.2-alpha.1", 42).is_err());\n        assert!(validated_ready(missing_port, "0.1.2-alpha.1", 42).is_err());', 1)
              return text
          edit('apps/tauri/src-tauri/src/runtime.rs', patch_runtime)

          # Harness WebView: same exact origin family + native titlebar fallback when Shell injection fails.
          def patch_harness_window(text):
              strict_fn = '''fn validated_runtime_url(value: &str) -> Result<Url, String> {
              let url = Url::parse(value).map_err(|_| "Runtime URL 无效。".to_string())?;
              if url.scheme() != "http" {
                  return Err("桌面 Harness WebView 只允许受管的 HTTP Runtime。".into());
              }
              let host = url.host_str().ok_or_else(|| "Runtime URL 缺少主机名。".to_string())?;
              if host != "127.0.0.1" {
                  return Err("桌面 Harness WebView 只允许受管的 http://127.0.0.1:<port> Runtime。".into());
              }
              if !url.username().is_empty() || url.password().is_some() {
                  return Err("Runtime URL 不能包含用户名或密码。".into());
              }
              let port = url.port().ok_or_else(|| "Runtime URL 必须显式包含受管端口。".to_string())?;
              if port == 0 {
                  return Err("Runtime URL 端口无效。".into());
              }
              Ok(url)
          }
          '''
              text = sub_once(text, r'fn validated_runtime_url\(value: &str\) -> Result<Url, String> \{.*?\n\}\n(?=\n/// dsh 0\.1\.2\+)', strict_fn.rstrip('\n'), flags=re.S, label='Harness managed URL validator')
              text = sub_once(
                  text,
                  r'''    if let Err\(error\) = window\.eval\(init_script\(\)\) \{\n        // The Harness document remains the primary surface even if a best-\n        // effort toolbar injection is rejected by a WebView implementation\.\n        // Menu and native commands remain available for a later retry\.\n        eprintln!\("Unable to install Harness Shell; continuing with Harness Web: \{error\}"\);\n    \}''',
                  '''    match window.eval(init_script()) {
              Ok(()) => {
                  let _ = window.set_decorations(false);
              }
              Err(error) => {
                  // The Shell is optional. Restore the native titlebar so a failed
                  // injection can never strand a borderless primary window.
                  eprintln!("Unable to install Harness Shell; restoring native window controls: {error}");
                  let _ = window.set_decorations(true);
              }
          }''',
                  label='Shell native titlebar fail-open')
              needle = '''        let control = app
              .get_webview_window("main")
              .ok_or_else(|| "HarnessDock 控制页窗口不存在。".to_string())?;
          control
              .show()'''
              replacement = '''        let control = app
              .get_webview_window("main")
              .ok_or_else(|| "HarnessDock 控制页窗口不存在。".to_string())?;
          let surface = app
              .state::<crate::AppState>()
              .startup_recovery_error
              .lock()
              .map(|recovery| if recovery.is_some() { "recovery" } else { "gateway-host" })
              .unwrap_or("recovery");
          if let Ok(value) = serde_json::to_string(surface) {
              let _ = control.eval(format!("window.__harnessDockSetSurface?.({value})"));
          }
          control
              .show()'''
              if needle not in text:
                  raise SystemExit('control_show surface anchor missing')
              return text.replace(needle, replacement, 1)
          edit('apps/tauri/src-tauri/src/harness_window.rs', patch_harness_window)

          # Shell service metadata must advertise every native bridge command.
          def patch_shell_service(text):
              needle = "    'runtime.clear-quarantine',\n    'diagnostics.open',"
              if needle not in text:
                  raise SystemExit('shell service capability anchor missing')
              return text.replace(needle, "    'runtime.clear-quarantine',\n    'gateway.manage',\n    'diagnostics.open',", 1)
          edit('packages/plugin-harness-shell/src/index.ts', patch_shell_service)

          # Explicit local-control surface modes.
          def patch_app(text):
              needle = "  let currentRuntime\n  let desktopStartup\n\n  function showRecoveryCards() {"
              insert = """  let currentRuntime
          let desktopStartup
          let surfaceMode = 'hidden'

          function setSurfaceMode(mode) {
            surfaceMode = mode
            const visibility = {
              recovery: ['desktop-card'],
              'gateway-host': ['gateway-host-card'],
              'mobile-remote': ['mobile-remote-card'],
              hidden: [],
            }
            const visible = new Set(visibility[mode] || [])
            for (const id of ['desktop-card', 'gateway-host-card', 'mobile-remote-card']) {
              $(id)?.classList.toggle('hidden', !visible.has(id))
            }
          }

          window.__harnessDockSetSurface = (mode) => {
            if (!['recovery', 'gateway-host', 'mobile-remote', 'hidden'].includes(mode)) return
            setSurfaceMode(mode)
            if (mode === 'gateway-host') void refreshVisibleControl()
          }

          function showRecoveryCards() {"""
              if needle not in text:
                  raise SystemExit('control surface mode anchor missing')
              text = text.replace(needle, insert, 1)
              text = text.replace("    $('desktop-card')?.classList.remove('hidden')\n    $('gateway-host-card')?.classList.add('hidden')", "    setSurfaceMode('recovery')", 1)
              text = text.replace("        $('gateway-host-card')?.classList.remove('hidden')", "        setSurfaceMode('gateway-host')", 1)
              text = text.replace("        $('mobile-remote-card').classList.remove('hidden')", "        setSurfaceMode('mobile-remote')", 1)
              return text
          edit('apps/tauri/web/app.js', patch_app)

          # Active documentation must state the actual frozen ACL and command surface.
          def patch_readme(text):
              old = '- loopback IPv4、localhost、IPv6 `::1` 根路径和子路径统一纳入外壳 ACL，避免 Harness Web 首屏或菜单调用出现 `Command ... not allowed by ACL`。'
              if old not in text:
                  raise SystemExit('README old ACL statement missing')
              return text.replace(old, '- 桌面 Harness Shell 权限只授予受管的 `http://127.0.0.1:<ephemeral-port>` Runtime origin；localhost、IPv6、HTTPS alias 与其它本机服务均不获得外壳 IPC。', 1)
          edit('README.md', patch_readme)

          def patch_impl_doc(text):
              old = '| `runtime.clear-quarantine` | 支持 |\n| `diagnostics.open` | 支持 |'
              if old not in text:
                  raise SystemExit('implementation command table anchor missing')
              text = text.replace(old, '| `runtime.clear-quarantine` | 支持 |\n| `gateway.manage` | 支持 |\n| `diagnostics.open` | 支持 |', 1)
              old2 = '远程 Harness/Gateway 页面不获得本地 Tauri capability；只有校验过的 loopback Harness WebView 才获得 `harness-shell` capability。'
              if old2 not in text:
                  raise SystemExit('implementation ACL sentence missing')
              return text.replace(old2, '远程 Harness/Gateway 页面不获得本地 Tauri capability；只有与当前受管 `http://127.0.0.1:<port>` Runtime origin 完全一致的 Harness WebView 才获得 `harness-shell` capability。', 1)
          edit('docs/plan/v0.2.0-shell-first-implementation.md', patch_impl_doc)

          # Existing parity tests: update old assertions to the new frozen contract.
          def patch_tauri_host(text):
              old = "    expect(harnessWindow).toContain('127.0.0.1/localhost Runtime')"
              if old not in text:
                  raise SystemExit('tauri-host old Runtime URL assertion missing')
              text = text.replace(old, "    expect(harnessWindow).toContain('http://127.0.0.1:<port> Runtime')\n    expect(harnessWindow).toContain('window.set_decorations(true)')\n    expect(harnessWindow).toContain('window.set_decorations(false)')\n    expect(runtime).toContain('app_url.scheme() != \\\"http\\\"')", 1)
              old = "    const shellAsset = readFileSync(path.join(repoRoot, 'packages/plugin-harness-shell/src/web/shell.js'), 'utf8')"
              text = text.replace(old, old + "\n    const shellService = readFileSync(path.join(repoRoot, 'packages/plugin-harness-shell/src/index.ts'), 'utf8')", 1)
              old = "    expect(shell).toContain(\"'gateway.manage': 'control_show'\")"
              text = text.replace(old, old + "\n    expect(shellService).toContain(\"'gateway.manage'\")", 1)
              old = "    expect(web).toContain(\"gateway-host-card')?.classList.remove('hidden')\")\n    expect(web).toContain(\"gateway-host-card')?.classList.add('hidden')\")"
              if old not in text:
                  raise SystemExit('tauri-host old control-card assertions missing')
              text = text.replace(old, "    expect(web).toContain('function setSurfaceMode(mode)')\n    expect(web).toContain(\"setSurfaceMode('gateway-host')\")\n    expect(web).toContain(\"setSurfaceMode('mobile-remote')\")\n    expect(harnessWindow).toContain('__harnessDockSetSurface')", 1)
              return text
          edit('tests/parity/tauri-host.test.ts', patch_tauri_host)

          def patch_fail_open_test(text):
              anchor = "  it('uses the packaged Node by default and requires an explicit system-Node opt-in', () => {"
              if anchor not in text:
                  raise SystemExit('fail-open test insertion anchor missing')
              block = '''  it('falls back to native window controls when the optional shell cannot be installed', () => {
            const harnessWindow = read('apps/tauri/src-tauri/src/harness_window.rs')
            const runtime = read('apps/tauri/src-tauri/src/runtime.rs')
            const shellService = read('packages/plugin-harness-shell/src/index.ts')
            const shellBundle = read('packages/plugin-harness-shell/lib/index.js')
            expect(harnessWindow).toContain('window.set_decorations(true)')
            expect(harnessWindow).toContain('window.set_decorations(false)')
            expect(harnessWindow).toContain('http://127.0.0.1:<port> Runtime')
            expect(runtime).toContain('app_url.scheme() != "http"')
            expect(shellService).toContain("'gateway.manage'")
            expect(shellBundle).toContain('"gateway.manage"')
          })

          '''
              return text.replace(anchor, block + anchor, 1)
          edit('tests/parity/tauri-shell-fail-open.test.ts', patch_fail_open_test)

          Path('tests/parity/v020-core-contract.test.ts').write_text('''import { readFileSync } from 'node:fs'\nimport path from 'node:path'\nimport { fileURLToPath } from 'node:url'\nimport { describe, expect, it } from 'vitest'\n\nconst repoRoot = path.resolve(path.dirname(fileURLToPath(import.meta.url)), '../..')\nconst read = (relative: string) => readFileSync(path.join(repoRoot, relative), 'utf8')\nconst readJson = (relative: string) => JSON.parse(read(relative))\n\ndescribe('HarnessDock v0.2.0 frozen core contract', () => {\n  it('uses one exact managed Runtime origin across spawn, validation and ACL', () => {\n    const runtime = read('apps/tauri/src-tauri/src/runtime.rs')\n    const harnessWindow = read('apps/tauri/src-tauri/src/harness_window.rs')\n    const capability = readJson('apps/tauri/src-tauri/capabilities/harness-shell.json')\n    expect(runtime).toContain('.args(["--host", "127.0.0.1", "--port", "0", "--no-open"])')\n    expect(runtime).toContain('app_url.scheme() != "http"')\n    expect(runtime).toContain('Runtime Web URL 必须显式包含受管端口')\n    expect(harnessWindow).toContain('url.scheme() != "http"')\n    expect(harnessWindow).toContain('host != "127.0.0.1"')\n    expect(harnessWindow).toContain('Runtime URL 必须显式包含受管端口')\n    expect(capability.remote.urls).toEqual(['http://127.0.0.1:*/*', 'http://127.0.0.1:*'])\n  })\n\n  it('keeps Shell optional but restores native window controls on injection failure', () => {\n    const source = read('apps/tauri/src-tauri/src/harness_window.rs')\n    expect(source).toContain('restoring native window controls')\n    expect(source).toContain('window.set_decorations(true)')\n    expect(source).toContain('window.set_decorations(false)')\n  })\n\n  it('keeps Shell service capabilities aligned with the native bridge', () => {\n    const service = read('packages/plugin-harness-shell/src/index.ts')\n    const bundle = read('packages/plugin-harness-shell/lib/index.js')\n    const bridge = read('apps/tauri/src-tauri/src/harness_shell.rs')\n    for (const command of ['window.minimize', 'window.toggleMaximize', 'window.state', 'window.close', 'web.reload', 'web.restart', 'runtime.safe-mode', 'runtime.clear-quarantine', 'gateway.manage', 'diagnostics.open', 'app.update.check', 'app.update.install', 'app.quit']) {\n      expect(service).toContain(`'${command}'`)\n      expect(bundle).toContain(`"${command}"`)\n      expect(bridge).toContain(`'${command}'`)\n    }\n  })\n\n  it('uses explicit recovery/gateway/mobile control-page modes', () => {\n    const web = read('apps/tauri/web/app.js')\n    const host = read('apps/tauri/src-tauri/src/harness_window.rs')\n    expect(web).toContain("let surfaceMode = 'hidden'")\n    expect(web).toContain('function setSurfaceMode(mode)')\n    expect(web).toContain("setSurfaceMode('recovery')")\n    expect(web).toContain("setSurfaceMode('gateway-host')")\n    expect(web).toContain("setSurfaceMode('mobile-remote')")\n    expect(host).toContain('__harnessDockSetSurface')\n  })\n\n  it('keeps Android candidate publication unsigned-compatible by product policy', () => {\n    const candidate = read('.github/workflows/tauri-candidate.yml')\n    const guard = read('scripts/check-android-package.mjs')\n    expect(candidate).not.toContain('ANDROID_KEY_BASE64')\n    expect(candidate).not.toContain('ANDROID_KEY_ALIAS')\n    expect(candidate).not.toContain('ANDROID_KEY_PASSWORD')\n    expect(candidate).not.toContain('configure-android-signing')\n    expect(guard).not.toContain('apksigner')\n    expect(guard).not.toContain('jarsigner')\n    expect(candidate).toContain('Verify Android release package')\n  })\n\n  it('keeps active documentation aligned with the exact Runtime ACL', () => {\n    const readme = read('README.md')\n    const implementation = read('docs/plan/v0.2.0-shell-first-implementation.md')\n    expect(readme).toContain('http://127.0.0.1:<ephemeral-port>')\n    expect(readme).not.toContain('loopback IPv4、localhost、IPv6 `::1`')\n    expect(implementation).toContain('http://127.0.0.1:<port>')\n    expect(implementation).toContain('`gateway.manage`')\n  })\n})\n''')
          PY
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Rebuild publishable Harness Shell bundle
        run: pnpm --filter @dsh/plugin-harness-shell build
      - name: Format Rust changes
        run: cargo fmt --manifest-path apps/tauri/src-tauri/Cargo.toml
      - name: Validate active contracts
        run: |
          pnpm check:versions
          pnpm test
          cargo fmt --manifest-path apps/tauri/src-tauri/Cargo.toml -- --check
      - name: Commit hardening changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'coeasy'
          git config user.email 'mdonetwo@yeah.net'
          git add README.md docs/plan/v0.2.0-shell-first-implementation.md apps/tauri/src-tauri/src/runtime.rs apps/tauri/src-tauri/src/harness_window.rs apps/tauri/web/app.js packages/plugin-harness-shell/src/index.ts packages/plugin-harness-shell/lib/index.js packages/plugin-harness-shell/web/shell.js tests/parity/tauri-host.test.ts tests/parity/tauri-shell-fail-open.test.ts tests/parity/v020-core-contract.test.ts
          git diff --cached --quiet && { echo 'No hardening changes to commit.'; exit 0; }
          git commit -m 'refactor: harden v0.2.0 managed host contract'
          git push origin HEAD:refactor/v0.2.0-shell-first
