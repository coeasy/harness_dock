name: stage-runtime-cache-minimal

on:
  push:
    branches:
      - fix/v0.1.1-runtime-cache-hardening

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/v0.1.1-runtime-cache-hardening
          fetch-depth: 1
      - name: Stage minimal cache hardening from main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          def from_main(path: str) -> str:
              return subprocess.check_output(['git', 'show', f'origin/main:{path}'], text=True)

          release = from_main('.github/workflows/release.yml')
          lines = release.splitlines()
          out = []
          skip_restore_value = False
          for line in lines:
              if skip_restore_value:
                  if line.startswith('            dsh-runtime-'):
                      skip_restore_value = False
                      continue
                  skip_restore_value = False
              if 'key: dsh-runtime-' in line and 'hashFiles(' in line:
                  line = re.sub(
                      r"hashFiles\([^\n]+\)",
                      "hashFiles('packages/docs-sync/origin.json', 'packages/client-runtime/src/**/*.ts', 'packages/client-runtime/package.json', 'pnpm-lock.yaml')",
                      line,
                  )
              if line.strip() == 'restore-keys: |':
                  skip_restore_value = True
                  continue
              out.append(line)
          release = '\n'.join(out) + '\n'

          prepare = from_main('packages/client-runtime/src/prepare-cli.ts')
          if 'const RUNTIME_LAYOUT_VERSION = 2' not in prepare:
              raise SystemExit('expected runtime layout v2 on main')
          prepare = prepare.replace('const RUNTIME_LAYOUT_VERSION = 2', 'const RUNTIME_LAYOUT_VERSION = 3', 1)

          Path('tmp').mkdir(exist_ok=True)
          Path('tmp/release-cache-minimal.yml').write_text(release)
          Path('tmp/prepare-cache-minimal.ts').write_text(prepare)
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tmp/release-cache-minimal.yml tmp/prepare-cache-minimal.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: stage minimal runtime cache hardening"
          git push origin HEAD:fix/v0.1.1-runtime-cache-hardening
