name: ci

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm check:versions
      - run: pnpm check:release
      - run: node scripts/check-mobile-contract.mjs
      - run: pnpm check:embedded-runtime
      # Gateway integration requests use an 8s production timeout and Windows
      # can also need bounded fs.rm / PowerShell cold-start time while Defender
      # and indexers release package/script resources. `test:ci` owns the real
      # Vitest timeout flags; do not pass them behind a literal `--`, which
      # Vitest treats as the end of options and silently leaves the 5s default.
      - run: pnpm test:ci

  tauri-source:
    needs: test
    if: needs.test.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri Linux source dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2
      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/tauri/src-tauri
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Verify embedded Full Runtime source contract
        run: pnpm check:embedded-runtime
      - run: pnpm --filter @dsh/plugin-embedded-client build
      - run: pnpm --filter @dsh/plugin-harness-shell build
      - name: Verify publishable Harness Shell package
        run: node scripts/check-shell-package.mjs
      - name: Verify canonical Tauri module layout
        run: node scripts/check-tauri-source-layout.mjs
      - name: Check Tauri Rust formatting
        run: cargo fmt --manifest-path apps/tauri/src-tauri/Cargo.toml -- --check
      - name: Check Tauri Native Host
        run: cargo check --locked --manifest-path apps/tauri/src-tauri/Cargo.toml
      - name: Clippy Tauri Native Host
        run: cargo clippy --locked --manifest-path apps/tauri/src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Test Runtime/Surface/Gateway/Update actors
        run: cargo test --locked --manifest-path apps/tauri/src-tauri/Cargo.toml --lib
      - name: Verify Tauri version contract
        shell: bash
        run: |
          set -euo pipefail
          root_version="$(node -p "require('./package.json').version")"
          tauri_version="$(node -p "require('./apps/tauri/src-tauri/tauri.conf.json').version")"
          cargo_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' apps/tauri/src-tauri/Cargo.toml | head -1)"
          test "$tauri_version" = "$root_version"
          test "$cargo_version" = "$root_version"

  vscode-package:
    needs: test
    if: needs.test.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Build and package VS Code companion
        run: pnpm --filter ./apps/vscode run pack:vsix
      - name: Verify VSIX output contract
        run: node scripts/check-vscode-package.mjs

  # The portable-Node bootstrap has historically been validated only with
  # `bash -n` / a PowerShell parse, never actually downloaded anything. Run it
  # for real on POSIX, once per mirror primary, so a nodejs.org manifest change
  # cannot fail only on a bare dev machine.
  node-bootstrap:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            mirror: nodejs
          - os: macos-latest
            mirror: nodejs
          - os: ubuntu-latest
            mirror: npmmirror
          - os: macos-latest
            mirror: npmmirror
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Bootstrap portable Node and verify the published artifact
        shell: bash
        run: |
          set -euo pipefail
          node_version="$(sed -n 's/.*"node"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' scripts/versions.json | head -1)"
          test -n "$node_version"
          case "${{ matrix.mirror }}" in
            npmmirror)
              export NODE_DOWNLOAD_BASES="https://npmmirror.com/mirrors/node/v${node_version} https://nodejs.org/dist/v${node_version}"
              ;;
            *)
              export NODE_DOWNLOAD_BASES="https://nodejs.org/dist/v${node_version} https://npmmirror.com/mirrors/node/v${node_version}"
              ;;
          esac
          bash -n scripts/bootstrap-node.sh
          bash scripts/bootstrap-node.sh
          test -s .local-tools/node-home.txt
          node_home="$(cat .local-tools/node-home.txt)"
          test -x "$node_home/bin/node"
          test -d ".local-cache/node"
          portable_version="$($node_home/bin/node --version | sed 's/^v//')"
          test "$portable_version" = "$node_version"
          "$node_home/bin/node" scripts/node-version-check.cjs
          # A second invocation must be a no-op on the already-installed tree.
          bash scripts/bootstrap-node.sh

  sync:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm sync:dsh
      - name: Publish sync branch without requiring Actions PR permission
        shell: bash
        env:
          SYNC_BRANCH: chore/sync-dsh-origin
        run: |
          set -euo pipefail

          if [ -z "$(git status --porcelain)" ]; then
            echo "DSH origin is already current; nothing to publish."
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$SYNC_BRANCH"
          git add -A
          git commit -m 'chore: sync HarnessDock dsh origin'

          remote_sha="$(git ls-remote --heads origin "refs/heads/${SYNC_BRANCH}" | awk '{print $1}')"
          if [ -n "$remote_sha" ]; then
            git push --force-with-lease="refs/heads/${SYNC_BRANCH}:${remote_sha}" origin "HEAD:refs/heads/${SYNC_BRANCH}"
          else
            git push origin "HEAD:refs/heads/${SYNC_BRANCH}"
          fi

          {
            echo '### DSH origin sync ready for review'
            echo
            echo "Changes were pushed to \`${SYNC_BRANCH}\`."
            echo 'The workflow intentionally does not create a pull request with GITHUB_TOKEN, so repository settings that disallow Actions-created PRs cannot fail the scheduled sync.'
            echo 'Open or update the pull request from this branch with a normal user/app token after reviewing the upstream changelog.'
          } >> "$GITHUB_STEP_SUMMARY"
