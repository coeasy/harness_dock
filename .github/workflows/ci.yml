name: ci

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm test

  tauri-source:
    needs: test
    if: needs.test.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri Linux source dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2
      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/tauri/src-tauri
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm --filter @dsh/plugin-embedded-client build
      - name: Validate Gateway sidecar bundle
        run: pnpm --filter @dsh/desktop exec esbuild ../../packages/bootstrap/src/gateway-sidecar.ts --bundle --platform=node --format=esm --target=node22 --outfile=/tmp/harnessdock-gateway-sidecar.mjs
      - name: Check Tauri Rust host
        run: cargo check --manifest-path apps/tauri/src-tauri/Cargo.toml
      - name: Test Tauri runtime recovery logic
        run: cargo test --manifest-path apps/tauri/src-tauri/Cargo.toml --lib
      - name: Verify Tauri version contract
        shell: bash
        run: |
          set -euo pipefail
          root_version="$(node -p "require('./package.json').version")"
          tauri_version="$(node -p "require('./apps/tauri/src-tauri/tauri.conf.json').version")"
          cargo_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' apps/tauri/src-tauri/Cargo.toml | head -1)"
          test "$tauri_version" = "$root_version"
          test "$cargo_version" = "$root_version"
          test -s /tmp/harnessdock-gateway-sidecar.mjs

  sync:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm sync:dsh
      - uses: peter-evans/create-pull-request@v8
        with:
          branch: chore/sync-dsh-origin
          title: 'chore: sync HarnessDock dsh origin to latest documented version'
          commit-message: 'chore: sync HarnessDock dsh origin'
          body: |
            Automated docs-sync: git tag ∩ npm exact version, never `latest`.
            Review changelog before merging.
