name: ci

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm check:versions
      - run: pnpm check:embedded-runtime
      # Gateway integration requests use an 8s production timeout and Windows
      # can also need bounded fs.rm retries while Defender/indexers release
      # package directories. Keep the test harness above those real bounds;
      # this changes only the Vitest failure ceiling, not production timeouts.
      - run: pnpm test -- --testTimeout=20000 --hookTimeout=20000

  tauri-source:
    needs: test
    if: needs.test.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri Linux source dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2
      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/tauri/src-tauri
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Verify embedded Full Runtime source contract
        run: pnpm check:embedded-runtime
      - run: pnpm --filter @dsh/plugin-embedded-client build
      - run: pnpm --filter @dsh/plugin-harness-shell build
      - name: Verify publishable Harness Shell package
        run: node scripts/check-shell-package.mjs
      - name: Check Tauri Rust formatting
        run: cargo fmt --manifest-path apps/tauri/src-tauri/Cargo.toml -- --check
      - name: Check Tauri Native Host
        run: cargo check --locked --manifest-path apps/tauri/src-tauri/Cargo.toml
      - name: Test Runtime/Surface/Gateway/Update actors
        run: cargo test --locked --manifest-path apps/tauri/src-tauri/Cargo.toml --lib
      - name: Verify Tauri version contract
        shell: bash
        run: |
          set -euo pipefail
          root_version="$(node -p "require('./package.json').version")"
          tauri_version="$(node -p "require('./apps/tauri/src-tauri/tauri.conf.json').version")"
          cargo_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' apps/tauri/src-tauri/Cargo.toml | head -1)"
          test "$tauri_version" = "$root_version"
          test "$cargo_version" = "$root_version"
          test -s apps/tauri/src-tauri/Cargo.lock
          test -s apps/tauri/src-tauri/src/runtime/mod.rs
          test -s apps/tauri/src-tauri/src/gateway_host/mod.rs
          test -s apps/tauri/src-tauri/src/harness_window/mod.rs
          test -s apps/tauri/src-tauri/src/util.rs
          test -s apps/tauri/src-tauri/src/error.rs

  # Exercise the real portable Node download on POSIX, once per primary mirror.
  # The same gate also activates the extracted Node in the parent shell and
  # proves npm resolves back into that exact portable home.
  node-bootstrap:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            mirror: nodejs
          - os: macos-latest
            mirror: nodejs
          - os: ubuntu-latest
            mirror: npmmirror
          - os: macos-latest
            mirror: npmmirror
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Bootstrap portable Node, activate it, and verify the published artifact
        shell: bash
        run: |
          set -euo pipefail
          node_version="$(sed -n 's/.*"node"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' scripts/versions.json | head -1)"
          test -n "$node_version"
          case "${{ matrix.mirror }}" in
            npmmirror)
              export NODE_DOWNLOAD_BASES="https://npmmirror.com/mirrors/node/v${node_version} https://nodejs.org/dist/v${node_version}"
              ;;
            *)
              export NODE_DOWNLOAD_BASES="https://nodejs.org/dist/v${node_version} https://npmmirror.com/mirrors/node/v${node_version}"
              ;;
          esac
          rm -rf .local-tools .local-cache/node
          bash -n scripts/bootstrap-node.sh
          bash scripts/bootstrap-node.sh
          test -s .local-tools/node-home.txt
          node_home="$(cat .local-tools/node-home.txt)"
          test -x "$node_home/bin/node"
          test -d .local-cache/node
          portable_version="$($node_home/bin/node --version | sed 's/^v//')"
          test "$portable_version" = "$node_version"
          "$node_home/bin/node" scripts/node-version-check.cjs
          export PATH="$node_home/bin:$PATH"
          npm_command="$(command -v npm)"
          node scripts/verify-build-toolchain.mjs --node-home "$node_home" --npm-command "$npm_command"
          bash scripts/bootstrap-node.sh

  # Windows previously parsed bootstrap-node.ps1 but never executed its download,
  # checksum, extraction, node-home, parent PATH activation, and npm shim contract.
  # Exercise both mirrors for real so .cmd invocation regressions fail here quickly.
  node-bootstrap-windows:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        mirror: [nodejs, npmmirror]
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Bootstrap portable Node, activate it, and verify the published Windows artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $nodeVersion = [string](Get-Content scripts/versions.json -Raw | ConvertFrom-Json).node
          if (-not $nodeVersion) { throw 'scripts/versions.json has no node version' }
          if ('${{ matrix.mirror }}' -eq 'npmmirror') {
            $env:NODE_DOWNLOAD_BASES = "https://npmmirror.com/mirrors/node/v$nodeVersion https://nodejs.org/dist/v$nodeVersion"
          }
          else {
            $env:NODE_DOWNLOAD_BASES = "https://nodejs.org/dist/v$nodeVersion https://npmmirror.com/mirrors/node/v$nodeVersion"
          }
          Remove-Item .local-tools -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item .local-cache/node -Recurse -Force -ErrorAction SilentlyContinue
          ./scripts/bootstrap-node.ps1
          if (-not (Test-Path .local-tools/node-home.txt)) { throw 'node-home.txt missing' }
          $nodeHome = (Get-Content .local-tools/node-home.txt -Raw).Trim()
          $nodeExe = Join-Path $nodeHome 'node.exe'
          if (-not (Test-Path $nodeExe)) { throw "portable node missing: $nodeExe" }
          if (-not (Test-Path .local-cache/node)) { throw 'portable Node cache missing' }
          $portableVersion = (& $nodeExe --version).TrimStart('v')
          if ($portableVersion -ne $nodeVersion) { throw "portable Node $portableVersion != pinned $nodeVersion" }
          & $nodeExe scripts/node-version-check.cjs
          if ($LASTEXITCODE -ne 0) { throw 'portable Node failed version gate' }
          $env:PATH = "$nodeHome;$env:PATH"
          $npmCmd = (Get-Command npm.cmd -CommandType Application -ErrorAction Stop).Source
          & $nodeExe scripts/verify-build-toolchain.mjs --node-home $nodeHome --npm-command $npmCmd
          if ($LASTEXITCODE -ne 0) { throw 'portable Node activation verifier failed' }
          ./scripts/bootstrap-node.ps1

  sync:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm sync:dsh
      - name: Publish sync branch without requiring Actions PR permission
        shell: bash
        env:
          SYNC_BRANCH: chore/sync-dsh-origin
        run: |
          set -euo pipefail

          if [ -z "$(git status --porcelain)" ]; then
            echo "DSH origin is already current; nothing to publish."
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$SYNC_BRANCH"
          git add -A
          git commit -m 'chore: sync HarnessDock dsh origin'

          remote_sha="$(git ls-remote --heads origin "refs/heads/${SYNC_BRANCH}" | awk '{print $1}')"
          if [ -n "$remote_sha" ]; then
            git push --force-with-lease="refs/heads/${SYNC_BRANCH}:${remote_sha}" origin "HEAD:refs/heads/${SYNC_BRANCH}"
          else
            git push origin "HEAD:refs/heads/${SYNC_BRANCH}"
          fi

          {
            echo '### DSH origin sync ready for review'
            echo
            echo "Changes were pushed to \`${SYNC_BRANCH}\`."
            echo 'The workflow intentionally does not create a pull request with GITHUB_TOKEN, so repository settings that disallow Actions-created PRs cannot fail the scheduled sync.'
            echo 'Open or update the pull request from this branch with a normal user/app token after reviewing the upstream changelog.'
          } >> "$GITHUB_STEP_SUMMARY"
