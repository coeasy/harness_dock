name: ci

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm check:versions
      - run: pnpm check:release
      - run: pnpm test

  source-pack:
    needs: test
    if: needs.test.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - name: Read exact upstream commit
        id: origin
        shell: bash
        run: |
          commit=$(node -p "require('./packages/docs-sync/origin.json').gitCommit")
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ steps.origin.outputs.commit }}
          path: upstream
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install upstream pnpm toolchain
        run: npm install --global pnpm@11.7.0
      - name: Pack exact upstream release family
        run: bash scripts/pack-upstream-dsh.sh upstream upstream-package-set
      - uses: actions/upload-artifact@v7
        with:
          name: dsh-source-package-set
          path: upstream-package-set
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  prepare-runtime:
    needs: source-pack
    if: needs.source-pack.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            os: win
            platform: win32
            arch: x64
            runtime_dir: runtimes/pack
          - runner: ubuntu-latest
            os: linux
            platform: linux
            arch: x64
            runtime_dir: runtimes/pack
          - runner: macos-latest
            os: mac
            platform: darwin
            arch: x64
            runtime_dir: runtimes/pack-x64
          - runner: macos-latest
            os: mac
            platform: darwin
            arch: arm64
            runtime_dir: runtimes/pack-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - uses: actions/download-artifact@v8
        with:
          name: dsh-source-package-set
          path: upstream-package-set
      - name: Prepare target runtime
        run: pnpm --filter @dsh/client-runtime bundle-runtime
        env:
          DSH_PACKAGE_SET_DIR: upstream-package-set
          DSH_RUNTIME_PLATFORM: ${{ matrix.platform }}
          DSH_RUNTIME_ARCH: ${{ matrix.arch }}
          DSH_RUNTIME_DIR: ${{ matrix.runtime_dir }}
      - uses: actions/upload-artifact@v7
        with:
          name: runtime-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ matrix.runtime_dir }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          include-hidden-files: true

  pack:
    needs: prepare-runtime
    if: needs.prepare-runtime.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            os: win
            platform: win32
            scenario: thin
            arch: x64
            runtime_dir: runtimes/pack
            command: node apps/desktop/scripts/pack.mjs --os win --scenario thin --arch x64
            packaged_runtime: apps/desktop/release/thin/win-unpacked/resources/dsh-runtime
            packaged_plugin: apps/desktop/release/thin/win-unpacked/resources/plugin-embedded-client/index.js
            electron: apps/desktop/release/thin/win-unpacked/HarnessDock.exe
          - runner: windows-latest
            os: win
            platform: win32
            scenario: full
            arch: x64
            runtime_dir: runtimes/pack
            command: node apps/desktop/scripts/pack.mjs --os win --scenario full --arch x64
            packaged_runtime: apps/desktop/release/full/win-unpacked/resources/dsh-runtime
            packaged_plugin: apps/desktop/release/full/win-unpacked/resources/plugin-embedded-client/index.js
            electron: ''
          - runner: ubuntu-latest
            os: linux
            platform: linux
            scenario: thin
            arch: x64
            runtime_dir: runtimes/pack
            command: node apps/desktop/scripts/pack.mjs --os linux --scenario thin --arch x64
            packaged_runtime: apps/desktop/release/thin/linux-unpacked/resources/dsh-runtime
            packaged_plugin: apps/desktop/release/thin/linux-unpacked/resources/plugin-embedded-client/index.js
            electron: apps/desktop/release/thin/linux-unpacked/HarnessDock
          - runner: ubuntu-latest
            os: linux
            platform: linux
            scenario: full
            arch: x64
            runtime_dir: runtimes/pack
            command: node apps/desktop/scripts/pack.mjs --os linux --scenario full --arch x64
            packaged_runtime: apps/desktop/release/full/linux-unpacked/resources/dsh-runtime
            packaged_plugin: apps/desktop/release/full/linux-unpacked/resources/plugin-embedded-client/index.js
            electron: ''
          - runner: macos-latest
            os: mac
            platform: darwin
            scenario: thin
            arch: x64
            runtime_dir: runtimes/pack-x64
            command: node apps/desktop/scripts/pack.mjs --os mac --scenario thin --arch x64
            packaged_runtime: apps/desktop/release/thin/mac/HarnessDock.app/Contents/Resources/dsh-runtime
            packaged_plugin: apps/desktop/release/thin/mac/HarnessDock.app/Contents/Resources/plugin-embedded-client/index.js
            electron: apps/desktop/release/thin/mac/HarnessDock.app/Contents/MacOS/HarnessDock
          - runner: macos-latest
            os: mac
            platform: darwin
            scenario: full
            arch: x64
            runtime_dir: runtimes/pack-x64
            command: node apps/desktop/scripts/pack.mjs --os mac --scenario full --arch x64
            packaged_runtime: apps/desktop/release/full/mac/HarnessDock.app/Contents/Resources/dsh-runtime
            packaged_plugin: apps/desktop/release/full/mac/HarnessDock.app/Contents/Resources/plugin-embedded-client/index.js
            electron: ''
          - runner: macos-latest
            os: mac
            platform: darwin
            scenario: thin
            arch: arm64
            runtime_dir: runtimes/pack-arm64
            command: node apps/desktop/scripts/pack.mjs --os mac --scenario thin --arch arm64
            packaged_runtime: apps/desktop/release/thin/mac-arm64/HarnessDock.app/Contents/Resources/dsh-runtime
            packaged_plugin: apps/desktop/release/thin/mac-arm64/HarnessDock.app/Contents/Resources/plugin-embedded-client/index.js
            electron: apps/desktop/release/thin/mac-arm64/HarnessDock.app/Contents/MacOS/HarnessDock
          - runner: macos-latest
            os: mac
            platform: darwin
            scenario: full
            arch: arm64
            runtime_dir: runtimes/pack-arm64
            command: node apps/desktop/scripts/pack.mjs --os mac --scenario full --arch arm64
            packaged_runtime: apps/desktop/release/full/mac-arm64/HarnessDock.app/Contents/Resources/dsh-runtime
            packaged_plugin: apps/desktop/release/full/mac-arm64/HarnessDock.app/Contents/Resources/plugin-embedded-client/index.js
            electron: ''
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 55
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Cache electron-builder downloads (Unix)
        if: runner.os != 'Windows'
        uses: actions/cache@v6
        with:
          path: ~/.cache/electron-builder
          key: electron-builder-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Cache electron-builder downloads (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v6
        with:
          path: ~/AppData/Local/electron-builder/Cache
          key: electron-builder-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile --prefer-offline
      - uses: actions/download-artifact@v8
        with:
          name: runtime-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ matrix.runtime_dir }}
      - name: Repair and verify transported runtime
        run: pnpm --filter @dsh/client-runtime bundle-runtime
        env:
          DSH_RUNTIME_PLATFORM: ${{ matrix.platform }}
          DSH_RUNTIME_ARCH: ${{ matrix.arch }}
          DSH_RUNTIME_DIR: ${{ matrix.runtime_dir }}
      - name: Build desktop package
        run: ${{ matrix.command }}
        env:
          GH_OWNER: ${{ github.repository_owner }}
          GH_REPO: ${{ github.event.repository.name }}
          DSH_SKIP_RUNTIME_PREPARE: '1'
          DSH_RUNTIME_DIR: ${{ matrix.runtime_dir }}
      - name: Smoke packaged Full runtime
        if: matrix.scenario == 'full'
        run: pnpm --filter @dsh/client-runtime smoke-runtime -- --runtime-dir ${{ matrix.packaged_runtime }} --plugin ${{ matrix.packaged_plugin }}
      - name: Smoke packaged Thin runtime
        if: matrix.scenario == 'thin'
        run: pnpm --filter @dsh/client-runtime smoke-thin-runtime -- --runtime-dir ${{ matrix.packaged_runtime }} --plugin ${{ matrix.packaged_plugin }} --electron ${{ matrix.electron }}
      - name: Validate package size budget
        run: pnpm check:size
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.os }}-${{ matrix.scenario }}-${{ matrix.arch }}
          path: |
            apps/desktop/release/${{ matrix.scenario }}/*.exe
            apps/desktop/release/${{ matrix.scenario }}/*.dmg
            apps/desktop/release/${{ matrix.scenario }}/*.zip
            apps/desktop/release/${{ matrix.scenario }}/*.AppImage
            apps/desktop/release/${{ matrix.scenario }}/*.deb
            apps/desktop/release/${{ matrix.scenario }}/*.blockmap
            apps/desktop/release/${{ matrix.scenario }}/latest*.yml
          if-no-files-found: error
          compression-level: 0

  sync:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm sync:dsh
      - uses: peter-evans/create-pull-request@v8
        with:
          branch: chore/sync-dsh-origin
          title: 'chore: sync HarnessDock dsh origin to latest exact release'
          commit-message: 'chore: sync HarnessDock dsh origin'
          body: |
            Automated docs-sync tracks the newest exact `dsh-v*` Git release.
            npm-backed releases keep npm integrity; tag-only releases use the verified `git-pack` pipeline.
            Full and Thin package matrices must both pass before this PR can merge.
