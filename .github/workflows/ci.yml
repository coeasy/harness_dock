name: ci

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  round2-apply:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'refactor/v0.2.0-shell-first'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Install Linux Tauri dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2
      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: rustfmt
      - name: Apply round-two public diagnostics boundary
        run: python scripts/_apply-v020-round2.py
      - name: Align canonical icon parity contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/parity/tauri-host.test.ts')
          text = path.read_text()
          old = """    expect(candidate).toContain('cargo tauri icon src-tauri/icons/app-icon.png')
              expect(candidate).toContain('Verify Windows installer uses HarnessDock icon')
              expect(candidate).toContain('Replace default Android launcher icons with HarnessDock')
              expect(candidate).toContain('Replace default iOS app icons with HarnessDock')"""
          new = """    expect(candidate).toContain('run: pnpm prepare:icons')
              expect(candidate).not.toContain('cargo tauri icon src-tauri/icons/app-icon.png')
              expect(candidate).toContain('Verify Windows installer uses HarnessDock icon')
              expect(candidate).toContain('Prepare canonical HarnessDock launcher icons')
              expect(candidate).toContain('Prepare canonical HarnessDock app icons')"""
          if old not in text:
              raise SystemExit('stale icon contract block not found')
          path.write_text(text.replace(old, new))
          PY
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Rebuild Shell and Gateway
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @dsh/plugin-harness-shell build
          node scripts/check-shell-package.mjs
          pnpm --filter @dsh/tauri bundle:sidecar
      - name: Validate round two before commit
        shell: bash
        run: |
          set -euo pipefail
          pnpm check:versions
          pnpm check:release
          pnpm test
          cargo fmt --manifest-path apps/tauri/src-tauri/Cargo.toml -- --check
          cargo metadata --locked --manifest-path apps/tauri/src-tauri/Cargo.toml --format-version 1 > /dev/null
          cargo check --locked --manifest-path apps/tauri/src-tauri/Cargo.toml
          cargo test --locked --manifest-path apps/tauri/src-tauri/Cargo.toml --lib
      - name: Commit only validated product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'coeasy'
          git config user.email 'mdonetwo@yeah.net'
          git add apps/tauri/web/app.js packages/plugin-harness-shell/web/shell.js tests/parity/public-diagnostics-redaction.test.ts tests/parity/tauri-host.test.ts
          git diff --cached --quiet && { echo 'No round-two changes to commit.'; exit 1; }
          git commit -m 'security: redact public runtime diagnostics'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

  test:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm test

  tauri-source:
    needs: test
    if: needs.test.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri Linux source dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2
      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/tauri/src-tauri
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm --filter @dsh/plugin-embedded-client build
      - run: pnpm --filter @dsh/plugin-harness-shell build
      - name: Verify publishable Harness Shell package
        run: node scripts/check-shell-package.mjs
      - name: Bundle and validate Gateway sidecar
        run: pnpm --filter @dsh/tauri bundle:sidecar
      - name: Check Tauri Rust formatting
        run: cargo fmt --manifest-path apps/tauri/src-tauri/Cargo.toml -- --check
      - name: Check Tauri Rust host
        run: cargo check --locked --manifest-path apps/tauri/src-tauri/Cargo.toml
      - name: Test Tauri runtime recovery logic
        run: cargo test --locked --manifest-path apps/tauri/src-tauri/Cargo.toml --lib
      - name: Verify Tauri version contract
        shell: bash
        run: |
          set -euo pipefail
          root_version="$(node -p "require('./package.json').version")"
          tauri_version="$(node -p "require('./apps/tauri/src-tauri/tauri.conf.json').version")"
          cargo_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' apps/tauri/src-tauri/Cargo.toml | head -1)"
          test "$tauri_version" = "$root_version"
          test "$cargo_version" = "$root_version"
          test -s apps/tauri/src-tauri/Cargo.lock
          test -s apps/tauri/src-tauri/resources/gateway-sidecar.mjs

  sync:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm sync:dsh
      - name: Publish sync branch without requiring Actions PR permission
        shell: bash
        env:
          SYNC_BRANCH: chore/sync-dsh-origin
        run: |
          set -euo pipefail

          if [ -z "$(git status --porcelain)" ]; then
            echo "DSH origin is already current; nothing to publish."
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$SYNC_BRANCH"
          git add -A
          git commit -m 'chore: sync HarnessDock dsh origin'

          remote_sha="$(git ls-remote --heads origin "refs/heads/${SYNC_BRANCH}" | awk '{print $1}')"
          if [ -n "$remote_sha" ]; then
            git push --force-with-lease="refs/heads/${SYNC_BRANCH}:${remote_sha}" origin "HEAD:refs/heads/${SYNC_BRANCH}"
          else
            git push origin "HEAD:refs/heads/${SYNC_BRANCH}"
          fi

          {
            echo '### DSH origin sync ready for review'
            echo
            echo "Changes were pushed to \`${SYNC_BRANCH}\`."
            echo 'The workflow intentionally does not create a pull request with GITHUB_TOKEN, so repository settings that disallow Actions-created PRs cannot fail the scheduled sync.'
            echo 'Open or update the pull request from this branch with a normal user/app token after reviewing the upstream changelog.'
          } >> "$GITHUB_STEP_SUMMARY"
