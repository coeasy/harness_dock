name: security-audit

on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'Cargo.lock'
      - 'apps/tauri/src-tauri/Cargo.lock'
      - 'apps/tauri/src-tauri/Cargo.toml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'packages/**/package.json'
      - 'apps/**/package.json'
      - '.github/workflows/security-audit.yml'

concurrency:
  group: security-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lockfiles:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Verify locked Rust dependency graph
        run: cargo metadata --locked --manifest-path apps/tauri/src-tauri/Cargo.toml --format-version 1 > /dev/null
      - name: Audit production Node dependencies
        run: pnpm audit --prod --audit-level high

  rust-advisories:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
      - name: Install pinned cargo-audit tool
        run: cargo install cargo-audit --locked
      - name: Audit Rust advisories
        run: cargo audit --file apps/tauri/src-tauri/Cargo.lock
