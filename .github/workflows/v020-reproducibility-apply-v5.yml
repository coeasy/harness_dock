name: v020-reproducibility-apply-v5

on:
  push:
    branches:
      - refactor/v0.2.0-shell-first
    paths:
      - '.github/workflows/v020-reproducibility-apply-v5.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Linux Tauri dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2
      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: rustfmt
      - name: Apply round-one fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/tauri/src-tauri/src/harness_window.rs')
          text = p.read_text()
          old = '        assert!(validated_runtime_url("https://localhost:4321/").is_ok());\n'
          new = (
              '        assert!(validated_runtime_url("https://localhost:4321/").is_err());\n'
              '        assert!(validated_runtime_url("http://localhost:4321/").is_err());\n'
              '        assert!(validated_runtime_url("https://127.0.0.1:4321/").is_err());\n'
          )
          if text.count(old) != 1:
              raise SystemExit(f'stale runtime-origin test anchor count: {text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          PY
          cargo generate-lockfile --manifest-path apps/tauri/src-tauri/Cargo.toml
          test -s apps/tauri/src-tauri/Cargo.lock
          python scripts/_apply-v020-reproducibility.py
          python - <<'PY'
          from pathlib import Path
          ci = Path('.github/workflows/ci.yml')
          text = ci.read_text()
          anchor = '      - name: Check Tauri Rust host\n        run: cargo check --locked --manifest-path apps/tauri/src-tauri/Cargo.toml'
          replacement = (
              '      - name: Check Tauri Rust formatting\n'
              '        run: cargo fmt --manifest-path apps/tauri/src-tauri/Cargo.toml -- --check\n'
              '      - name: Check Tauri Rust host\n'
              '        run: cargo check --locked --manifest-path apps/tauri/src-tauri/Cargo.toml'
          )
          if text.count(anchor) != 1:
              raise SystemExit(f'CI rustfmt anchor count: {text.count(anchor)}')
          ci.write_text(text.replace(anchor, replacement, 1))

          test = Path('tests/parity/reproducible-release-contract.test.ts')
          text = test.read_text()
          anchor = "    expect(ci).toContain('cargo check --locked --manifest-path apps/tauri/src-tauri/Cargo.toml')\n"
          replacement = anchor + "    expect(ci).toContain('cargo fmt --manifest-path apps/tauri/src-tauri/Cargo.toml -- --check')\n"
          if text.count(anchor) != 1:
              raise SystemExit(f'parity rustfmt anchor count: {text.count(anchor)}')
          test.write_text(text.replace(anchor, replacement, 1))
          PY
          cargo fmt --manifest-path apps/tauri/src-tauri/Cargo.toml
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Rebuild and verify publishable Harness Shell
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @dsh/plugin-harness-shell build
          node scripts/check-shell-package.mjs
      - name: Rebuild Gateway sidecar
        run: pnpm --filter @dsh/tauri bundle:sidecar
      - name: Validate round one after every discovered fix
        shell: bash
        run: |
          set -euo pipefail
          pnpm check:versions
          pnpm check:release
          pnpm test
          cargo fmt --manifest-path apps/tauri/src-tauri/Cargo.toml -- --check
          cargo metadata --locked --manifest-path apps/tauri/src-tauri/Cargo.toml --format-version 1 > /dev/null
          cargo check --locked --manifest-path apps/tauri/src-tauri/Cargo.toml
          cargo test --locked --manifest-path apps/tauri/src-tauri/Cargo.toml --lib
      - name: Commit only fully validated round-one fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'coeasy'
          git config user.email 'mdonetwo@yeah.net'
          # Workflow files are validated in this job but intentionally not pushed by
          # GITHUB_TOKEN; the repository write API applies those separately. This
          # avoids the GitHub App workflow-scope failure that blocked the previous run.
          git add rust-toolchain.toml package.json apps/tauri/package.json apps/tauri/src-tauri/Cargo.lock apps/tauri/src-tauri/src scripts/check-versions.mjs scripts/check-shell-package.mjs tests/parity/reproducible-release-contract.test.ts
          git diff --cached --quiet && { echo 'No validated round-one product changes to commit.'; exit 1; }
          git commit -m 'build: freeze and format Tauri v0.2.0 toolchain'
          git push origin HEAD:refactor/v0.2.0-shell-first
