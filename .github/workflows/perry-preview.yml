name: perry-preview

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/perry/**'
      - 'packages/bootstrap/**'
      - 'packages/client-runtime/**'
      - 'packages/docs-sync/**'
      - 'packages/plugin-embedded-client/**'
      - '.github/workflows/perry-preview.yml'
      - 'package.json'

permissions:
  contents: read

concurrency:
  group: perry-preview-${{ github.ref }}
  cancel-in-progress: true

env:
  PERRY_VERSION: '0.5.1220'
  PERRY_SOURCE_SHA: '06137858dc8c6f80975238377138f2f948d6ef88'
  PERRY_NO_TELEMETRY: '1'
  CI: 'true'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm test
      - run: pnpm check:perry-host

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, macos-latest, ubuntu-latest]
        scenario: [thin, full]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline

      - name: Install Perry Linux WebView build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev \
            libpulse-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libshumate-dev

      - name: Install pinned Perry compiler
        run: npm install -g @perryts/perry@0.5.1220

      - name: Verify Perry compiler and native Rust toolchain
        shell: bash
        run: |
          perry --version
          rustc --version
          cargo --version

      # Perry 0.5.1220's published full stdlib contains an upstream HTTP/AWS-LC
      # link regression. The compiler already supports building only the stdlib
      # features an app actually uses when an exact Perry source workspace is
      # supplied. Pin the source commit behind v0.5.1220 so Preview builds are
      # reproducible and do not depend on the broken full-stdlib fallback.
      - name: Checkout pinned Perry source for optimized desktop stdlib
        uses: actions/checkout@v7
        with:
          repository: PerryTS/perry
          ref: ${{ env.PERRY_SOURCE_SHA }}
          path: .perry-source
          persist-credentials: false
          fetch-depth: 1

      - name: Cache Perry optimized desktop runtime
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/perry-auto-desktop
          key: perry-auto-desktop-${{ runner.os }}-${{ runner.arch }}-${{ env.PERRY_VERSION }}-${{ hashFiles('apps/perry/src/**/*.ts', 'packages/bootstrap/src/**/*.ts', 'packages/client-runtime/src/**/*.ts') }}
          restore-keys: |
            perry-auto-desktop-${{ runner.os }}-${{ runner.arch }}-${{ env.PERRY_VERSION }}-

      - name: Cache prepared dsh runtime
        if: matrix.scenario == 'full'
        uses: actions/cache@v6
        with:
          path: runtimes/pack
          key: perry-dsh-runtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/docs-sync/origin.json', 'packages/client-runtime/src/prepare-cli.ts', 'packages/client-runtime/src/integrity.ts', 'packages/client-runtime/src/prune.ts') }}
          restore-keys: |
            perry-dsh-runtime-${{ runner.os }}-${{ runner.arch }}-

      - name: Build Perry Native Preview package
        env:
          PERRY_WORKSPACE_ROOT: ${{ github.workspace }}/.perry-source
          CARGO_TARGET_DIR: ${{ runner.temp }}/perry-auto-desktop
        run: node apps/perry/scripts/pack.mjs --scenario ${{ matrix.scenario }}

      - name: List Perry artifacts
        shell: bash
        run: find apps/perry/release/${{ matrix.scenario }}/artifacts -maxdepth 1 -type f -print

      - uses: actions/upload-artifact@v7
        with:
          name: perry-${{ runner.os }}-${{ matrix.scenario }}
          path: apps/perry/release/${{ matrix.scenario }}/artifacts/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
