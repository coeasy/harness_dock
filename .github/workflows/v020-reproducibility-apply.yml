name: v020-reproducibility-apply

on:
  push:
    branches:
      - refactor/v0.2.0-shell-first
    paths:
      - '.github/workflows/v020-reproducibility-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Linux Tauri dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2
      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Generate immutable Tauri dependency lock
        run: cargo generate-lockfile --manifest-path apps/tauri/src-tauri/Cargo.toml

      - name: Add reproducibility and Shell package gates
        shell: bash
        run: |
          set -euo pipefail
          cat > scripts/check-shell-package.mjs <<'EOF'
          #!/usr/bin/env node
          import { execFileSync } from 'node:child_process'
          import { readFileSync } from 'node:fs'
          import path from 'node:path'
          import { fileURLToPath } from 'node:url'

          const repoRoot = path.resolve(path.dirname(fileURLToPath(import.meta.url)), '..')
          const packageDir = path.join(repoRoot, 'packages', 'plugin-harness-shell')
          const packageJson = JSON.parse(readFileSync(path.join(packageDir, 'package.json'), 'utf8'))
          const result = JSON.parse(execFileSync('npm', ['pack', '--dry-run', '--json', '--ignore-scripts'], {
            cwd: packageDir,
            encoding: 'utf8',
            stdio: ['ignore', 'pipe', 'pipe'],
          }))
          const packed = result?.[0]
          if (!packed) throw new Error('npm pack --dry-run did not return a package description')
          if (packed.name !== '@dsh/plugin-harness-shell') throw new Error(`unexpected package name: ${packed.name}`)
          if (packed.version !== packageJson.version) throw new Error(`package version drift: ${packed.version} != ${packageJson.version}`)
          const files = new Set((packed.files ?? []).map((file) => file.path))
          for (const required of ['package.json', 'manifest.json', 'lib/index.js', 'web/shell.js']) {
            if (!files.has(required)) throw new Error(`publishable Harness Shell is missing ${required}`)
          }
          for (const file of files) {
            if (file.includes('node_modules/') || file.startsWith('node_modules/')) throw new Error(`node_modules leaked into shell package: ${file}`)
            if (file.includes('src-tauri/') || /\.(exe|dmg|appimage|deb|aab|apk)$/i.test(file)) throw new Error(`host binary leaked into shell package: ${file}`)
          }
          if (!Number.isFinite(packed.size) || packed.size <= 0 || packed.size > 512 * 1024) {
            throw new Error(`unexpected Harness Shell packed size: ${packed.size}`)
          }
          console.log(`[shell-package] ${packed.name}@${packed.version}: ${packed.size} bytes, ${files.size} files; dry-run package contract passes.`)
          EOF

          cat > tests/parity/reproducible-release-contract.test.ts <<'EOF'
          import { existsSync, readFileSync } from 'node:fs'
          import path from 'node:path'
          import { fileURLToPath } from 'node:url'
          import { describe, expect, it } from 'vitest'

          const repoRoot = path.resolve(path.dirname(fileURLToPath(import.meta.url)), '../..')
          const read = (relative: string) => readFileSync(path.join(repoRoot, relative), 'utf8')

          describe('v0.2.0 reproducible release contract', () => {
            it('commits the Tauri Cargo lock and rejects unlocked Rust resolution', () => {
              const lockPath = path.join(repoRoot, 'apps/tauri/src-tauri/Cargo.lock')
              expect(existsSync(lockPath)).toBe(true)
              const lock = read('apps/tauri/src-tauri/Cargo.lock')
              expect(lock).toContain('name = "harnessdock-tauri"')
              expect(lock).toContain('version = "0.2.0"')
              expect(read('apps/tauri/package.json')).toContain('cargo check --locked')
              const ci = read('.github/workflows/ci.yml')
              expect(ci).toContain('cargo check --locked --manifest-path apps/tauri/src-tauri/Cargo.toml')
              expect(ci).toContain('cargo test --locked --manifest-path apps/tauri/src-tauri/Cargo.toml --lib')
              expect(read('.github/workflows/tauri-ci.yml')).toContain('cargo check --locked --manifest-path apps/tauri/src-tauri/Cargo.toml')
              expect(read('.github/workflows/tauri-candidate.yml')).toContain('cargo metadata --locked --manifest-path apps/tauri/src-tauri/Cargo.toml')
            })

            it('dry-runs the independent Harness Shell publication in CI and candidate validation', () => {
              const root = JSON.parse(read('package.json'))
              expect(root.scripts['check:shell-package']).toContain('check-shell-package.mjs')
              const checker = read('scripts/check-shell-package.mjs')
              expect(checker).toContain("npm', ['pack', '--dry-run', '--json', '--ignore-scripts']")
              expect(checker).toContain("'manifest.json', 'lib/index.js', 'web/shell.js'")
              expect(read('.github/workflows/ci.yml')).toContain('Verify publishable Harness Shell package')
              expect(read('.github/workflows/tauri-candidate.yml')).toContain('Verify publishable Harness Shell package')
            })
          })
          EOF

          python - <<'PY'
          from pathlib import Path
          import json

          # Root script.
          p = Path('package.json')
          data = json.loads(p.read_text())
          data['scripts']['check:shell-package'] = 'pnpm --filter @dsh/plugin-harness-shell build && node scripts/check-shell-package.mjs'
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')

          # Tauri local check must never update dependency resolution implicitly.
          p = Path('apps/tauri/package.json')
          data = json.loads(p.read_text())
          data['scripts']['tauri:check'] = 'cargo check --locked --manifest-path src-tauri/Cargo.toml'
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')

          # Version gate also owns the existence/version of the Rust lockfile.
          p = Path('scripts/check-versions.mjs')
          text = p.read_text()
          anchor = '''const cargoPath = path.join(repoRoot, 'apps', 'tauri', 'src-tauri', 'Cargo.toml')\nif (existsSync(cargoPath)) {'''
          insert = '''const cargoLockPath = path.join(repoRoot, 'apps', 'tauri', 'src-tauri', 'Cargo.lock')\nif (!existsSync(cargoLockPath)) {\n  mismatches.push('apps/tauri/src-tauri/Cargo.lock: file is missing; Tauri dependency resolution must be frozen')\n} else {\n  const cargoLock = readFileSync(cargoLockPath, 'utf8')\n  const appPackage = cargoLock.match(/\\[\\[package\\]\\]\\s+name = "harnessdock-tauri"\\s+version = "([^"]+)"/m)?.[1]\n  if (appPackage !== rootVersion) {\n    mismatches.push(`apps/tauri/src-tauri/Cargo.lock harnessdock-tauri: ${appPackage} (root: ${rootVersion})`)\n  }\n}\n\nconst cargoPath = path.join(repoRoot, 'apps', 'tauri', 'src-tauri', 'Cargo.toml')\nif (existsSync(cargoPath)) {'''
          if text.count(anchor) != 1:
            raise SystemExit('check-versions Cargo anchor missing/ambiguous')
          p.write_text(text.replace(anchor, insert, 1))

          # Main CI: locked check/test plus a real publish-package dry run.
          p = Path('.github/workflows/ci.yml')
          text = p.read_text()
          text = text.replace('cargo check --manifest-path apps/tauri/src-tauri/Cargo.toml', 'cargo check --locked --manifest-path apps/tauri/src-tauri/Cargo.toml')
          text = text.replace('cargo test --manifest-path apps/tauri/src-tauri/Cargo.toml --lib', 'cargo test --locked --manifest-path apps/tauri/src-tauri/Cargo.toml --lib')
          anchor = '      - run: pnpm --filter @dsh/plugin-harness-shell build\n      - name: Bundle and validate Gateway sidecar'
          replacement = '      - run: pnpm --filter @dsh/plugin-harness-shell build\n      - name: Verify publishable Harness Shell package\n        run: node scripts/check-shell-package.mjs\n      - name: Bundle and validate Gateway sidecar'
          if text.count(anchor) != 1:
            raise SystemExit('ci Shell build anchor missing/ambiguous')
          p.write_text(text.replace(anchor, replacement, 1))

          # Tauri PR smoke uses the lockfile on every desktop Rust host.
          p = Path('.github/workflows/tauri-ci.yml')
          text = p.read_text().replace('cargo check --manifest-path apps/tauri/src-tauri/Cargo.toml', 'cargo check --locked --manifest-path apps/tauri/src-tauri/Cargo.toml')
          p.write_text(text)

          # Candidate preflight: lock must be consumable before expensive builds; package must really publish.
          p = Path('.github/workflows/tauri-candidate.yml')
          text = p.read_text()
          anchor = '      - run: pnpm check:release\n      - run: pnpm test\n'
          replacement = '      - run: pnpm check:release\n      - name: Verify frozen Tauri dependency graph\n        run: cargo metadata --locked --manifest-path apps/tauri/src-tauri/Cargo.toml --format-version 1 > /dev/null\n      - run: pnpm test\n'
          if text.count(anchor) != 1:
            raise SystemExit('candidate release/test anchor missing/ambiguous')
          text = text.replace(anchor, replacement, 1)
          anchor = '      - name: Build independent Harness Shell plugin\n        run: pnpm --filter @dsh/plugin-harness-shell build\n      - name: Bundle Gateway sidecar'
          replacement = '      - name: Build independent Harness Shell plugin\n        run: pnpm --filter @dsh/plugin-harness-shell build\n      - name: Verify publishable Harness Shell package\n        run: node scripts/check-shell-package.mjs\n      - name: Bundle Gateway sidecar'
          if text.count(anchor) != 1:
            raise SystemExit('candidate Shell build anchor missing/ambiguous')
          p.write_text(text.replace(anchor, replacement, 1))
          PY

      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Validate reproducible dependency and package contracts
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @dsh/plugin-harness-shell build
          node scripts/check-shell-package.mjs
          pnpm check:versions
          pnpm check:release
          pnpm test
          cargo metadata --locked --manifest-path apps/tauri/src-tauri/Cargo.toml --format-version 1 > /dev/null
          cargo check --locked --manifest-path apps/tauri/src-tauri/Cargo.toml
          cargo test --locked --manifest-path apps/tauri/src-tauri/Cargo.toml --lib

      - name: Commit validated reproducibility hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'coeasy'
          git config user.email 'mdonetwo@yeah.net'
          git add \
            package.json \
            apps/tauri/package.json \
            apps/tauri/src-tauri/Cargo.lock \
            scripts/check-versions.mjs \
            scripts/check-shell-package.mjs \
            tests/parity/reproducible-release-contract.test.ts \
            .github/workflows/ci.yml \
            .github/workflows/tauri-ci.yml \
            .github/workflows/tauri-candidate.yml
          git diff --cached --quiet && { echo 'No reproducibility changes to commit.'; exit 1; }
          git commit -m 'build: freeze Tauri dependencies and verify shell package'
          git push origin HEAD:refactor/v0.2.0-shell-first
