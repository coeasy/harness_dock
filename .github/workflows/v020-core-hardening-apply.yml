name: v020-core-hardening-apply

on:
  push:
    branches:
      - refactor/v0.2.0-shell-first
    paths:
      - '.github/workflows/v020-core-hardening-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply v0.2.0 core-chain hardening
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual < count:
                  raise SystemExit(f'{path}: expected at least {count} occurrence(s), found {actual}: {old[:120]!r}')
              text = text.replace(old, new, count)
              p.write_text(text)

          # 1) Runtime ready contract: exact managed origin = plain HTTP 127.0.0.1 + explicit port.
          replace(
              'apps/tauri/src-tauri/src/runtime.rs',
              '''    if host != "127.0.0.1" || (app_url.scheme() != "http" && app_url.scheme() != "https") {
                  return Err("Runtime Web URL 必须使用受管的 127.0.0.1 HTTP(S) 地址。".into());
              }
              if !app_url.username().is_empty() || app_url.password().is_some() {
                  return Err("Runtime Web URL 不能包含用户名或密码。".into());
              }
              let app_port = app_url.port().unwrap_or(if app_url.scheme() == "https" { 443 } else { 80 });
          ''',
              '''    if host != "127.0.0.1" || app_url.scheme() != "http" {
                  return Err("Runtime Web URL 必须使用受管的 http://127.0.0.1:<port> 地址。".into());
              }
              if !app_url.username().is_empty() || app_url.password().is_some() {
                  return Err("Runtime Web URL 不能包含用户名或密码。".into());
              }
              let app_port = app_url
                  .port()
                  .ok_or_else(|| "Runtime Web URL 必须显式包含受管端口。".to_string())?;
          ''')

          # Add strict ready-file regression coverage for HTTPS and missing ports.
          replace(
              'apps/tauri/src-tauri/src/runtime.rs',
              '''        let localhost_alias = r#"{\"url\":\"http://localhost:43123/?token=launch\",\"host\":\"localhost\",\"port\":43123,\"pid\":42,\"dshVersion\":\"0.1.2-alpha.1\"}"#;
              assert!(validated_ready(ipv6, "0.1.2-alpha.1", 42).is_err());
              assert!(validated_ready(alternate_loopback, "0.1.2-alpha.1", 42).is_err());
              assert!(validated_ready(localhost_alias, "0.1.2-alpha.1", 42).is_err());
          ''',
              '''        let localhost_alias = r#"{\"url\":\"http://localhost:43123/?token=launch\",\"host\":\"localhost\",\"port\":43123,\"pid\":42,\"dshVersion\":\"0.1.2-alpha.1\"}"#;
              let https_alias = r#"{\"url\":\"https://127.0.0.1:43123/?token=launch\",\"host\":\"127.0.0.1\",\"port\":43123,\"pid\":42,\"dshVersion\":\"0.1.2-alpha.1\"}"#;
              let missing_port = r#"{\"url\":\"http://127.0.0.1/?token=launch\",\"host\":\"127.0.0.1\",\"port\":43123,\"pid\":42,\"dshVersion\":\"0.1.2-alpha.1\"}"#;
              assert!(validated_ready(ipv6, "0.1.2-alpha.1", 42).is_err());
              assert!(validated_ready(alternate_loopback, "0.1.2-alpha.1", 42).is_err());
              assert!(validated_ready(localhost_alias, "0.1.2-alpha.1", 42).is_err());
              assert!(validated_ready(https_alias, "0.1.2-alpha.1", 42).is_err());
              assert!(validated_ready(missing_port, "0.1.2-alpha.1", 42).is_err());
          ''')

          # 2) WebView origin validation must be identical to Runtime ready/capability scope.
          replace(
              'apps/tauri/src-tauri/src/harness_window.rs',
              '''fn validated_runtime_url(value: &str) -> Result<Url, String> {
              let url = Url::parse(value).map_err(|_| "Runtime URL 无效。".to_string())?;
              if url.scheme() != "http" && url.scheme() != "https" {
                  return Err("Runtime WebView 只允许 HTTP(S)。".into());
              }
              let host = url.host_str().ok_or_else(|| "Runtime URL 缺少主机名。".to_string())?;
              // The managed desktop Runtime is spawned on 127.0.0.1 and the Tauri
              // capability grants the shell bridge only to 127.0.0.1/localhost. Do not
              // accept every address that the OS classifies as loopback: doing so can
              // create a false-ready WebView that passes Rust validation but receives no
              // shell capability (and broadens the privileged navigation surface).
              if host != "127.0.0.1" && !host.eq_ignore_ascii_case("localhost") {
                  return Err("桌面 Harness WebView 只允许受管的 127.0.0.1/localhost Runtime。".into());
              }
              if !url.username().is_empty() || url.password().is_some() {
                  return Err("Runtime URL 不能包含用户名或密码。".into());
              }
              Ok(url)
          }
          ''',
              '''fn validated_runtime_url(value: &str) -> Result<Url, String> {
              let url = Url::parse(value).map_err(|_| "Runtime URL 无效。".to_string())?;
              if url.scheme() != "http" {
                  return Err("桌面 Harness WebView 只允许受管的 HTTP Runtime。".into());
              }
              let host = url.host_str().ok_or_else(|| "Runtime URL 缺少主机名。".to_string())?;
              if host != "127.0.0.1" {
                  return Err("桌面 Harness WebView 只允许受管的 http://127.0.0.1:<port> Runtime。".into());
              }
              if !url.username().is_empty() || url.password().is_some() {
                  return Err("Runtime URL 不能包含用户名或密码。".into());
              }
              let port = url.port().ok_or_else(|| "Runtime URL 必须显式包含受管端口。".to_string())?;
              if port == 0 {
                  return Err("Runtime URL 端口无效。".into());
              }
              Ok(url)
          }
          ''')

          # 3) Shell injection is optional, but loss of the shell must restore native window controls.
          replace(
              'apps/tauri/src-tauri/src/harness_window.rs',
              '''    if let Err(error) = window.eval(init_script()) {
                  // The Harness document remains the primary surface even if a best-
                  // effort toolbar injection is rejected by a WebView implementation.
                  // Menu and native commands remain available for a later retry.
                  eprintln!("Unable to install Harness Shell; continuing with Harness Web: {error}");
              }
          ''',
              '''    match window.eval(init_script()) {
                  Ok(()) => {
                      // The custom Harness Shell owns window controls only while its
                      // bridge is known to be installed in the current document.
                      let _ = window.set_decorations(false);
                  }
                  Err(error) => {
                      // Fail open to a native title bar. A rejected/broken optional
                      // shell must never leave the primary Harness WebView borderless
                      // and therefore impossible to minimize/maximize/close.
                      eprintln!("Unable to install Harness Shell; restoring native window controls: {error}");
                      let _ = window.set_decorations(true);
                  }
              }
          ''')

          # 4) Make the hidden local control page an explicit-mode surface.
          replace(
              'apps/tauri/src-tauri/src/harness_window.rs',
              '''        let control = app
                  .get_webview_window("main")
                  .ok_or_else(|| "HarnessDock 控制页窗口不存在。".to_string())?;
              control
                  .show()
          ''',
              '''        let control = app
                  .get_webview_window("main")
                  .ok_or_else(|| "HarnessDock 控制页窗口不存在。".to_string())?;
              let surface = app
                  .state::<crate::AppState>()
                  .startup_recovery_error
                  .lock()
                  .map(|recovery| if recovery.is_some() { "recovery" } else { "gateway-host" })
                  .unwrap_or("recovery");
              if let Ok(value) = serde_json::to_string(surface) {
                  let _ = control.eval(format!("window.__harnessDockSetSurface?.({value})"));
              }
              control
                  .show()
          ''')

          # 5) Align the independently publishable shell service capability list with the Host Bridge.
          replace(
              'packages/plugin-harness-shell/src/index.ts',
              "    'runtime.clear-quarantine',\n    'diagnostics.open',",
              "    'runtime.clear-quarantine',\n    'gateway.manage',\n    'diagnostics.open',")

          # 6) Explicit control-page modes instead of scattered card toggles.
          replace(
              'apps/tauri/web/app.js',
              '''  let currentRuntime
              let desktopStartup

              function showRecoveryCards() {
          ''',
              '''  let currentRuntime
              let desktopStartup
              let surfaceMode = 'hidden'

              function setSurfaceMode(mode) {
                surfaceMode = mode
                const visibility = {
                  recovery: ['desktop-card'],
                  'gateway-host': ['gateway-host-card'],
                  'mobile-remote': ['mobile-remote-card'],
                  hidden: [],
                }
                const visible = new Set(visibility[mode] || [])
                for (const id of ['desktop-card', 'gateway-host-card', 'mobile-remote-card']) {
                  $(id)?.classList.toggle('hidden', !visible.has(id))
                }
              }

              window.__harnessDockSetSurface = (mode) => {
                if (!['recovery', 'gateway-host', 'mobile-remote', 'hidden'].includes(mode)) return
                setSurfaceMode(mode)
                if (mode === 'gateway-host') void refreshVisibleControl()
              }

              function showRecoveryCards() {
          ''')
          replace(
              'apps/tauri/web/app.js',
              '''    $('desktop-card')?.classList.remove('hidden')
              $('gateway-host-card')?.classList.add('hidden')
          ''',
              '''    setSurfaceMode('recovery')
          ''')
          replace(
              'apps/tauri/web/app.js',
              "        $('gateway-host-card')?.classList.remove('hidden')",
              "        setSurfaceMode('gateway-host')")
          replace(
              'apps/tauri/web/app.js',
              "        $('mobile-remote-card').classList.remove('hidden')",
              "        setSurfaceMode('mobile-remote')")

          # 7) Update active docs so they describe the actual permission boundary.
          replace(
              'README.md',
              '- loopback IPv4、localhost、IPv6 `::1` 根路径和子路径统一纳入外壳 ACL，避免 Harness Web 首屏或菜单调用出现 `Command ... not allowed by ACL`。',
              '- 桌面 Harness Shell 权限只授予受管的 `http://127.0.0.1:<ephemeral-port>` Runtime origin；localhost、IPv6、HTTPS alias 与其它本机服务均不获得外壳 IPC。')
          replace(
              'docs/plan/v0.2.0-shell-first-implementation.md',
              '| `runtime.clear-quarantine` | 支持 |\n| `diagnostics.open` | 支持 |',
              '| `runtime.clear-quarantine` | 支持 |\n| `gateway.manage` | 支持 |\n| `diagnostics.open` | 支持 |')
          replace(
              'docs/plan/v0.2.0-shell-first-implementation.md',
              '远程 Harness/Gateway 页面不获得本地 Tauri capability；只有校验过的 loopback Harness WebView 才获得 `harness-shell` capability。',
              '远程 Harness/Gateway 页面不获得本地 Tauri capability；只有与当前受管 `http://127.0.0.1:<port>` Runtime origin 完全一致的 Harness WebView 才获得 `harness-shell` capability。')

          # 8) Strengthen existing parity expectations.
          replace(
              'tests/parity/tauri-host.test.ts',
              "    expect(harnessWindow).toContain('127.0.0.1/localhost Runtime')",
              "    expect(harnessWindow).toContain('http://127.0.0.1:<port> Runtime')\n    expect(harnessWindow).toContain('window.set_decorations(true)')\n    expect(harnessWindow).toContain('window.set_decorations(false)')\n    expect(runtime).toContain('app_url.scheme() != \"http\"')")
          replace(
              'tests/parity/tauri-host.test.ts',
              "    const shellAsset = readFileSync(path.join(repoRoot, 'packages/plugin-harness-shell/src/web/shell.js'), 'utf8')",
              "    const shellAsset = readFileSync(path.join(repoRoot, 'packages/plugin-harness-shell/src/web/shell.js'), 'utf8')\n    const shellService = readFileSync(path.join(repoRoot, 'packages/plugin-harness-shell/src/index.ts'), 'utf8')")
          replace(
              'tests/parity/tauri-host.test.ts',
              "    expect(shell).toContain(\"'gateway.manage': 'control_show'\")",
              "    expect(shell).toContain(\"'gateway.manage': 'control_show'\")\n    expect(shellService).toContain(\"'gateway.manage'\")")
          replace(
              'tests/parity/tauri-host.test.ts',
              "    expect(web).toContain(\"gateway-host-card')?.classList.remove('hidden')\")\n    expect(web).toContain(\"gateway-host-card')?.classList.add('hidden')\")",
              "    expect(web).toContain('function setSurfaceMode(mode)')\n    expect(web).toContain(\"setSurfaceMode('gateway-host')\")\n    expect(web).toContain(\"setSurfaceMode('mobile-remote')\")\n    expect(harnessWindow).toContain('__harnessDockSetSurface')")

          replace(
              'tests/parity/tauri-shell-fail-open.test.ts',
              '''  it('uses the packaged Node by default and requires an explicit system-Node opt-in', () => {
          ''',
              '''  it('falls back to native window controls when the optional shell cannot be installed', () => {
                const harnessWindow = read('apps/tauri/src-tauri/src/harness_window.rs')
                const runtime = read('apps/tauri/src-tauri/src/runtime.rs')
                const shellService = read('packages/plugin-harness-shell/src/index.ts')
                const shellBundle = read('packages/plugin-harness-shell/lib/index.js')
                expect(harnessWindow).toContain('window.set_decorations(true)')
                expect(harnessWindow).toContain('window.set_decorations(false)')
                expect(harnessWindow).toContain('http://127.0.0.1:<port> Runtime')
                expect(runtime).toContain('app_url.scheme() != "http"')
                expect(shellService).toContain("'gateway.manage'")
                expect(shellBundle).toContain('"gateway.manage"')
              })

              it('uses the packaged Node by default and requires an explicit system-Node opt-in', () => {
          ''')

          # 9) Add one dedicated cross-layer contract test that also locks Android's unsigned-compatible policy.
          Path('tests/parity/v020-core-contract.test.ts').write_text('''import { readFileSync } from 'node:fs'\nimport path from 'node:path'\nimport { fileURLToPath } from 'node:url'\nimport { describe, expect, it } from 'vitest'\n\nconst repoRoot = path.resolve(path.dirname(fileURLToPath(import.meta.url)), '../..')\nconst read = (relative: string) => readFileSync(path.join(repoRoot, relative), 'utf8')\nconst readJson = (relative: string) => JSON.parse(read(relative))\n\ndescribe('HarnessDock v0.2.0 frozen core contract', () => {\n  it('uses one exact managed Runtime origin family across spawn, validation and Tauri ACL', () => {\n    const runtime = read('apps/tauri/src-tauri/src/runtime.rs')\n    const harnessWindow = read('apps/tauri/src-tauri/src/harness_window.rs')\n    const capability = readJson('apps/tauri/src-tauri/capabilities/harness-shell.json')\n    expect(runtime).toContain('.args(["--host", "127.0.0.1", "--port", "0", "--no-open"])')\n    expect(runtime).toContain('app_url.scheme() != "http"')\n    expect(runtime).toContain('Runtime Web URL 必须显式包含受管端口')\n    expect(harnessWindow).toContain('url.scheme() != "http"')\n    expect(harnessWindow).toContain('host != "127.0.0.1"')\n    expect(harnessWindow).toContain('Runtime URL 必须显式包含受管端口')\n    expect(capability.remote.urls).toEqual(['http://127.0.0.1:*/*', 'http://127.0.0.1:*'])\n  })\n\n  it('keeps Shell optional but guarantees native window controls on injection failure', () => {\n    const harnessWindow = read('apps/tauri/src-tauri/src/harness_window.rs')\n    expect(harnessWindow).toContain('restoring native window controls')\n    expect(harnessWindow).toContain('window.set_decorations(true)')\n    expect(harnessWindow).toContain('window.set_decorations(false)')\n  })\n\n  it('keeps Shell service capabilities aligned with the native bridge', () => {\n    const service = read('packages/plugin-harness-shell/src/index.ts')\n    const bundle = read('packages/plugin-harness-shell/lib/index.js')\n    const bridge = read('apps/tauri/src-tauri/src/harness_shell.rs')\n    for (const command of ['window.minimize', 'window.toggleMaximize', 'window.state', 'window.close', 'web.reload', 'web.restart', 'runtime.safe-mode', 'runtime.clear-quarantine', 'gateway.manage', 'diagnostics.open', 'app.update.check', 'app.update.install', 'app.quit']) {\n      expect(service).toContain(`'${command}'`)\n      expect(bundle).toContain(`"${command}"`)\n      expect(bridge).toContain(`'${command}'`)\n    }\n  })\n\n  it('uses explicit recovery/gateway/mobile control-page modes', () => {\n    const web = read('apps/tauri/web/app.js')\n    const host = read('apps/tauri/src-tauri/src/harness_window.rs')\n    expect(web).toContain("let surfaceMode = 'hidden'")\n    expect(web).toContain('function setSurfaceMode(mode)')\n    expect(web).toContain("setSurfaceMode('recovery')")\n    expect(web).toContain("setSurfaceMode('gateway-host')")\n    expect(web).toContain("setSurfaceMode('mobile-remote')")\n    expect(host).toContain('__harnessDockSetSurface')\n  })\n\n  it('keeps Android candidate publication unsigned-compatible by product policy', () => {\n    const candidate = read('.github/workflows/tauri-candidate.yml')\n    const guard = read('scripts/check-android-package.mjs')\n    expect(candidate).not.toContain('ANDROID_KEY_BASE64')\n    expect(candidate).not.toContain('ANDROID_KEY_ALIAS')\n    expect(candidate).not.toContain('ANDROID_KEY_PASSWORD')\n    expect(candidate).not.toContain('configure-android-signing')\n    expect(guard).not.toContain('apksigner')\n    expect(guard).not.toContain('jarsigner')\n    expect(candidate).toContain('Verify Android release package')\n  })\n\n  it('keeps active documentation aligned with the exact Runtime ACL', () => {\n    const readme = read('README.md')\n    const implementation = read('docs/plan/v0.2.0-shell-first-implementation.md')\n    expect(readme).toContain('http://127.0.0.1:<ephemeral-port>')\n    expect(readme).not.toContain('loopback IPv4、localhost、IPv6 `::1`')\n    expect(implementation).toContain('http://127.0.0.1:<port>')\n    expect(implementation).toContain('`gateway.manage`')\n  })\n})\n''')
          PY
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Rebuild publishable Harness Shell bundle
        run: pnpm --filter @dsh/plugin-harness-shell build
      - name: Format Rust changes
        run: cargo fmt --manifest-path apps/tauri/src-tauri/Cargo.toml
      - name: Validate active contracts
        run: |
          pnpm check:versions
          pnpm test
          cargo fmt --manifest-path apps/tauri/src-tauri/Cargo.toml -- --check
      - name: Commit hardening changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'coeasy'
          git config user.email 'mdonetwo@yeah.net'
          git add README.md docs/plan/v0.2.0-shell-first-implementation.md apps/tauri/src-tauri/src/runtime.rs apps/tauri/src-tauri/src/harness_window.rs apps/tauri/web/app.js packages/plugin-harness-shell/src/index.ts packages/plugin-harness-shell/lib/index.js packages/plugin-harness-shell/web/shell.js tests/parity/tauri-host.test.ts tests/parity/tauri-shell-fail-open.test.ts tests/parity/v020-core-contract.test.ts
          git commit -m 'refactor: harden v0.2.0 managed host contract'
          git push origin HEAD:refactor/v0.2.0-shell-first
