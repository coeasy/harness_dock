name: local-one-click-build

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'packages/client-runtime/**'
      - 'packages/plugin-embedded-client/**'
      - 'packages/plugin-harness-shell/**'
      - 'packages/docs-sync/origin.json'
      - 'apps/tauri/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'rust-toolchain.toml'
      - '.github/workflows/local-one-click-build.yml'
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - 'packages/client-runtime/**'
      - 'packages/plugin-embedded-client/**'
      - 'packages/plugin-harness-shell/**'
      - 'packages/docs-sync/origin.json'
      - 'apps/tauri/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'rust-toolchain.toml'
      - '.github/workflows/local-one-click-build.yml'
  workflow_dispatch:

concurrency:
  group: local-one-click-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-clean-build-and-startup:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      HARNESSDOCK_FORCE_PORTABLE_NODE: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/tauri/src-tauri
      - name: Reset all local build state
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item .local-tools -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item .local-cache -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item node_modules -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item apps/tauri/src-tauri/resources/dsh-runtime -Recurse -Force -ErrorAction SilentlyContinue
      - name: Run the actual Windows one-click entrypoint from a clean clone
        shell: cmd
        run: scripts\build.bat --skip-tests
      - name: Locate the installer produced by the one-click build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem apps/tauri/src-tauri/target/release/bundle/nsis -Recurse -File -Filter '*setup.exe' -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $installer) { throw 'one-click build produced no NSIS *setup.exe' }
          "installer=$($installer.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "One-click installer: $($installer.FullName)"
      - name: Install the exact one-click artifact and prove Harness Web startup
        shell: pwsh
        run: ./scripts/smoke-windows-installer.ps1 -InstallerPath $env:installer -TimeoutSeconds 120
      - name: Reinstall exact one-click artifact and prove private Rescue under profile writer-lock contention
        shell: pwsh
        run: ./scripts/smoke-windows-installer.ps1 -InstallerPath $env:installer -TimeoutSeconds 120 -BlockProfileWriter
      - name: Verify bootstrap artifacts stayed local-only
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path .local-tools/node-home.txt)) { throw 'portable Node bootstrap was bypassed' }
          $nodeHome = (Get-Content .local-tools/node-home.txt -Raw).Trim()
          if (-not (Test-Path (Join-Path $nodeHome 'node.exe'))) { throw 'portable Node executable is missing' }
          if (-not (Test-Path .local-cache/node)) { throw 'portable Node download cache is missing' }
          $generatedBuildOutputs = @(
            'apps/tauri/src-tauri/Cargo.lock',
            'apps/tauri/src-tauri/Cargo.toml',
            'apps/tauri/src-tauri/icons/android/mipmap-anydpi-v26/ic_launcher.xml',
            'apps/tauri/src-tauri/icons/android/values/ic_launcher_background.xml',
            'apps/tauri/src-tauri/icons/icon.icns',
            'packages/plugin-embedded-client/lib/index.js',
            'packages/plugin-harness-shell/lib/index.js'
          )
          git restore --source=HEAD -- $generatedBuildOutputs
          $dirty = git status --porcelain
          if ($dirty) { throw "one-click build polluted the checkout:`n$dirty" }

  posix-clean-check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      HARNESSDOCK_FORCE_PORTABLE_NODE: '1'
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/tauri/src-tauri
      - name: Reset all local build state
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .local-tools .local-cache node_modules apps/tauri/src-tauri/resources/dsh-runtime
      - name: Run actual POSIX one-click entrypoint through Runtime and Rust gates
        shell: bash
        run: ./scripts/build.sh --skip-tests --check-only
      - name: Verify bootstrap artifacts stayed local-only
        shell: bash
        run: |
          set -euo pipefail
          test -s .local-tools/node-home.txt
          node_home="$(cat .local-tools/node-home.txt)"
          test -x "$node_home/bin/node"
          test -d .local-cache/node
          generated_build_outputs=(
            'apps/tauri/src-tauri/Cargo.lock'
            'apps/tauri/src-tauri/Cargo.toml'
            'apps/tauri/src-tauri/icons/android/mipmap-anydpi-v26/ic_launcher.xml'
            'apps/tauri/src-tauri/icons/android/values/ic_launcher_background.xml'
            'apps/tauri/src-tauri/icons/icon.icns'
            'packages/plugin-embedded-client/lib/index.js'
            'packages/plugin-harness-shell/lib/index.js'
          )
          git restore --source=HEAD -- "${generated_build_outputs[@]}"
          test -z "$(git status --porcelain)"
