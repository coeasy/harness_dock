# Temporary branch-only maintenance workflow. Remove before merge.
name: maintain-v0.1.1

on:
  push:
    branches:
      - feat/dsh-0.1.2-alpha1-v0.1.1
    paths:
      - .github/workflows/maintain-v0.1.1.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/dsh-0.1.2-alpha1-v0.1.1
      - name: Redact launch tokens and keep authenticated readiness candidate
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'
          const file = 'packages/client-runtime/src/runtime.ts'
          let text = readFileSync(file, 'utf8')

          text = text.replace(
            "import { parseWebUrl } from './output.ts'",
            "import { parseWebUrl, redactWebLaunchToken } from './output.ts'",
          )
          text = text.replace(
            "    const raw = typeof chunk === 'string' ? chunk : chunk.toString('utf8')",
            "    const raw = redactWebLaunchToken(typeof chunk === 'string' ? chunk : chunk.toString('utf8'))",
          )
          text = text.replace(
            "      const output = buffer.trim()",
            "      const output = redactWebLaunchToken(buffer).trim()",
          )

          const before = `    const consider = (info: ReadyInfo): void => {\n      if (candidate?.url === info.url) return\n      candidate = info\n      candidateSince = Date.now()\n    }`
          const after = `    const consider = (info: ReadyInfo): void => {\n      if (candidate?.url === info.url) return\n      if (candidate && candidate.host === info.host && candidate.port === info.port) {\n        const currentHasToken = new URL(candidate.url).searchParams.has('token')\n        const nextHasToken = new URL(info.url).searchParams.has('token')\n        if (currentHasToken && !nextHasToken) return\n      }\n      candidate = info\n      candidateSince = Date.now()\n    }`
          if (!text.includes(before) && !text.includes(after)) {
            throw new Error('readiness candidate block not found')
          }
          text = text.replace(before, after)
          if (!text.includes('redactWebLaunchToken')) throw new Error('redaction patch failed')
          writeFileSync(file, text)
          NODE
      - name: Commit runtime hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- packages/client-runtime/src/runtime.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: protect dsh alpha launch credentials'
          git push origin HEAD:feat/dsh-0.1.2-alpha1-v0.1.1
