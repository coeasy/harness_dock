name: windows-packaged-startup

on:
  workflow_run:
    workflows:
      - tauri-candidate
    types:
      - completed

concurrency:
  group: windows-packaged-startup-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  startup-smoke:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_RUN_ID: ${{ github.event.workflow_run.id }}
      CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Require current main candidate
        id: current
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $mainSha = gh api "repos/$env:GITHUB_REPOSITORY/branches/main" --jq '.commit.sha'
          if ($env:CANDIDATE_SHA -ne $mainSha) {
            "run=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host "Skipping stale candidate $env:CANDIDATE_SHA; main is $mainSha"
            exit 0
          }
          "run=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Download exact Windows candidate
        if: steps.current.outputs.run == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item candidate-win -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path candidate-win | Out-Null
          gh run download $env:CANDIDATE_RUN_ID --repo $env:GITHUB_REPOSITORY --name tauri-desktop-win-x64 --dir candidate-win
          $installer = Get-ChildItem candidate-win -Recurse -File -Filter '*setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Windows NSIS candidate was not downloaded' }
          "installer=$($installer.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install and prove Harness Web becomes primary and serves HTML
        if: steps.current.outputs.run == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tempRoot = [IO.Path]::GetTempPath()
          $traceDir = Join-Path $tempRoot 'harnessdock-logs'
          if (Test-Path $traceDir) {
            Get-ChildItem $traceDir -Filter 'startup-*.log' -ErrorAction SilentlyContinue | Remove-Item -Force -ErrorAction SilentlyContinue
          }
          # Delete stale Runtime work directories so the smoke can only observe
          # ready.json produced by the candidate launched below.
          Get-ChildItem $tempRoot -Directory -Filter 'harnessdock-tauri-*' -ErrorAction SilentlyContinue |
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue

          $installDir = Join-Path $env:RUNNER_TEMP 'HarnessDockStartupSmoke'
          Remove-Item $installDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $installDir | Out-Null

          $install = Start-Process -FilePath $env:installer -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "NSIS silent install failed with exit code $($install.ExitCode)" }

          # Tauri bundles the Cargo binary target, while productName controls the
          # installer/display name. The actual packaged binary is therefore
          # harnessdock-tauri.exe, as reported by `cargo tauri build`.
          $app = Get-ChildItem $installDir -Recurse -File -Filter 'harnessdock-tauri.exe' | Select-Object -First 1
          if (-not $app) {
            Write-Host "Installed files under ${installDir}:"
            Get-ChildItem $installDir -Recurse -Force -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host $_.FullName }
            throw "Installed harnessdock-tauri.exe not found under $installDir"
          }

          # A Start Menu launch does not inherit the repository workspace as its
          # cwd. Use a neutral directory so CI cannot accidentally make runtime
          # startup pass only because the checkout is the working directory.
          $neutralCwd = Join-Path $env:RUNNER_TEMP 'HarnessDockNeutralCwd'
          Remove-Item $neutralCwd -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $neutralCwd | Out-Null

          function Test-HarnessWebHtml([string]$Url) {
            $handler = [System.Net.Http.HttpClientHandler]::new()
            $handler.AllowAutoRedirect = $true
            $handler.UseCookies = $true
            $handler.CookieContainer = [System.Net.CookieContainer]::new()
            $client = [System.Net.Http.HttpClient]::new($handler)
            $client.Timeout = [TimeSpan]::FromSeconds(5)
            try {
              $response = $client.GetAsync($Url).GetAwaiter().GetResult()
              if (-not $response.IsSuccessStatusCode) { return $false }
              $body = $response.Content.ReadAsStringAsync().GetAwaiter().GetResult()
              return $body -match '(?i)<!doctype\s+html|<html(?:\s|>)'
            }
            catch {
              Write-Host "Harness Web probe failed: $($_.Exception.Message)"
              return $false
            }
            finally {
              $client.Dispose()
              $handler.Dispose()
            }
          }

          $hostProcess = Start-Process -FilePath $app.FullName -WorkingDirectory $neutralCwd -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(120)
            $trace = $null
            $content = ''
            $readyUrl = $null
            $healthyWebProbes = 0
            while ((Get-Date) -lt $deadline) {
              Start-Sleep -Milliseconds 500
              $trace = Get-ChildItem $traceDir -Filter 'startup-*.log' -ErrorAction SilentlyContinue |
                Sort-Object LastWriteTime -Descending |
                Select-Object -First 1
              if ($trace) {
                $content = Get-Content $trace.FullName -Raw
                Write-Host $content
                $hasRecovery = $content -match 'phase=recovery'
                $hasVisible = $content -match 'phase=primary_visible'
                if ($hasRecovery -and -not $hasVisible) {
                  throw 'Packaged client entered recovery before Harness Web became primary'
                }
              }

              $ready = Get-ChildItem $tempRoot -Directory -Filter 'harnessdock-tauri-*' -ErrorAction SilentlyContinue |
                ForEach-Object { Get-ChildItem $_.FullName -File -Filter 'ready.json' -ErrorAction SilentlyContinue } |
                Sort-Object LastWriteTime -Descending |
                Select-Object -First 1
              if ($ready) {
                try {
                  $readyJson = Get-Content $ready.FullName -Raw | ConvertFrom-Json
                  if ($readyJson.host -ne '127.0.0.1' -or [int]$readyJson.port -le 0) {
                    throw "invalid ready.json endpoint: host=$($readyJson.host) port=$($readyJson.port)"
                  }
                  $candidateUrl = [string]$readyJson.url
                  if ($candidateUrl -ne $readyUrl) {
                    $readyUrl = $candidateUrl
                    $healthyWebProbes = 0
                  }
                  if (Test-HarnessWebHtml $readyUrl) {
                    $healthyWebProbes += 1
                    Write-Host "Harness Web HTML probe ${healthyWebProbes}/2 passed: $readyUrl"
                  }
                  else {
                    $healthyWebProbes = 0
                  }
                }
                catch {
                  Write-Host "ready.json not usable yet: $($_.Exception.Message)"
                  $healthyWebProbes = 0
                }
              }

              if (
                $content -match 'phase=runtime_ready' -and
                $content -match 'phase=webview_requested' -and
                $content -match 'phase=primary_visible' -and
                $healthyWebProbes -ge 2
              ) {
                Write-Host 'PASS: installed Windows candidate reached primary Harness Web and served stable authenticated HTML'
                exit 0
              }
              if ($hostProcess.HasExited) {
                throw "HarnessDock exited before healthy primary Harness Web; exit=$($hostProcess.ExitCode)"
              }
            }
            throw "Timed out waiting for healthy primary Harness Web. readyUrl=$readyUrl healthyProbes=$healthyWebProbes Last trace:`n$content"
          }
          finally {
            if ($hostProcess -and -not $hostProcess.HasExited) {
              taskkill /PID $hostProcess.Id /T /F | Out-Null
            }
          }
