name: windows-packaged-startup

on:
  workflow_run:
    workflows:
      - tauri-candidate
    types:
      - completed

concurrency:
  group: windows-packaged-startup-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  startup-smoke:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_RUN_ID: ${{ github.event.workflow_run.id }}
      CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Require current main candidate
        id: current
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $mainSha = gh api "repos/$env:GITHUB_REPOSITORY/branches/main" --jq '.commit.sha'
          if ($env:CANDIDATE_SHA -ne $mainSha) {
            "run=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host "Skipping stale candidate $env:CANDIDATE_SHA; main is $mainSha"
            exit 0
          }
          "run=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Checkout exact candidate lifecycle smoke
        if: steps.current.outputs.run == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ env.CANDIDATE_SHA }}

      - name: Download exact Windows candidate
        if: steps.current.outputs.run == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item candidate-win -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path candidate-win | Out-Null
          gh run download $env:CANDIDATE_RUN_ID --repo $env:GITHUB_REPOSITORY --name tauri-desktop-win-x64 --dir candidate-win
          $installer = Get-ChildItem candidate-win -Recurse -File -Filter '*setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Windows NSIS candidate was not downloaded' }
          "installer=$($installer.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install exact candidate and prove startup plus zero-process graceful exit
        if: steps.current.outputs.run == 'true'
        shell: pwsh
        run: ./scripts/smoke-windows-installer.ps1 -InstallerPath $env:installer -TimeoutSeconds 120
