name: runtime-liveness-selfheal

on:
  push:
    branches:
      - fix/runtime-lease-hardening-v012

permissions:
  contents: write

jobs:
  patch-runtime-liveness:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/runtime-lease-hardening-v012
          fetch-depth: 0
      - name: Preserve RuntimeLease on inconclusive process inspection
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/tauri/src-tauri/src/runtime.rs')
          text = path.read_text(encoding='utf-8')
          old = '''            Err(error) => {
                          eprintln!("Unable to inspect dsh Runtime process: {error}");
                          false
                      }'''
          new = '''            Err(error) => {
                          eprintln!(
                              "Unable to inspect dsh Runtime process; preserving current RuntimeLease until exit is confirmed: {error}"
                          );
                          true
                      }'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one RuntimeProcess::is_alive error arm, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          cargo fmt --manifest-path apps/tauri/src-tauri/Cargo.toml
          cargo fmt --manifest-path apps/tauri/src-tauri/Cargo.toml -- --check
      - name: Commit the focused fix and remove the one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/runtime-liveness-selfheal.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/tauri/src-tauri/src/runtime.rs .github/workflows/runtime-liveness-selfheal.yml
          git diff --cached --check
          git commit -m "fix: preserve runtime lease on inconclusive process probe"
          git push origin HEAD:fix/runtime-lease-hardening-v012
