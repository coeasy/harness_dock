name: tauri-candidate

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps/tauri/**'
      - 'packages/bootstrap/**'
      - 'packages/client-runtime/**'
      - 'packages/plugin-embedded-client/**'
      - 'packages/docs-sync/origin.json'
      - 'tests/parity/**'
      - 'scripts/check-versions.mjs'
      - 'scripts/build-macos-dmg.sh'
      - 'scripts/generate-nsis-branding.ps1'
      - 'scripts/verify-windows-installer-icon.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/release-notes/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/tauri-candidate.yml'

concurrency:
  group: tauri-candidate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm check:versions
      - run: pnpm check:release
      - run: pnpm test
      - name: Build embedded client
        run: pnpm --filter @dsh/plugin-embedded-client build
      - name: Bundle Gateway sidecar
        run: pnpm --filter @dsh/desktop exec esbuild ../../packages/bootstrap/src/gateway-sidecar.ts --bundle --platform=node --format=esm --target=node22 --outfile=/tmp/harnessdock-gateway-sidecar.mjs
      - name: Validate shared candidate resources
        shell: bash
        run: |
          set -euo pipefail
          test -s packages/plugin-embedded-client/lib/index.js
          test -s apps/tauri/src-tauri/resources/dsh-client-runtime-compat/package.json
          test -s apps/tauri/src-tauri/resources/dsh-client-runtime-compat/index.js
          test -s apps/tauri/src-tauri/resources/dsh-client-runtime-compat/client.js
          test -s /tmp/harnessdock-gateway-sidecar.mjs
          test -s apps/tauri/src-tauri/icons/app-icon.png
          test -s scripts/build-macos-dmg.sh
          test -s scripts/verify-windows-installer-icon.mjs
          root_version="$(node -p "require('./package.json').version")"
          tauri_version="$(node -p "require('./apps/tauri/src-tauri/tauri.conf.json').version")"
          test "$tauri_version" = "$root_version" || { echo "Tauri version mismatch: root=$root_version tauri=$tauri_version" >&2; exit 1; }

  pack-upstream:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_OPTIONS: '--max-old-space-size=4096'
    steps:
      - uses: actions/checkout@v7
      - name: Resolve pinned upstream source
        id: origin
        shell: bash
        run: |
          set -euo pipefail
          echo "tag=$(node -p "require('./packages/docs-sync/origin.json').gitTag")" >> "$GITHUB_OUTPUT"
          echo "commit=$(node -p "require('./packages/docs-sync/origin.json').gitCommit")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ steps.origin.outputs.tag }}
          path: upstream
          fetch-depth: 1
      - name: Verify immutable upstream commit
        shell: bash
        run: |
          set -euo pipefail
          actual=$(git -C upstream rev-parse HEAD)
          expected='${{ steps.origin.outputs.commit }}'
          test "$actual" = "$expected" || { echo "upstream source mismatch: expected $expected, got $actual" >&2; exit 1; }
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install upstream dependencies with pinned pnpm
        working-directory: upstream
        run: npx --yes pnpm@11.7.0 install --frozen-lockfile
      - name: Build official upstream profile
        working-directory: upstream
        run: npx --yes pnpm@11.7.0 build:official
      - name: Pack and verify official dsh runtime closure
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          npx --yes pnpm@11.7.0 exec tsx scripts/release/pack.ts --family vendor --out dist/vendor
          npx --yes pnpm@11.7.0 exec tsx scripts/release/pack.ts --family dsh --out dist/dsh
          npx --yes pnpm@11.7.0 exec tsx scripts/release/verify-packed-install.ts --family dsh --from dist/dsh --from dist/vendor
          test -n "$(find dist/dsh dist/vendor -type f -name '*.tgz' -print -quit)"
      - uses: actions/upload-artifact@v7
        with:
          name: tauri-upstream-dsh-packed
          path: |
            upstream/dist/dsh/*.tgz
            upstream/dist/vendor/*.tgz
          retention-days: 7
          if-no-files-found: error
          compression-level: 0

  prepare-runtime:
    needs: [validate, pack-upstream]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            artifact: win-x64
            platform: win32
            arch: x64
          - runner: ubuntu-latest
            artifact: linux-x64
            platform: linux
            arch: x64
          - runner: macos-15-intel
            artifact: mac-x64
            platform: darwin
            arch: x64
          - runner: macos-latest
            artifact: mac-arm64
            platform: darwin
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      NODE_OPTIONS: '--max-old-space-size=4096'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/download-artifact@v8
        with:
          name: tauri-upstream-dsh-packed
          path: upstream-packed
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Prepare bundled runtime from official source packs
        run: pnpm --filter @dsh/client-runtime bundle-runtime
        env:
          DSH_PACKED_RUNTIME_DIR: upstream-packed
          DSH_RUNTIME_PLATFORM: ${{ matrix.platform }}
          DSH_RUNTIME_ARCH: ${{ matrix.arch }}
          DSH_RUNTIME_DIR: runtime-prepared
      - name: Verify prepared runtime manifest and platform isolation
        shell: bash
        env:
          EXPECTED_PLATFORM: ${{ matrix.platform }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          test -s runtime-prepared/manifest.json
          node <<'NODE'
          const fs = require('node:fs')
          const manifest = JSON.parse(fs.readFileSync('runtime-prepared/manifest.json', 'utf8'))
          if (manifest.platform !== process.env.EXPECTED_PLATFORM || manifest.arch !== process.env.EXPECTED_ARCH) throw new Error(`runtime manifest mismatch: ${manifest.platform}/${manifest.arch}`)
          if (!manifest.dshVersion || manifest.runtimeSource !== 'official-source-pack') throw new Error('runtime manifest is missing pinned official-source metadata')
          NODE
          case "$EXPECTED_PLATFORM" in
            win32)
              test ! -e runtime-prepared/node_modules/@koromix/koffi-linux-x64
              test ! -e runtime-prepared/node_modules/@deepseek-ai/node-addon-landlock-run-linux-x64
              ;;
            linux)
              test ! -e runtime-prepared/node_modules/@koromix/koffi-linux-x64/musl_x64
              test ! -e runtime-prepared/node_modules/@img/sharp-linuxmusl-x64
              ;;
            darwin)
              test ! -e runtime-prepared/node_modules/@koromix/koffi-linux-x64
              test ! -e runtime-prepared/node_modules/@deepseek-ai/node-addon-landlock-run-linux-x64
              ;;
          esac
      - uses: actions/upload-artifact@v7
        with:
          name: tauri-runtime-${{ matrix.artifact }}
          path: runtime-prepared
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
          include-hidden-files: true

  desktop-candidate:
    needs: [validate, prepare-runtime]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            artifact: win-x64
            bundles: nsis
          - runner: ubuntu-22.04
            artifact: linux-x64
            bundles: deb,appimage
          - runner: macos-15-intel
            artifact: mac-x64
            bundles: app
          - runner: macos-latest
            artifact: mac-arm64
            bundles: app
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      NODE_OPTIONS: '--max-old-space-size=4096'
      LINUXDEPLOY_VERSION: '1-alpha-20251107-1'
      LINUXDEPLOY_SHA256: 'c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d'
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2
      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/tauri/src-tauri
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Build embedded client
        run: pnpm --filter @dsh/plugin-embedded-client build
      - name: Bundle Gateway sidecar into Tauri resources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apps/tauri/src-tauri/resources
          pnpm --filter @dsh/desktop exec esbuild ../../packages/bootstrap/src/gateway-sidecar.ts --bundle --platform=node --format=esm --target=node22 --outfile=../tauri/src-tauri/resources/gateway-sidecar.mjs
          test -s apps/tauri/src-tauri/resources/gateway-sidecar.mjs
      - uses: actions/download-artifact@v8
        with:
          name: tauri-runtime-${{ matrix.artifact }}
          path: apps/tauri/src-tauri/resources/dsh-runtime
      - name: Verify full runtime before packaging
        shell: bash
        run: |
          set -euo pipefail
          test -s packages/plugin-embedded-client/lib/index.js
          test -s apps/tauri/src-tauri/resources/dsh-client-runtime-compat/package.json
          test -s apps/tauri/src-tauri/resources/dsh-client-runtime-compat/index.js
          test -s apps/tauri/src-tauri/resources/dsh-client-runtime-compat/client.js
          test -s apps/tauri/src-tauri/resources/gateway-sidecar.mjs
          pnpm --filter @dsh/client-runtime smoke-runtime -- --runtime-dir apps/tauri/src-tauri/resources/dsh-runtime --plugin packages/plugin-embedded-client/lib/index.js
          if [ "${{ runner.os }}" = Linux ]; then
            test ! -e apps/tauri/src-tauri/resources/dsh-runtime/node_modules/@koromix/koffi-linux-x64/musl_x64
            test ! -e apps/tauri/src-tauri/resources/dsh-runtime/node_modules/@img/sharp-linuxmusl-x64
            test -x apps/tauri/src-tauri/resources/dsh-runtime/node_modules/@deepseek-ai/node-addon-landlock-run-linux-x64/bin/landlock-run
          fi
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version 2.11.4 --locked
      - name: Generate branded Tauri icon set
        working-directory: apps/tauri
        shell: bash
        run: |
          set -euo pipefail
          cargo tauri icon src-tauri/icons/app-icon.png
          test -s src-tauri/icons/icon.png
          test -s src-tauri/icons/icon.ico
          test -s src-tauri/icons/icon.icns
      - name: Generate Windows installer branding
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/generate-nsis-branding.ps1
      - name: Pin Linux AppImage bundler
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          tool="$HOME/.cache/tauri/linuxdeploy-x86_64.AppImage"
          mkdir -p "$(dirname "$tool")"
          curl -fL --retry 3 --retry-delay 2 "https://github.com/linuxdeploy/linuxdeploy/releases/download/${LINUXDEPLOY_VERSION}/linuxdeploy-x86_64.AppImage" -o "$tool"
          echo "${LINUXDEPLOY_SHA256}  ${tool}" | sha256sum -c -
          chmod +x "$tool"
      - name: Build Tauri desktop candidate
        if: runner.os != 'Linux'
        working-directory: apps/tauri
        run: cargo tauri build --verbose --bundles ${{ matrix.bundles }}
      - name: Assemble macOS DMG without mount cycle
        if: runner.os == 'macOS'
        working-directory: apps/tauri
        shell: bash
        run: bash ../../scripts/build-macos-dmg.sh .
      - name: Build Tauri Linux DEB candidate
        if: runner.os == 'Linux'
        working-directory: apps/tauri
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../../.ci-logs
          cargo tauri build --verbose --bundles deb 2>&1 | tee ../../.ci-logs/tauri-linux-deb.log
      - name: Build Tauri Linux AppImage candidate
        if: runner.os == 'Linux'
        working-directory: apps/tauri
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../../.ci-logs
          cargo tauri build --verbose --bundles appimage 2>&1 | tee ../../.ci-logs/tauri-linux-appimage.log
      - name: Verify Windows installer uses HarnessDock icon
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem 'apps/tauri/src-tauri/target/release/bundle/nsis' -Filter '*.exe' -Recurse | Select-Object -First 1
          if (-not $setup) { throw 'Windows NSIS installer not found' }
          node scripts/verify-windows-installer-icon.mjs $setup.FullName apps/tauri/src-tauri/icons/icon.ico
      - name: Upload Linux bundler diagnostics
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: tauri-linux-bundler-logs
          path: .ci-logs/*.log
          retention-days: 7
          if-no-files-found: warn
          compression-level: 0
      - name: Validate desktop bundle exists
        shell: bash
        run: |
          set -euo pipefail
          test -d apps/tauri/src-tauri/target/release/bundle
          case "${{ runner.os }}" in
            Windows) test -n "$(find apps/tauri/src-tauri/target/release/bundle -type f -name '*.exe' -print -quit)" ;;
            Linux)
              test -n "$(find apps/tauri/src-tauri/target/release/bundle -type f -name '*.deb' -print -quit)"
              test -n "$(find apps/tauri/src-tauri/target/release/bundle -type f -name '*.AppImage' -print -quit)"
              ;;
            macOS) test -n "$(find apps/tauri/src-tauri/target/release/bundle -type f -name '*.dmg' -print -quit)" ;;
          esac
      - uses: actions/upload-artifact@v7
        with:
          name: tauri-desktop-${{ matrix.artifact }}
          path: apps/tauri/src-tauri/target/release/bundle/**
          retention-days: 7
          if-no-files-found: error
          compression-level: 0

  android-candidate:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux Tauri dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: pnpm/action-setup@v6
        with: { version: 10.12.1 }
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-linux-android }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: apps/tauri/src-tauri }
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm --filter @dsh/plugin-embedded-client build
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version 2.11.4 --locked
      - name: Resolve Android NDK
        shell: bash
        run: |
          set -euo pipefail
          ndk="${ANDROID_NDK_LATEST_HOME:-}"
          if [ -z "$ndk" ]; then ndk="$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"; fi
          test -d "$ndk"
          echo "NDK_HOME=$ndk" >> "$GITHUB_ENV"
      - name: Initialize Android native project
        working-directory: apps/tauri
        run: cargo tauri android init --ci --skip-targets-install
      - name: Replace default Android launcher icons with HarnessDock
        working-directory: apps/tauri
        shell: bash
        run: |
          set -euo pipefail
          launcher="$(find src-tauri/gen/android/app/src/main/res -type f -name 'ic_launcher.png' -print | sort | tail -1)"
          test -n "$launcher"
          before="$(sha256sum "$launcher" | awk '{print $1}')"
          cargo tauri icon src-tauri/icons/app-icon.png
          after="$(sha256sum "$launcher" | awk '{print $1}')"
          test "$before" != "$after" || { echo 'Android launcher icon still matches Tauri template default' >&2; exit 1; }
      - name: Build Android candidate APK and AAB
        working-directory: apps/tauri
        run: cargo tauri android build --debug --apk --aab --target aarch64 --ci
      - name: Validate Android outputs
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(find apps/tauri/src-tauri/gen/android/app/build/outputs -type f -name '*.apk' -print -quit)"
          test -n "$(find apps/tauri/src-tauri/gen/android/app/build/outputs -type f -name '*.aab' -print -quit)"
      - uses: actions/upload-artifact@v7
        with:
          name: tauri-android-arm64-candidate
          path: apps/tauri/src-tauri/gen/android/app/build/outputs/**
          retention-days: 7
          if-no-files-found: error
          compression-level: 0

  ios-candidate:
    needs: validate
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 10.12.1 }
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-apple-ios-sim }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: apps/tauri/src-tauri }
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm --filter @dsh/plugin-embedded-client build
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version 2.11.4 --locked
      - name: Initialize iOS native project
        working-directory: apps/tauri
        run: cargo tauri ios init --ci --skip-targets-install
      - name: Replace default iOS app icons with HarnessDock
        working-directory: apps/tauri
        shell: bash
        run: |
          set -euo pipefail
          appicons="$(find src-tauri/gen/apple -type d -name '*.appiconset' -print -quit)"
          test -n "$appicons"
          before="$(find "$appicons" -type f -name '*.png' -exec shasum -a 256 {} \; | sort | shasum -a 256 | awk '{print $1}')"
          cargo tauri icon src-tauri/icons/app-icon.png
          after="$(find "$appicons" -type f -name '*.png' -exec shasum -a 256 {} \; | sort | shasum -a 256 | awk '{print $1}')"
          test -n "$after"
          test "$before" != "$after" || { echo 'iOS AppIcon set still matches Tauri template default' >&2; exit 1; }
      - name: Build iOS simulator candidate
        working-directory: apps/tauri
        run: cargo tauri ios build --debug --target aarch64-sim --ci
      - name: Package and validate iOS simulator candidate
        shell: bash
        run: |
          set -euo pipefail
          app="$(find apps/tauri/src-tauri/gen/apple -type d -name '*.app' -print -quit)"
          test -n "$app"
          version="$(node -p "require('./package.json').version")"
          mkdir -p mobile-artifacts
          ditto -c -k --sequesterRsrc --keepParent "$app" "mobile-artifacts/HarnessDock-${version}-ios-arm64-simulator.zip"
          test -s "mobile-artifacts/HarnessDock-${version}-ios-arm64-simulator.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: tauri-ios-simulator-candidate
          path: |
            mobile-artifacts/*.zip
            apps/tauri/src-tauri/gen/apple/*.xcodeproj/**
          retention-days: 7
          if-no-files-found: error
          compression-level: 0

  candidate-gate:
    needs: [validate, pack-upstream, prepare-runtime, desktop-candidate, android-candidate, ios-candidate]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every Tauri candidate stage
        shell: bash
        env:
          VALIDATE: ${{ needs.validate.result }}
          UPSTREAM: ${{ needs.pack-upstream.result }}
          RUNTIME: ${{ needs.prepare-runtime.result }}
          DESKTOP: ${{ needs.desktop-candidate.result }}
          ANDROID: ${{ needs.android-candidate.result }}
          IOS: ${{ needs.ios-candidate.result }}
        run: |
          set -euo pipefail
          printf 'validate=%s upstream=%s runtime=%s desktop=%s android=%s ios=%s\n' "$VALIDATE" "$UPSTREAM" "$RUNTIME" "$DESKTOP" "$ANDROID" "$IOS"
          test "$VALIDATE" = success
          test "$UPSTREAM" = success
          test "$RUNTIME" = success
          test "$DESKTOP" = success
          test "$ANDROID" = success
          test "$IOS" = success
