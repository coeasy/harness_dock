name: release

on:
  workflow_run:
    workflows:
      - tauri-candidate
    types:
      - completed
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Exact release tag to publish (for example v0.2.0)'
        type: string
        required: true
      candidate_run_id:
        description: 'Successful tauri-candidate run id built from this exact main SHA'
        type: string
        required: true

concurrency:
  group: release-${{ github.event.workflow_run.id || inputs.release_tag || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.candidate_run_id }}
      RELEASE_TAG_INPUT: ${{ inputs.release_tag || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Validate exact green main candidate and CI before publishing
        id: release
        shell: bash
        run: |
          set -euo pipefail

          candidate_sha="$(git rev-parse HEAD)"
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')"
          if [ "$candidate_sha" != "$main_sha" ]; then
            if [ "$GITHUB_EVENT_NAME" = 'workflow_run' ]; then
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "::notice::Skipping stale automatic candidate: candidate=${candidate_sha} main=${main_sha}"
              exit 0
            fi
            echo "candidate is stale: candidate=$candidate_sha main=$main_sha" >&2
            exit 1
          fi

          version="$(node -p "require('./package.json').version")"
          expected_tag="v${version}"
          release_tag="${RELEASE_TAG_INPUT:-$expected_tag}"
          test "$release_tag" = "$expected_tag" || {
            echo "release tag mismatch: expected $expected_tag, got $release_tag" >&2
            exit 1
          }
          test -s ".github/release-notes/${release_tag}.md"

          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}")"
          run_sha="$(printf '%s' "$run_json" | jq -r '.head_sha')"
          run_branch="$(printf '%s' "$run_json" | jq -r '.head_branch')"
          run_status="$(printf '%s' "$run_json" | jq -r '.status')"
          run_conclusion="$(printf '%s' "$run_json" | jq -r '.conclusion')"
          run_path="$(printf '%s' "$run_json" | jq -r '.path')"

          test "$run_sha" = "$candidate_sha" || {
            echo "candidate SHA mismatch: checkout=$candidate_sha candidate=$run_sha" >&2
            exit 1
          }
          test "$run_branch" = main || {
            echo "candidate was not built from main: $run_branch" >&2
            exit 1
          }
          test "$run_status" = completed && test "$run_conclusion" = success || {
            echo "candidate is not green: status=$run_status conclusion=$run_conclusion" >&2
            exit 1
          }
          test "$run_path" = '.github/workflows/tauri-candidate.yml' || {
            echo "unexpected candidate workflow path: $run_path" >&2
            exit 1
          }

          # Candidate is slower than the normal CI, but explicitly require a
          # successful same-SHA CI instead of relying on timing.
          ci_run_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?branch=main&per_page=100" \
            --jq ".workflow_runs[] | select(.head_sha == \"${candidate_sha}\" and .path == \".github/workflows/ci.yml\" and .status == \"completed\" and .conclusion == \"success\") | .id" \
            | head -1)"
          test -n "$ci_run_id" || {
            echo "no successful same-SHA main CI found for ${candidate_sha}" >&2
            exit 1
          }

          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "sha=$candidate_sha" >> "$GITHUB_OUTPUT"
          echo "ci_run_id=$ci_run_id" >> "$GITHUB_OUTPUT"

      - name: Download exact candidate artifacts
        if: steps.release.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release-input release-assets
          mkdir -p release-input release-assets
          gh run download "$CANDIDATE_RUN_ID" --repo "$GITHUB_REPOSITORY" --dir release-input

      - name: Assemble Tauri release assets
        if: steps.release.outputs.publish == 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          version="$(node -p "require('./package.json').version")"
          runtime_version="$(node -p "require('./packages/docs-sync/origin.json').dshVersion")"

          copy_one() {
            local root="$1"
            local pattern="$2"
            local destination="$3"
            local source
            source="$(find "$root" -type f -name "$pattern" -print | sort | head -1)"
            test -n "$source" || {
              echo "missing release asset: root=$root pattern=$pattern" >&2
              exit 1
            }
            cp "$source" "$destination"
            test -s "$destination"
          }

          copy_one release-input/tauri-desktop-win-x64 '*setup.exe' "release-assets/HarnessDock-${version}-windows-x64-setup.exe"
          copy_one release-input/tauri-desktop-win-x64 '*.exe.sig' "release-assets/HarnessDock-${version}-windows-x64-setup.exe.sig"
          copy_one release-input/tauri-desktop-linux-x64 '*.deb' "release-assets/HarnessDock-${version}-linux-x64.deb"
          copy_one release-input/tauri-desktop-linux-x64 '*.AppImage' "release-assets/HarnessDock-${version}-linux-x64.AppImage"
          copy_one release-input/tauri-desktop-linux-x64 '*.AppImage.sig' "release-assets/HarnessDock-${version}-linux-x64.AppImage.sig"
          copy_one release-input/tauri-desktop-mac-x64 '*.dmg' "release-assets/HarnessDock-${version}-macos-x64.dmg"
          copy_one release-input/tauri-desktop-mac-x64 '*.app.tar.gz' "release-assets/HarnessDock-${version}-macos-x64.app.tar.gz"
          copy_one release-input/tauri-desktop-mac-x64 '*.app.tar.gz.sig' "release-assets/HarnessDock-${version}-macos-x64.app.tar.gz.sig"
          copy_one release-input/tauri-desktop-mac-arm64 '*.dmg' "release-assets/HarnessDock-${version}-macos-arm64.dmg"
          copy_one release-input/tauri-desktop-mac-arm64 '*.app.tar.gz' "release-assets/HarnessDock-${version}-macos-arm64.app.tar.gz"
          copy_one release-input/tauri-desktop-mac-arm64 '*.app.tar.gz.sig' "release-assets/HarnessDock-${version}-macos-arm64.app.tar.gz.sig"
          copy_one release-input/tauri-android-arm64-candidate '*.apk' "release-assets/HarnessDock-${version}-android-arm64-release.apk"
          copy_one release-input/tauri-android-arm64-candidate '*.aab' "release-assets/HarnessDock-${version}-android-arm64-release.aab"
          copy_one release-input/tauri-ios-simulator-candidate '*.zip' "release-assets/HarnessDock-${version}-ios-arm64-simulator.zip"

          pack_runtime() {
            local artifact="$1"
            local target="$2"
            local manifest
            local root
            manifest="$(find "release-input/tauri-runtime-${artifact}" -type f -name manifest.json -print -quit)"
            test -n "$manifest" || {
              echo "missing runtime manifest for $artifact" >&2
              exit 1
            }
            root="$(dirname "$manifest")"
            if [ "$target" != 'win32-x64' ]; then
              chmod 755 "$root/bin/node"
            fi
            tar -C "$root" -czf "release-assets/HarnessDock-runtime-${runtime_version}-${target}.tar.gz" .
            test -s "release-assets/HarnessDock-runtime-${runtime_version}-${target}.tar.gz"
          }

          pack_runtime win-x64 win32-x64
          pack_runtime linux-x64 linux-x64
          pack_runtime mac-x64 darwin-x64
          pack_runtime mac-arm64 darwin-arm64

          node scripts/generate-tauri-updater-manifest.mjs release-assets "$RELEASE_TAG"
          test -s release-assets/latest.json
          sha256sum release-assets/* > release-assets/SHA256SUMS
          test -s release-assets/SHA256SUMS
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq 20
          ls -lh release-assets

      - name: Publish or replace validated HarnessDock release
        if: steps.release.outputs.publish == 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail

          existing_release_id=""
          if release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" 2>/dev/null)"; then
            existing_release_id="$(printf '%s' "$release_json" | jq -r '.id')"
          fi

          existing_tag_sha=""
          if tag_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" 2>/dev/null)"; then
            existing_tag_sha="$(printf '%s' "$tag_json" | jq -r '.object.sha')"
          fi

          if [ -n "$existing_tag_sha" ]; then
            echo "Replacing validated ${RELEASE_TAG}: ${existing_tag_sha} -> ${RELEASE_SHA}"
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${RELEASE_TAG}" \
              -f sha="$RELEASE_SHA" -F force=true >/dev/null
          else
            echo "Creating validated ${RELEASE_TAG} at ${RELEASE_SHA}"
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${RELEASE_TAG}" -f sha="$RELEASE_SHA" >/dev/null
          fi

          if [ -n "$existing_release_id" ]; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${existing_release_id}" \
              -f target_commitish="$RELEASE_SHA" \
              -f name="HarnessDock ${RELEASE_TAG}" \
              -f body="$(cat ".github/release-notes/${RELEASE_TAG}.md")" \
              -F draft=false -F prerelease=false -f make_latest=true >/dev/null
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --target "$RELEASE_SHA" \
              --title "HarnessDock ${RELEASE_TAG}" \
              --notes-file ".github/release-notes/${RELEASE_TAG}.md" \
              --latest
          fi

      - name: Verify published tag and assets
        if: steps.release.outputs.publish == 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha')"
          test "$tag_sha" = "$RELEASE_SHA"
          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")"
          test "$(printf '%s' "$release_json" | jq -r '.draft')" = false
          test "$(printf '%s' "$release_json" | jq -r '.prerelease')" = false
          asset_count="$(printf '%s' "$release_json" | jq '[.assets[] | select(.size > 0)] | length')"
          test "$asset_count" -eq 20 || {
            echo "expected 20 non-empty assets, got $asset_count" >&2
            exit 1
          }
          printf '%s' "$release_json" | jq -e '.assets[] | select(.name == "SHA256SUMS" and .size > 0)' >/dev/null
          printf '%s' "$release_json" | jq -e '.assets[] | select(.name == "latest.json" and .size > 0)' >/dev/null
          for asset in \
            "HarnessDock-${RELEASE_TAG#v}-windows-x64-setup.exe.sig" \
            "HarnessDock-${RELEASE_TAG#v}-linux-x64.AppImage.sig" \
            "HarnessDock-${RELEASE_TAG#v}-macos-x64.app.tar.gz.sig" \
            "HarnessDock-${RELEASE_TAG#v}-macos-arm64.app.tar.gz.sig"; do
            printf '%s' "$release_json" | jq -e --arg asset "$asset" '.assets[] | select(.name == $asset and .size > 0)' >/dev/null
          done

      - name: Mark the exact origin as released
        if: steps.release.outputs.publish == 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/mark-released.mjs
          git add packages/docs-sync/released-origin.json
          if git diff --cached --quiet; then
            echo "released-origin.json already matches ${RELEASE_TAG}"
            exit 0
          fi

          # Never append the marker to a newer main branch. The release tag is
          # immutable in meaning even though the workflow can replace a
          # previously validated tag, so the marker must be a fast-forward from
          # the exact candidate SHA that was published.
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')"
          test "$main_sha" = "$RELEASE_SHA" || {
            echo "main advanced before release marker: main=$main_sha release=$RELEASE_SHA" >&2
            exit 1
          }
          git commit -m "chore: mark ${RELEASE_TAG} as released"
          git push origin HEAD:refs/heads/main
