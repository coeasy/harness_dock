name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to publish under (e.g. v0.1.1). Empty = draft unreleased build.'
        type: string
        required: false
      target:
        description: 'Build target: all, one OS, or one OS/scenario pair'
        type: choice
        required: false
        default: all
        options:
          - all
          - win
          - mac
          - linux
          - win-thin
          - win-full
          - mac-thin
          - mac-full
          - linux-thin
          - linux-full

concurrency:
  group: release-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      build_matrix: ${{ steps.matrix.outputs.build_matrix }}
      runtime_matrix: ${{ steps.matrix.outputs.runtime_matrix }}
    steps:
      - name: Select release targets
        id: matrix
        shell: bash
        env:
          RELEASE_TARGET: ${{ inputs.target || 'all' }}
        run: |
          set -euo pipefail
          build_rows='[
            {"runner":"windows-latest","artifact_os":"win","target_os":"win","platform":"win32","scenario":"thin","arch":"x64","runtime_dir":"runtimes/pack","packaged_runtime_dir":"apps/desktop/release/thin/win-unpacked/resources/dsh-runtime","packaged_plugin":"apps/desktop/release/thin/win-unpacked/resources/plugin-embedded-client/index.js","electron":"apps/desktop/release/thin/win-unpacked/HarnessDock.exe","command":"node apps/desktop/scripts/pack.mjs --os win --scenario thin --arch x64"},
            {"runner":"windows-latest","artifact_os":"win","target_os":"win","platform":"win32","scenario":"full","arch":"x64","runtime_dir":"runtimes/pack","packaged_runtime_dir":"apps/desktop/release/full/win-unpacked/resources/dsh-runtime","packaged_plugin":"apps/desktop/release/full/win-unpacked/resources/plugin-embedded-client/index.js","electron":"","command":"node apps/desktop/scripts/pack.mjs --os win --scenario full --arch x64"},
            {"runner":"ubuntu-latest","artifact_os":"linux","target_os":"linux","platform":"linux","scenario":"thin","arch":"x64","runtime_dir":"runtimes/pack","packaged_runtime_dir":"apps/desktop/release/thin/linux-unpacked/resources/dsh-runtime","packaged_plugin":"apps/desktop/release/thin/linux-unpacked/resources/plugin-embedded-client/index.js","electron":"apps/desktop/release/thin/linux-unpacked/HarnessDock","command":"node apps/desktop/scripts/pack.mjs --os linux --scenario thin --arch x64"},
            {"runner":"ubuntu-latest","artifact_os":"linux","target_os":"linux","platform":"linux","scenario":"full","arch":"x64","runtime_dir":"runtimes/pack","packaged_runtime_dir":"apps/desktop/release/full/linux-unpacked/resources/dsh-runtime","packaged_plugin":"apps/desktop/release/full/linux-unpacked/resources/plugin-embedded-client/index.js","electron":"","command":"node apps/desktop/scripts/pack.mjs --os linux --scenario full --arch x64"},
            {"runner":"macos-latest","artifact_os":"mac","target_os":"mac","platform":"darwin","scenario":"thin","arch":"x64","runtime_dir":"runtimes/pack-x64","packaged_runtime_dir":"apps/desktop/release/thin/mac/HarnessDock.app/Contents/Resources/dsh-runtime","packaged_plugin":"apps/desktop/release/thin/mac/HarnessDock.app/Contents/Resources/plugin-embedded-client/index.js","electron":"apps/desktop/release/thin/mac/HarnessDock.app/Contents/MacOS/HarnessDock","command":"node apps/desktop/scripts/pack.mjs --os mac --scenario thin --arch x64"},
            {"runner":"macos-latest","artifact_os":"mac","target_os":"mac","platform":"darwin","scenario":"thin","arch":"arm64","runtime_dir":"runtimes/pack-arm64","packaged_runtime_dir":"apps/desktop/release/thin/mac-arm64/HarnessDock.app/Contents/Resources/dsh-runtime","packaged_plugin":"apps/desktop/release/thin/mac-arm64/HarnessDock.app/Contents/Resources/plugin-embedded-client/index.js","electron":"apps/desktop/release/thin/mac-arm64/HarnessDock.app/Contents/MacOS/HarnessDock","command":"node apps/desktop/scripts/pack.mjs --os mac --scenario thin --arch arm64"},
            {"runner":"macos-latest","artifact_os":"mac","target_os":"mac","platform":"darwin","scenario":"full","arch":"x64","runtime_dir":"runtimes/pack-x64","packaged_runtime_dir":"apps/desktop/release/full/mac/HarnessDock.app/Contents/Resources/dsh-runtime","packaged_plugin":"apps/desktop/release/full/mac/HarnessDock.app/Contents/Resources/plugin-embedded-client/index.js","electron":"","command":"node apps/desktop/scripts/pack.mjs --os mac --scenario full --arch x64"},
            {"runner":"macos-latest","artifact_os":"mac","target_os":"mac","platform":"darwin","scenario":"full","arch":"arm64","runtime_dir":"runtimes/pack-arm64","packaged_runtime_dir":"apps/desktop/release/full/mac-arm64/HarnessDock.app/Contents/Resources/dsh-runtime","packaged_plugin":"apps/desktop/release/full/mac-arm64/HarnessDock.app/Contents/Resources/plugin-embedded-client/index.js","electron":"","command":"node apps/desktop/scripts/pack.mjs --os mac --scenario full --arch arm64"}
          ]'
          runtime_rows='[
            {"runner":"ubuntu-latest","artifact_os":"win","target_os":"win","platform":"win32","arch":"x64","runtime_dir":"runtimes/pack"},
            {"runner":"ubuntu-latest","artifact_os":"linux","target_os":"linux","platform":"linux","arch":"x64","runtime_dir":"runtimes/pack"},
            {"runner":"macos-latest","artifact_os":"mac","target_os":"mac","platform":"darwin","arch":"x64","runtime_dir":"runtimes/pack-x64"},
            {"runner":"macos-latest","artifact_os":"mac","target_os":"mac","platform":"darwin","arch":"arm64","runtime_dir":"runtimes/pack-arm64"}
          ]'
          build_matrix=$(printf '%s' "$build_rows" | jq -c --arg target "$RELEASE_TARGET" '[.[] | select($target == "all" or $target == .target_os or $target == (.target_os + "-" + .scenario))]')
          runtime_matrix=$(printf '%s' "$runtime_rows" | jq -c --arg target "$RELEASE_TARGET" '[.[] | select($target == "all" or $target == .target_os or $target == (.target_os + "-thin") or $target == (.target_os + "-full"))]')
          echo "build_matrix=$(jq -cn --argjson include "$build_matrix" '{include:$include}')" >> "$GITHUB_OUTPUT"
          echo "runtime_matrix=$(jq -cn --argjson include "$runtime_matrix" '{include:$include}')" >> "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm check:versions
      - run: pnpm check:release
      - run: pnpm test

  source-pack:
    needs: test
    if: needs.test.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - name: Read exact upstream commit
        id: origin
        shell: bash
        run: |
          commit=$(node -p "require('./packages/docs-sync/origin.json').gitCommit")
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ steps.origin.outputs.commit }}
          path: upstream
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install upstream pnpm toolchain
        run: npm install --global pnpm@11.7.0
      - name: Pack exact upstream release family
        run: bash scripts/pack-upstream-dsh.sh upstream upstream-package-set
      - uses: actions/upload-artifact@v7
        with:
          name: dsh-source-package-set
          path: upstream-package-set
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  prepare-runtime:
    needs: [plan, source-pack]
    if: needs.plan.result == 'success' && needs.source-pack.result == 'success'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.runtime_matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - uses: actions/download-artifact@v8
        with:
          name: dsh-source-package-set
          path: upstream-package-set
      - name: Prepare target runtime from source package set
        run: pnpm --filter @dsh/client-runtime bundle-runtime
        env:
          DSH_PACKAGE_SET_DIR: upstream-package-set
          DSH_RUNTIME_PLATFORM: ${{ matrix.platform }}
          DSH_RUNTIME_ARCH: ${{ matrix.arch }}
          DSH_RUNTIME_DIR: ${{ matrix.runtime_dir }}
      - uses: actions/upload-artifact@v7
        with:
          name: runtime-${{ matrix.artifact_os }}-${{ matrix.arch }}
          path: ${{ matrix.runtime_dir }}
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
          include-hidden-files: true

  build:
    needs: [plan, prepare-runtime]
    if: always() && needs.plan.result == 'success' && needs.prepare-runtime.result == 'success'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.build_matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 55
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Cache electron-builder downloads (Unix)
        if: runner.os != 'Windows'
        uses: actions/cache@v6
        with:
          path: ~/.cache/electron-builder
          key: electron-builder-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Cache electron-builder downloads (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v6
        with:
          path: ~/AppData/Local/electron-builder/Cache
          key: electron-builder-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile --prefer-offline
      - uses: actions/download-artifact@v8
        with:
          name: runtime-${{ matrix.artifact_os }}-${{ matrix.arch }}
          path: ${{ matrix.runtime_dir }}
      - name: Repair and verify transported runtime
        run: pnpm --filter @dsh/client-runtime bundle-runtime
        env:
          DSH_RUNTIME_PLATFORM: ${{ matrix.platform }}
          DSH_RUNTIME_ARCH: ${{ matrix.arch }}
          DSH_RUNTIME_DIR: ${{ matrix.runtime_dir }}
      - name: Build desktop package
        run: ${{ matrix.command }}
        env:
          GH_OWNER: ${{ github.repository_owner }}
          GH_REPO: ${{ github.event.repository.name }}
          DSH_SKIP_RUNTIME_PREPARE: '1'
          DSH_RUNTIME_DIR: ${{ matrix.runtime_dir }}
      - name: Smoke packaged Full runtime
        if: matrix.scenario == 'full'
        run: pnpm --filter @dsh/client-runtime smoke-runtime -- --runtime-dir ${{ matrix.packaged_runtime_dir }} --plugin ${{ matrix.packaged_plugin }}
      - name: Smoke packaged Thin runtime
        if: matrix.scenario == 'thin'
        run: pnpm --filter @dsh/client-runtime smoke-thin-runtime -- --runtime-dir ${{ matrix.packaged_runtime_dir }} --plugin ${{ matrix.packaged_plugin }} --electron ${{ matrix.electron }}
      - name: Validate package size budget
        run: pnpm check:size
      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          release_dir="apps/desktop/release/${{ matrix.scenario }}"
          find "$release_dir" -maxdepth 1 -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' -o -name '*.AppImage' -o -name '*.deb' \) -exec cp {} dist/ \;
          if [ "${{ matrix.scenario }}" = "full" ]; then
            find "$release_dir" -maxdepth 1 -type f \( -name '*.blockmap' -o -name 'latest*.yml' \) -exec cp {} dist/ \;
          fi
          test -n "$(find dist -type f -print -quit)"
          ls -lah dist
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.artifact_os }}-${{ matrix.scenario }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifact-bundles
          pattern: desktop-*
          merge-multiple: false
      - name: Assemble release assets and merge macOS update metadata
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts
          mkdir -p artifacts
          while IFS= read -r file; do
            name=$(basename "$file")
            [ "$name" = "latest-mac.yml" ] && continue
            if [ -e "artifacts/$name" ]; then
              echo "duplicate release asset filename: $name" >&2
              exit 1
            fi
            cp "$file" "artifacts/$name"
          done < <(find artifact-bundles -type f -print | sort)

          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto'
          import { readFileSync, readdirSync, writeFileSync } from 'node:fs'
          import path from 'node:path'
          const dir = 'artifacts'
          const names = readdirSync(dir)
          const version = JSON.parse(readFileSync('package.json', 'utf8')).version
          const zips = names
            .filter((name) => /^HarnessDock-.*-mac-(x64|arm64)-full\.zip$/.test(name))
            .sort((a, b) => Number(a.includes('-arm64-')) - Number(b.includes('-arm64-')) || a.localeCompare(b))
          if (zips.length > 0) {
            const files = []
            for (const zip of zips) {
              const arch = zip.match(/-mac-(x64|arm64)-full\.zip$/)?.[1]
              const dmg = names.find((name) => name.endsWith(`-mac-${arch}-full.dmg`))
              if (!arch || !dmg) throw new Error(`missing macOS ${arch} full pair`)
              for (const name of [zip, dmg]) {
                const data = readFileSync(path.join(dir, name))
                files.push({
                  url: name,
                  sha512: createHash('sha512').update(data).digest('base64'),
                  size: data.length,
                })
              }
            }
            let yml = `version: ${version}\nfiles:\n`
            for (const file of files) {
              yml += `  - url: ${file.url}\n    sha512: ${file.sha512}\n    size: ${file.size}\n`
            }
            yml += `releaseDate: '${new Date().toISOString()}'\n`
            writeFileSync(path.join(dir, 'latest-mac.yml'), yml, 'utf8')
          }
          NODE
          echo 'Final release assets:'
          find artifacts -maxdepth 1 -type f -printf '%f\n' | sort
          test -n "$(find artifacts -maxdepth 1 -type f -print -quit)"
      - name: Validate combined macOS update metadata
        shell: bash
        run: |
          set -euo pipefail
          if compgen -G 'artifacts/HarnessDock-*-mac-*-full.zip' >/dev/null; then
            test -f artifacts/latest-mac.yml
            grep -q -- '-mac-arm64-full.zip' artifacts/latest-mac.yml
            grep -q -- '-mac-arm64-full.dmg' artifacts/latest-mac.yml
            grep -q -- '-mac-x64-full.zip' artifacts/latest-mac.yml
            grep -q -- '-mac-x64-full.dmg' artifacts/latest-mac.yml
          fi
      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "draft=false" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.release_tag }}" ]; then
            echo "tag=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
            echo "draft=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=unreleased-$(date +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"
            echo "draft=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate public release notes
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          template=".github/release-notes/v${VERSION}.md"
          if [ -f "$template" ]; then
            cp "$template" notes.md
          else
            printf '# HarnessDock v%s\n\nHarnessDock v%s release.\n' "$VERSION" "$VERSION" > notes.md
          fi
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: HarnessDock ${{ steps.tag.outputs.tag }}
          draft: ${{ steps.tag.outputs.draft }}
          files: artifacts/*
          body_path: notes.md
          generate_release_notes: false
          fail_on_unmatched_files: true
          overwrite_files: true
          make_latest: true

  cleanup:
    needs: publish
    if: needs.publish.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Mark released origin baseline
        shell: bash
        run: |
          set -euo pipefail
          cp packages/docs-sync/origin.json packages/docs-sync/released-origin.json
          if git diff --quiet -- packages/docs-sync/released-origin.json; then
            echo 'released-origin baseline already current'
          else
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add -- packages/docs-sync/released-origin.json
            git commit -m 'chore: mark HarnessDock v0.1.1 released origin'
            git push origin HEAD:main
          fi
      - name: Delete historical development branches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100" --jq '.[].name' | while IFS= read -r branch; do
            [ "$branch" = "main" ] && continue
            echo "Deleting branch: $branch"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/$branch" || true
          done
      - name: Delete historical Actions runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current="${GITHUB_RUN_ID}"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" --jq '.workflow_runs[].id' | while IFS= read -r run; do
            [ "$run" = "$current" ] && continue
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/$run" || true
          done
