name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to publish under (e.g. v0.1.1). Empty = draft release named "unreleased".'
        type: string
        required: false
      target:
        description: 'Build target: all, one OS, or one OS/scenario pair'
        type: choice
        required: false
        default: all
        options:
          - all
          - win
          - mac
          - linux
          - win-thin
          - win-full
          - mac-thin
          - mac-full
          - linux-thin
          - linux-full

concurrency:
  group: release-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      build_matrix: ${{ steps.matrix.outputs.build_matrix }}
      runtime_matrix: ${{ steps.matrix.outputs.runtime_matrix }}
    steps:
      - name: Select release targets
        id: matrix
        shell: bash
        env:
          RELEASE_TARGET: ${{ inputs.target || 'all' }}
        run: |
          set -euo pipefail
          build_rows='[
            {"runner":"windows-latest","artifact_os":"win","target_os":"win","platform":"win32","scenario":"thin","arch":"x64","runtime_dir":"","packaged_runtime_dir":"","packaged_plugin":"","command":"node apps/desktop/scripts/pack.mjs --os win --scenario thin"},
            {"runner":"windows-latest","artifact_os":"win","target_os":"win","platform":"win32","scenario":"full","arch":"x64","runtime_dir":"runtimes/pack","packaged_runtime_dir":"apps/desktop/release/full/win-unpacked/resources/dsh-runtime","packaged_plugin":"apps/desktop/release/full/win-unpacked/resources/plugin-embedded-client/index.js","command":"node apps/desktop/scripts/pack.mjs --os win --scenario full"},
            {"runner":"ubuntu-latest","artifact_os":"linux","target_os":"linux","platform":"linux","scenario":"thin","arch":"x64","runtime_dir":"","packaged_runtime_dir":"","packaged_plugin":"","command":"node apps/desktop/scripts/pack.mjs --os linux --scenario thin"},
            {"runner":"ubuntu-latest","artifact_os":"linux","target_os":"linux","platform":"linux","scenario":"full","arch":"x64","runtime_dir":"runtimes/pack","packaged_runtime_dir":"apps/desktop/release/full/linux-unpacked/resources/dsh-runtime","packaged_plugin":"apps/desktop/release/full/linux-unpacked/resources/plugin-embedded-client/index.js","command":"node apps/desktop/scripts/pack.mjs --os linux --scenario full"},
            {"runner":"macos-latest","artifact_os":"mac","target_os":"mac","platform":"darwin","scenario":"thin","arch":"all","runtime_dir":"","packaged_runtime_dir":"","packaged_plugin":"","command":"node apps/desktop/scripts/pack.mjs --os mac --scenario thin"},
            {"runner":"macos-15-intel","artifact_os":"mac","target_os":"mac","platform":"darwin","scenario":"full","arch":"x64","runtime_dir":"runtimes/pack-x64","packaged_runtime_dir":"apps/desktop/release/full/mac/HarnessDock.app/Contents/Resources/dsh-runtime","packaged_plugin":"apps/desktop/release/full/mac/HarnessDock.app/Contents/Resources/plugin-embedded-client/index.js","command":"node apps/desktop/scripts/pack.mjs --os mac --scenario full --arch x64"},
            {"runner":"macos-latest","artifact_os":"mac","target_os":"mac","platform":"darwin","scenario":"full","arch":"arm64","runtime_dir":"runtimes/pack-arm64","packaged_runtime_dir":"apps/desktop/release/full/mac-arm64/HarnessDock.app/Contents/Resources/dsh-runtime","packaged_plugin":"apps/desktop/release/full/mac-arm64/HarnessDock.app/Contents/Resources/plugin-embedded-client/index.js","command":"node apps/desktop/scripts/pack.mjs --os mac --scenario full --arch arm64"}
          ]'
          runtime_rows='[
            {"enabled":true,"runner":"ubuntu-latest","artifact_os":"win","target_os":"win","platform":"win32","arch":"x64","runtime_dir":"runtimes/pack"},
            {"enabled":true,"runner":"ubuntu-latest","artifact_os":"linux","target_os":"linux","platform":"linux","arch":"x64","runtime_dir":"runtimes/pack"},
            {"enabled":true,"runner":"macos-15-intel","artifact_os":"mac","target_os":"mac","platform":"darwin","arch":"x64","runtime_dir":"runtimes/pack-x64"},
            {"enabled":true,"runner":"macos-latest","artifact_os":"mac","target_os":"mac","platform":"darwin","arch":"arm64","runtime_dir":"runtimes/pack-arm64"}
          ]'
          build_matrix=$(printf '%s' "$build_rows" | jq -c --arg target "$RELEASE_TARGET" '[.[] | select($target == "all" or $target == .target_os or $target == (.target_os + "-" + .scenario))]')
          runtime_matrix=$(printf '%s' "$runtime_rows" | jq -c --arg target "$RELEASE_TARGET" '[.[] | select($target == "all" or $target == .target_os or $target == (.target_os + "-thin") or $target == (.target_os + "-full"))]')
          if [ "$(printf '%s' "$runtime_matrix" | jq 'length')" -eq 0 ]; then
            runtime_matrix='[{"enabled":false,"runner":"ubuntu-latest","artifact_os":"none","target_os":"none","platform":"linux","arch":"x64","runtime_dir":"runtimes/unused"}]'
          fi
          echo "build_matrix=$(jq -cn --argjson include "$build_matrix" '{include:$include}')" >> "$GITHUB_OUTPUT"
          echo "runtime_matrix=$(jq -cn --argjson include "$runtime_matrix" '{include:$include}')" >> "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Validate release metadata
        run: |
          pnpm check:versions
          pnpm check:release
      - run: pnpm test

  pack-upstream:
    needs: test
    if: needs.test.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_OPTIONS: '--max-old-space-size=4096'
    steps:
      - uses: actions/checkout@v7
      - name: Resolve pinned upstream source
        id: origin
        shell: bash
        run: |
          set -euo pipefail
          echo "tag=$(node -p "require('./packages/docs-sync/origin.json').gitTag")" >> "$GITHUB_OUTPUT"
          echo "commit=$(node -p "require('./packages/docs-sync/origin.json').gitCommit")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ steps.origin.outputs.tag }}
          path: upstream
          fetch-depth: 1
      - name: Verify immutable upstream commit
        shell: bash
        run: |
          set -euo pipefail
          actual=$(git -C upstream rev-parse HEAD)
          expected='${{ steps.origin.outputs.commit }}'
          test "$actual" = "$expected" || {
            echo "upstream source mismatch: expected $expected, got $actual" >&2
            exit 1
          }
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install upstream dependencies with pinned pnpm
        working-directory: upstream
        run: npx --yes pnpm@11.7.0 install --frozen-lockfile
      - name: Build official upstream profile
        working-directory: upstream
        run: npx --yes pnpm@11.7.0 build:official
      - name: Pack and verify official dsh runtime closure
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          npx --yes pnpm@11.7.0 exec tsx scripts/release/pack.ts --family vendor --out dist/vendor
          npx --yes pnpm@11.7.0 exec tsx scripts/release/pack.ts --family dsh --out dist/dsh
          npx --yes pnpm@11.7.0 exec tsx scripts/release/verify-packed-install.ts --family dsh --from dist/dsh --from dist/vendor
          test -n "$(find dist/dsh dist/vendor -type f -name '*.tgz' -print -quit)"
      - uses: actions/upload-artifact@v7
        with:
          name: upstream-dsh-packed
          path: |
            upstream/dist/dsh/*.tgz
            upstream/dist/vendor/*.tgz
          retention-days: 1
          if-no-files-found: error
          compression-level: 0

  prepare-runtime:
    needs: [test, plan, pack-upstream]
    if: needs.test.result == 'success' && needs.plan.result == 'success' && needs.pack-upstream.result == 'success'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.runtime_matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      NODE_OPTIONS: '--max-old-space-size=4096'
    steps:
      - name: Skip runtime preparation when not requested
        if: matrix.enabled != true
        run: echo "No runtime requested for this release target."
      - uses: actions/checkout@v7
        if: matrix.enabled == true
      - uses: pnpm/action-setup@v6
        if: matrix.enabled == true
        with:
          version: 10.12.1
      - uses: actions/setup-node@v7
        if: matrix.enabled == true
        with:
          node-version: 24
          cache: pnpm
      - name: Download official upstream packed closure
        if: matrix.enabled == true
        uses: actions/download-artifact@v8
        with:
          name: upstream-dsh-packed
          path: upstream-packed
      - name: Cache prepared runtime
        if: matrix.enabled == true
        uses: actions/cache@v6
        with:
          path: ${{ matrix.runtime_dir }}
          key: dsh-runtime-${{ matrix.artifact_os }}-${{ matrix.arch }}-${{ hashFiles('packages/docs-sync/origin.json', 'packages/client-runtime/src/prepare-cli.ts', 'packages/client-runtime/src/integrity.ts', 'packages/client-runtime/src/bundled.ts', 'packages/client-runtime/src/prune.ts', 'packages/client-runtime/package.json', 'pnpm-lock.yaml') }}
          restore-keys: |
            dsh-runtime-${{ matrix.artifact_os }}-${{ matrix.arch }}-
      - name: Install workspace dependencies
        if: matrix.enabled == true
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Prepare bundled runtime from official source packs
        if: matrix.enabled == true
        run: pnpm --filter @dsh/client-runtime bundle-runtime
        env:
          DSH_PACKED_RUNTIME_DIR: upstream-packed
          DSH_RUNTIME_PLATFORM: ${{ matrix.platform }}
          DSH_RUNTIME_ARCH: ${{ matrix.arch }}
          DSH_RUNTIME_DIR: ${{ matrix.runtime_dir }}
      - name: Create Thin runtime bundle
        if: matrix.enabled == true
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./packages/docs-sync/origin.json').dshVersion")
          mkdir -p runtime-bundle
          archive="runtime-bundle/HarnessDock-runtime-${version}-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz"
          tar -czf "$archive" -C "${{ matrix.runtime_dir }}" .
          test -s "$archive"
      - uses: actions/upload-artifact@v7
        if: matrix.enabled == true
        with:
          name: runtime-${{ matrix.artifact_os }}-${{ matrix.arch }}
          path: ${{ matrix.runtime_dir }}
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
          include-hidden-files: true
      - uses: actions/upload-artifact@v7
        if: matrix.enabled == true
        with:
          name: runtime-bundle-${{ matrix.artifact_os }}-${{ matrix.arch }}
          path: runtime-bundle/*.tar.gz
          retention-days: 1
          if-no-files-found: error
          compression-level: 0

  build:
    needs: [test, plan, prepare-runtime]
    if: always() && needs.test.result == 'success' && needs.plan.result == 'success' && needs.prepare-runtime.result == 'success'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.build_matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      NODE_OPTIONS: '--max-old-space-size=4096'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Cache electron-builder downloads (Unix)
        if: runner.os != 'Windows'
        uses: actions/cache@v6
        with:
          path: ~/.cache/electron-builder
          key: electron-builder-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Cache electron-builder downloads (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v6
        with:
          path: ~/AppData/Local/electron-builder/Cache
          key: electron-builder-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Download prepared runtime
        if: matrix.scenario == 'full'
        uses: actions/download-artifact@v8
        with:
          name: runtime-${{ matrix.artifact_os }}-${{ matrix.arch }}
          path: ${{ matrix.runtime_dir }}
      - name: Repair and verify downloaded runtime
        if: matrix.scenario == 'full'
        run: pnpm --filter @dsh/client-runtime bundle-runtime
        env:
          DSH_RUNTIME_PLATFORM: ${{ matrix.platform }}
          DSH_RUNTIME_ARCH: ${{ matrix.arch }}
          DSH_RUNTIME_DIR: ${{ matrix.runtime_dir }}
      - name: Build desktop package
        run: ${{ matrix.command }}
        env:
          GH_OWNER: ${{ github.repository_owner }}
          GH_REPO: ${{ github.event.repository.name }}
          DSH_SKIP_RUNTIME_PREPARE: ${{ matrix.scenario == 'full' && '1' || '0' }}
          DSH_RUNTIME_DIR: ${{ matrix.runtime_dir }}
      - name: Smoke test packaged runtime
        if: matrix.scenario == 'full'
        run: pnpm --filter @dsh/client-runtime smoke-runtime -- --runtime-dir ${{ matrix.packaged_runtime_dir }} --plugin ${{ matrix.packaged_plugin }}
      - name: Validate package size budget
        run: pnpm check:size
      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          release_dir="apps/desktop/release/${{ matrix.scenario }}"
          find "$release_dir" -maxdepth 1 -type f \
            \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' -o -name '*.AppImage' -o -name '*.deb' \) \
            -exec cp {} dist/ \;
          if [ "${{ matrix.scenario }}" = "full" ]; then
            find "$release_dir" -maxdepth 1 -type f \
              \( -name '*.blockmap' -o -name 'latest*.yml' \) \
              -exec cp {} dist/ \;
          fi
          ls -la dist/
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.artifact_os }}-${{ matrix.scenario }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: [build, prepare-runtime]
    if: needs.build.result == 'success' && needs.prepare-runtime.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifact-bundles
          pattern: desktop-*
          merge-multiple: false
      - uses: actions/download-artifact@v8
        with:
          path: runtime-bundles
          pattern: runtime-bundle-*
          merge-multiple: false
      - name: Assemble release assets and merge macOS update metadata
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts
          mkdir -p artifacts
          while IFS= read -r file; do
            name=$(basename "$file")
            [ "$name" = "latest-mac.yml" ] && continue
            if [ -e "artifacts/$name" ]; then
              echo "duplicate release asset filename: $name" >&2
              exit 1
            fi
            cp "$file" "artifacts/$name"
          done < <(find artifact-bundles runtime-bundles -type f -print | sort)

          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto'
          import { readFileSync, readdirSync, writeFileSync } from 'node:fs'
          import path from 'node:path'
          const dir = 'artifacts'
          const names = readdirSync(dir)
          const version = JSON.parse(readFileSync('package.json', 'utf8')).version
          const zips = names.filter((name) => /^HarnessDock-.*-mac-(x64|arm64)-full\.zip$/.test(name))
            .sort((a, b) => Number(a.includes('-x64-')) - Number(b.includes('-x64-')) || a.localeCompare(b))
          if (zips.length > 0) {
            const files = []
            for (const zip of zips) {
              const arch = zip.match(/-mac-(x64|arm64)-full\.zip$/)?.[1]
              if (!arch) throw new Error(`cannot resolve macOS architecture from ${zip}`)
              const dmg = names.find((name) => name.endsWith(`-mac-${arch}-full.dmg`))
              if (!dmg) throw new Error(`missing macOS ${arch} full DMG`)
              for (const name of [zip, dmg]) {
                const data = readFileSync(path.join(dir, name))
                files.push({ url: name, sha512: createHash('sha512').update(data).digest('base64'), size: data.length })
              }
            }
            let yml = `version: ${version}\nfiles:\n`
            for (const file of files) {
              yml += `  - url: ${file.url}\n    sha512: ${file.sha512}\n    size: ${file.size}\n`
            }
            yml += `releaseDate: '${new Date().toISOString()}'\n`
            writeFileSync(path.join(dir, 'latest-mac.yml'), yml, 'utf8')
          }
          NODE
          find artifacts -maxdepth 1 -type f -printf '%f\n' | sort
      - name: Validate runtime bundle assets
        shell: bash
        env:
          RELEASE_TARGET: ${{ inputs.target || 'all' }}
        run: |
          set -euo pipefail
          dsh_version=$(node -p "require('./packages/docs-sync/origin.json').dshVersion")
          case "$RELEASE_TARGET" in
            all) expected='win32-x64 linux-x64 darwin-x64 darwin-arm64' ;;
            win*) expected='win32-x64' ;;
            linux*) expected='linux-x64' ;;
            mac*) expected='darwin-x64 darwin-arm64' ;;
            *) expected='' ;;
          esac
          for target in $expected; do
            test -s "artifacts/HarnessDock-runtime-${dsh_version}-${target}.tar.gz"
          done
      - name: Validate combined macOS update metadata
        shell: bash
        run: |
          set -euo pipefail
          if compgen -G 'artifacts/HarnessDock-*-mac-*-full.zip' >/dev/null; then
            test -f artifacts/latest-mac.yml
            grep -q -- '-mac-arm64-full.zip' artifacts/latest-mac.yml
            grep -q -- '-mac-arm64-full.dmg' artifacts/latest-mac.yml
            grep -q -- '-mac-x64-full.zip' artifacts/latest-mac.yml
            grep -q -- '-mac-x64-full.dmg' artifacts/latest-mac.yml
          fi
      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "draft=false" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.release_tag }}" ]; then
            echo "tag=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
            echo "draft=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=unreleased-$(date +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"
            echo "draft=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate public release notes
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          template=".github/release-notes/v${VERSION}.md"
          if [ -f "$template" ]; then cp "$template" notes.md; else printf '# HarnessDock v%s\n' "$VERSION" > notes.md; fi
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: HarnessDock ${{ steps.tag.outputs.tag }}
          draft: ${{ steps.tag.outputs.draft }}
          files: artifacts/*
          body_path: notes.md
          generate_release_notes: false
          fail_on_unmatched_files: true
          overwrite_files: true
          make_latest: true

  cleanup:
    needs: publish
    if: needs.publish.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    steps:
      - name: Delete historical development branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100" --jq '.[].name' | while IFS= read -r branch; do
            [ "$branch" = "main" ] && continue
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/$branch" || true
          done
      - name: Delete historical Actions runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_run="${GITHUB_RUN_ID}"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" --jq '.workflow_runs[].id' | while IFS= read -r run_id; do
            [ "$run_id" = "$current_run" ] && continue
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/$run_id" || true
          done