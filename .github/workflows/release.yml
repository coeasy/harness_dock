name: release

on:
  workflow_run:
    workflows:
      - tauri-candidate
    types:
      - completed
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Exact beta tag to publish (for example v0.1.2-beta.2)'
        type: string
        required: true
      candidate_run_id:
        description: 'Successful tauri-candidate run id built from this exact main SHA'
        type: string
        required: true

concurrency:
  group: release-${{ github.event.workflow_run.id || inputs.release_tag || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.candidate_run_id }}
      RELEASE_TAG_INPUT: ${{ inputs.release_tag || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Validate exact green main candidate and CI before publishing
        id: release
        shell: bash
        run: |
          set -euo pipefail

          candidate_sha="$(git rev-parse HEAD)"
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')"
          if [ "$candidate_sha" != "$main_sha" ]; then
            if [ "$GITHUB_EVENT_NAME" = 'workflow_run' ]; then
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "::notice::Skipping stale automatic candidate: candidate=${candidate_sha} main=${main_sha}"
              exit 0
            fi
            echo "candidate is stale: candidate=$candidate_sha main=$main_sha" >&2
            exit 1
          fi

          version="$(node -p "require('./package.json').version")"
          prerelease="$(node -p "require('./release-manifest.json').prerelease || ''")"
          test -n "$prerelease" || {
            echo "release manifest prerelease is required for the beta workflow" >&2
            exit 1
          }
          expected_tag="v${version}-${prerelease}"
          release_tag="${RELEASE_TAG_INPUT:-$expected_tag}"
          test "$release_tag" = "$expected_tag" || {
            echo "release tag mismatch: expected $expected_tag, got $release_tag" >&2
            exit 1
          }
          test -s ".github/release-notes/${release_tag}.md"

          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}")"
          run_sha="$(printf '%s' "$run_json" | jq -r '.head_sha')"
          run_branch="$(printf '%s' "$run_json" | jq -r '.head_branch')"
          run_status="$(printf '%s' "$run_json" | jq -r '.status')"
          run_conclusion="$(printf '%s' "$run_json" | jq -r '.conclusion')"
          run_path="$(printf '%s' "$run_json" | jq -r '.path')"

          test "$run_sha" = "$candidate_sha" || {
            echo "candidate SHA mismatch: checkout=$candidate_sha candidate=$run_sha" >&2
            exit 1
          }
          test "$run_branch" = main || {
            echo "candidate was not built from main: $run_branch" >&2
            exit 1
          }
          test "$run_status" = completed && test "$run_conclusion" = success || {
            echo "candidate is not green: status=$run_status conclusion=$run_conclusion" >&2
            exit 1
          }
          test "$run_path" = '.github/workflows/tauri-candidate.yml' || {
            echo "unexpected candidate workflow path: $run_path" >&2
            exit 1
          }

          # Candidate is slower than the normal CI, but explicitly require a
          # successful same-SHA CI instead of relying on timing.
          ci_run_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?branch=main&per_page=100" \
            --jq ".workflow_runs[] | select(.head_sha == \"${candidate_sha}\" and .path == \".github/workflows/ci.yml\" and .status == \"completed\" and .conclusion == \"success\") | .id" \
            | head -1)"
          test -n "$ci_run_id" || {
            echo "no successful same-SHA main CI found for ${candidate_sha}" >&2
            exit 1
          }

          # windows-packaged-startup is triggered by the same successful
          # candidate and therefore races this workflow. Wait for that exact
          # same-SHA smoke instead of publishing in parallel with it. Skipped,
          # stale or cancelled duplicate smoke runs are not evidence that the
          # installed candidate failed; without a green run the gate still
          # remains closed until success or timeout.
          startup_run_id=""
          startup_deadline=$((SECONDS + 900))
          while [ "$SECONDS" -lt "$startup_deadline" ]; do
            startup_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?branch=main&per_page=100")"
            startup_run_id="$(printf '%s' "$startup_json" | jq -r --arg sha "$candidate_sha" '.workflow_runs[] | select(.head_sha == $sha and .path == ".github/workflows/windows-packaged-startup.yml" and .status == "completed" and .conclusion == "success") | .id' | head -1)"
            if [ -n "$startup_run_id" ]; then
              break
            fi
            startup_failure="$(printf '%s' "$startup_json" | jq -r --arg sha "$candidate_sha" '.workflow_runs[] | select(.head_sha == $sha and .path == ".github/workflows/windows-packaged-startup.yml" and .status == "completed" and (.conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "action_required" or .conclusion == "startup_failure")) | "\(.id):\(.conclusion)"' | head -1)"
            if [ -n "$startup_failure" ]; then
              echo "same-SHA windows packaged startup smoke failed: ${startup_failure}" >&2
              exit 1
            fi
            echo "Waiting for same-SHA windows packaged startup smoke for ${candidate_sha}..."
            sleep 15
          done
          test -n "$startup_run_id" || {
            echo "timed out waiting for successful same-SHA windows packaged startup smoke for ${candidate_sha}" >&2
            exit 1
          }

          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "sha=$candidate_sha" >> "$GITHUB_OUTPUT"
          echo "ci_run_id=$ci_run_id" >> "$GITHUB_OUTPUT"
          echo "startup_run_id=$startup_run_id" >> "$GITHUB_OUTPUT"

      - name: Download exact candidate artifacts
        if: steps.release.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release-input release-assets
          mkdir -p release-input release-assets
          gh run download "$CANDIDATE_RUN_ID" --repo "$GITHUB_REPOSITORY" --dir release-input

      - name: Assemble Tauri release assets
        if: steps.release.outputs.publish == 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail

          version="$(node -p "require('./package.json').version")"
          runtime_version="$(node -p "require('./packages/docs-sync/origin.json').dshVersion")"
          source_date_epoch="$(git show -s --format=%ct "$RELEASE_SHA")"

          copy_one() {
            local root="$1"
            local pattern="$2"
            local destination="$3"
            local -a sources=()
            mapfile -t sources < <(find "$root" -type f -name "$pattern" -print | sort)
            if [ "${#sources[@]}" -ne 1 ]; then
              echo "release asset must match exactly once: root=$root pattern=$pattern matches=${#sources[@]}" >&2
              printf '  %s\n' "${sources[@]:-<none>}" >&2
              exit 1
            fi
            cp "${sources[0]}" "$destination"
            test -s "$destination"
          }

          copy_one release-input/tauri-desktop-win-x64 '*setup.exe' "release-assets/HarnessDock-${version}-windows-x64-setup.exe"
          copy_one release-input/tauri-desktop-linux-x64 '*.deb' "release-assets/HarnessDock-${version}-linux-x64.deb"
          copy_one release-input/tauri-desktop-linux-x64 '*.AppImage' "release-assets/HarnessDock-${version}-linux-x64.AppImage"
          copy_one release-input/tauri-desktop-mac-x64 '*.dmg' "release-assets/HarnessDock-${version}-macos-x64.dmg"
          copy_one release-input/tauri-desktop-mac-x64 '*.app.tar.gz' "release-assets/HarnessDock-${version}-macos-x64.app.tar.gz"
          copy_one release-input/tauri-desktop-mac-arm64 '*.dmg' "release-assets/HarnessDock-${version}-macos-arm64.dmg"
          copy_one release-input/tauri-desktop-mac-arm64 '*.app.tar.gz' "release-assets/HarnessDock-${version}-macos-arm64.app.tar.gz"
          copy_one release-input/tauri-android-arm64-candidate '*.apk' "release-assets/HarnessDock-${version}-android-arm64-release.apk"
          copy_one release-input/tauri-android-arm64-candidate '*.aab' "release-assets/HarnessDock-${version}-android-arm64-release.aab"
          copy_one release-input/tauri-ios-simulator-candidate '*.zip' "release-assets/HarnessDock-${version}-ios-arm64-simulator.zip"

          pack_runtime() {
            local artifact="$1"
            local target="$2"
            local root="release-input/tauri-runtime-${artifact}"
            local manifest="$root/manifest.json"
            local output="release-assets/HarnessDock-runtime-${runtime_version}-${target}.tar.gz"
            test -s "$manifest" || {
              echo "missing runtime root manifest for $artifact: $manifest" >&2
              exit 1
            }
            if [ "$target" != 'win32-x64' ]; then
              chmod 755 "$root/bin/node"
            fi
            # Release assembly runs on Linux. Normalize archive ordering,
            # ownership and timestamps and suppress the gzip timestamp so an
            # exact candidate run can be verified byte-for-byte on retry.
            tar --sort=name \
              --mtime="@${source_date_epoch}" \
              --owner=0 --group=0 --numeric-owner \
              -C "$root" -cf - . \
              | gzip -n -9 > "$output"
            test -s "$output"
          }

          pack_runtime win-x64 win32-x64
          pack_runtime linux-x64 linux-x64
          pack_runtime mac-x64 darwin-x64
          pack_runtime mac-arm64 darwin-arm64

          sha256sum release-assets/* > release-assets/SHA256SUMS
          test -s release-assets/SHA256SUMS
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq 15
          ls -lh release-assets

      - name: Publish validated HarnessDock release
        if: steps.release.outputs.publish == 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail

          existing_release_id=""
          release_json=""
          if release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" 2>/dev/null)"; then
            existing_release_id="$(printf '%s' "$release_json" | jq -r '.id')"
          fi

          existing_tag_sha=""
          if tag_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" 2>/dev/null)"; then
            existing_tag_sha="$(printf '%s' "$tag_json" | jq -r '.object.sha')"
          fi

          # A published version is an immutable identity. Re-running the exact
          # same candidate is idempotent, but a same-version candidate from a
          # different commit must never move the tag: SHA256SUMS and audit
          # history bind the beta version to the original SHA.
          if [ -n "$existing_tag_sha" ] && [ "$existing_tag_sha" != "$RELEASE_SHA" ]; then
            echo "release tag ${RELEASE_TAG} already points to ${existing_tag_sha}; refusing to move it to ${RELEASE_SHA}" >&2
            exit 1
          fi

          if [ -z "$existing_tag_sha" ]; then
            echo "Creating validated ${RELEASE_TAG} at ${RELEASE_SHA}"
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${RELEASE_TAG}" -f sha="$RELEASE_SHA" >/dev/null
          else
            echo "Validated ${RELEASE_TAG} already points to ${RELEASE_SHA}; keeping tag immutable"
          fi

          if [ -n "$existing_release_id" ]; then
            # Never clobber an already published asset. Missing files can be
            # repaired from the exact candidate run, but an existing file
            # must be byte-identical. Prefer GitHub's SHA-256 digest when
            # available; older assets fall back to an authenticated download.
            compare_dir="$(mktemp -d)"
            trap 'rm -rf "$compare_dir"' EXIT
            for local_asset in release-assets/*; do
              asset_name="$(basename "$local_asset")"
              asset_id="$(printf '%s' "$release_json" | jq -r --arg name "$asset_name" '.assets[] | select(.name == $name) | .id' | head -1)"
              if [ -z "$asset_id" ]; then
                echo "Uploading missing immutable release asset: $asset_name"
                gh release upload "$RELEASE_TAG" "$local_asset"
                continue
              fi

              local_sha="$(sha256sum "$local_asset" | awk '{print $1}')"
              remote_digest="$(printf '%s' "$release_json" | jq -r --arg name "$asset_name" '.assets[] | select(.name == $name) | .digest // empty' | head -1)"
              if [ -n "$remote_digest" ]; then
                test "$remote_digest" = "sha256:${local_sha}" || {
                  echo "published asset differs from exact candidate: ${asset_name} remote=${remote_digest} local=sha256:${local_sha}" >&2
                  exit 1
                }
              else
                remote_asset="$compare_dir/$asset_name"
                gh api -H 'Accept: application/octet-stream' \
                  "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" > "$remote_asset"
                remote_sha="$(sha256sum "$remote_asset" | awk '{print $1}')"
                test "$remote_sha" = "$local_sha" || {
                  echo "published asset differs from exact candidate: ${asset_name} remote=sha256:${remote_sha} local=sha256:${local_sha}" >&2
                  exit 1
                }
              fi
              echo "Immutable release asset matches: $asset_name"
            done

            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${existing_release_id}" \
              -f target_commitish="$RELEASE_SHA" \
              -f name="HarnessDock ${RELEASE_TAG}" \
              -f body="$(cat ".github/release-notes/${RELEASE_TAG}.md")" \
              -F draft=false -F prerelease=true -f make_latest=false >/dev/null
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --target "$RELEASE_SHA" \
              --title "HarnessDock ${RELEASE_TAG}" \
              --notes-file ".github/release-notes/${RELEASE_TAG}.md" \
              --prerelease
          fi

      - name: Verify published tag and assets
        if: steps.release.outputs.publish == 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha')"
          test "$tag_sha" = "$RELEASE_SHA"
          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")"
          test "$(printf '%s' "$release_json" | jq -r '.draft')" = false
          test "$(printf '%s' "$release_json" | jq -r '.prerelease')" = true
          asset_count="$(printf '%s' "$release_json" | jq '[.assets[] | select(.size > 0)] | length')"
          test "$asset_count" -eq 15 || {
            echo "expected 15 non-empty unsigned beta assets, got $asset_count" >&2
            exit 1
          }
          printf '%s' "$release_json" | jq -e '.assets[] | select(.name == "SHA256SUMS" and .size > 0)' >/dev/null
