name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to publish under (e.g. v0.1.0). Empty = draft release named "unreleased".'
        type: string
        required: false
      target:
        description: 'Build target: all, one OS, or one OS/scenario pair'
        type: choice
        required: false
        default: all
        options:
          - all
          - win
          - mac
          - linux
          - win-thin
          - win-full
          - mac-thin
          - mac-full
          - linux-thin
          - linux-full

concurrency:
  group: release-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      build_matrix: ${{ steps.matrix.outputs.build_matrix }}
      runtime_matrix: ${{ steps.matrix.outputs.runtime_matrix }}
    steps:
      - name: Select release targets
        id: matrix
        shell: bash
        env:
          RELEASE_TARGET: ${{ inputs.target || 'all' }}
        run: |
          set -euo pipefail
          build_rows='[
            {"runner":"windows-latest","artifact_os":"win","target_os":"win","platform":"win32","scenario":"thin","arch":"x64","runtime_dir":"","packaged_runtime_dir":"","packaged_plugin":"","command":"node apps/desktop/scripts/pack.mjs --os win --scenario thin"},
            {"runner":"windows-latest","artifact_os":"win","target_os":"win","platform":"win32","scenario":"full","arch":"x64","runtime_dir":"runtimes/pack","packaged_runtime_dir":"apps/desktop/release/full/win-unpacked/resources/dsh-runtime","packaged_plugin":"apps/desktop/release/full/win-unpacked/resources/plugin-embedded-client/index.js","command":"node apps/desktop/scripts/pack.mjs --os win --scenario full"},
            {"runner":"ubuntu-latest","artifact_os":"linux","target_os":"linux","platform":"linux","scenario":"thin","arch":"x64","runtime_dir":"","packaged_runtime_dir":"","packaged_plugin":"","command":"node apps/desktop/scripts/pack.mjs --os linux --scenario thin"},
            {"runner":"ubuntu-latest","artifact_os":"linux","target_os":"linux","platform":"linux","scenario":"full","arch":"x64","runtime_dir":"runtimes/pack","packaged_runtime_dir":"apps/desktop/release/full/linux-unpacked/resources/dsh-runtime","packaged_plugin":"apps/desktop/release/full/linux-unpacked/resources/plugin-embedded-client/index.js","command":"node apps/desktop/scripts/pack.mjs --os linux --scenario full"},
            {"runner":"macos-latest","artifact_os":"mac","target_os":"mac","platform":"darwin","scenario":"thin","arch":"all","runtime_dir":"","packaged_runtime_dir":"","packaged_plugin":"","command":"node apps/desktop/scripts/pack.mjs --os mac --scenario thin"},
            {"runner":"macos-latest","artifact_os":"mac","target_os":"mac","platform":"darwin","scenario":"full","arch":"x64","runtime_dir":"runtimes/pack-x64","packaged_runtime_dir":"apps/desktop/release/full/mac/HarnessDock.app/Contents/Resources/dsh-runtime","packaged_plugin":"apps/desktop/release/full/mac/HarnessDock.app/Contents/Resources/plugin-embedded-client/index.js","command":"node apps/desktop/scripts/pack.mjs --os mac --scenario full --arch x64"},
            {"runner":"macos-latest","artifact_os":"mac","target_os":"mac","platform":"darwin","scenario":"full","arch":"arm64","runtime_dir":"runtimes/pack-arm64","packaged_runtime_dir":"apps/desktop/release/full/mac-arm64/HarnessDock.app/Contents/Resources/dsh-runtime","packaged_plugin":"apps/desktop/release/full/mac-arm64/HarnessDock.app/Contents/Resources/plugin-embedded-client/index.js","command":"node apps/desktop/scripts/pack.mjs --os mac --scenario full --arch arm64"}
          ]'
          runtime_rows='[
            {"enabled":true,"runner":"ubuntu-latest","artifact_os":"win","target_os":"win","platform":"win32","arch":"x64","runtime_dir":"runtimes/pack"},
            {"enabled":true,"runner":"ubuntu-latest","artifact_os":"linux","target_os":"linux","platform":"linux","arch":"x64","runtime_dir":"runtimes/pack"},
            {"enabled":true,"runner":"macos-latest","artifact_os":"mac","target_os":"mac","platform":"darwin","arch":"x64","runtime_dir":"runtimes/pack-x64"},
            {"enabled":true,"runner":"macos-latest","artifact_os":"mac","target_os":"mac","platform":"darwin","arch":"arm64","runtime_dir":"runtimes/pack-arm64"}
          ]'
          build_matrix=$(printf '%s' "$build_rows" | jq -c --arg target "$RELEASE_TARGET" '[.[] | select($target == "all" or $target == .target_os or $target == (.target_os + "-" + .scenario))]')
          runtime_matrix=$(printf '%s' "$runtime_rows" | jq -c --arg target "$RELEASE_TARGET" '[.[] | select($target == "all" or $target == .target_os or $target == (.target_os + "-full"))]')
          if [ "$(printf '%s' "$runtime_matrix" | jq 'length')" -eq 0 ]; then
            runtime_matrix='[{"enabled":false,"runner":"ubuntu-latest","artifact_os":"none","target_os":"none","platform":"linux","arch":"x64","runtime_dir":"runtimes/unused"}]'
          fi
          echo "build_matrix=$(jq -cn --argjson include "$build_matrix" '{include:$include}')" >> "$GITHUB_OUTPUT"
          echo "runtime_matrix=$(jq -cn --argjson include "$runtime_matrix" '{include:$include}')" >> "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Validate release metadata
        shell: bash
        run: |
          pnpm check:versions
          pnpm check:release
      - run: pnpm test

  prepare-runtime:
    needs: [test, plan]
    if: needs.test.result == 'success' && needs.plan.result == 'success'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.runtime_matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      NODE_OPTIONS: '--max-old-space-size=4096'
    steps:
      - name: Skip runtime preparation for thin-only release
        if: matrix.enabled != true
        run: echo "No full runtime requested for this release target."
      - uses: actions/checkout@v7
        if: matrix.enabled == true
      - uses: pnpm/action-setup@v6
        if: matrix.enabled == true
        with:
          version: 10.12.1
      - uses: actions/setup-node@v7
        if: matrix.enabled == true
        with:
          node-version: 24
          cache: pnpm
      - name: Cache prepared runtime
        if: matrix.enabled == true
        uses: actions/cache@v6
        with:
          path: ${{ matrix.runtime_dir }}
          key: dsh-runtime-${{ matrix.artifact_os }}-${{ matrix.arch }}-${{ hashFiles('packages/docs-sync/origin.json', 'packages/client-runtime/src/prepare-cli.ts', 'packages/client-runtime/src/integrity.ts', 'packages/client-runtime/src/bundled.ts', 'packages/client-runtime/src/prune.ts', 'packages/client-runtime/package.json', 'pnpm-lock.yaml') }}
          restore-keys: |
            dsh-runtime-${{ matrix.artifact_os }}-${{ matrix.arch }}-
      - name: Install workspace dependencies
        if: matrix.enabled == true
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Prepare bundled runtime
        if: matrix.enabled == true
        run: pnpm --filter @dsh/client-runtime bundle-runtime
        env:
          DSH_RUNTIME_PLATFORM: ${{ matrix.platform }}
          DSH_RUNTIME_ARCH: ${{ matrix.arch }}
          DSH_RUNTIME_DIR: ${{ matrix.runtime_dir }}
      - name: Upload prepared runtime
        if: matrix.enabled == true
        uses: actions/upload-artifact@v7
        with:
          name: runtime-${{ matrix.artifact_os }}-${{ matrix.arch }}
          path: ${{ matrix.runtime_dir }}
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
          include-hidden-files: true

  build:
    needs: [test, plan, prepare-runtime]
    if: always() && needs.test.result == 'success' && needs.plan.result == 'success' && needs.prepare-runtime.result == 'success'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.build_matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      NODE_OPTIONS: '--max-old-space-size=4096'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Cache electron-builder downloads (Unix)
        if: runner.os != 'Windows'
        uses: actions/cache@v6
        with:
          path: ~/.cache/electron-builder
          key: electron-builder-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Cache electron-builder downloads (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v6
        with:
          path: ~/AppData/Local/electron-builder/Cache
          key: electron-builder-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Download prepared runtime
        if: matrix.scenario == 'full'
        uses: actions/download-artifact@v8
        with:
          name: runtime-${{ matrix.artifact_os }}-${{ matrix.arch }}
          path: ${{ matrix.runtime_dir }}
      - name: Repair and verify downloaded runtime
        if: matrix.scenario == 'full'
        run: pnpm --filter @dsh/client-runtime bundle-runtime
        env:
          DSH_RUNTIME_PLATFORM: ${{ matrix.platform }}
          DSH_RUNTIME_ARCH: ${{ matrix.arch }}
          DSH_RUNTIME_DIR: ${{ matrix.runtime_dir }}
      - name: Build desktop package
        run: ${{ matrix.command }}
        env:
          GH_OWNER: ${{ github.repository_owner }}
          GH_REPO: ${{ github.event.repository.name }}
          DSH_SKIP_RUNTIME_PREPARE: ${{ matrix.scenario == 'full' && '1' || '0' }}
          DSH_RUNTIME_DIR: ${{ matrix.runtime_dir }}
      - name: Smoke test packaged runtime
        if: matrix.scenario == 'full'
        run: pnpm --filter @dsh/client-runtime smoke-runtime -- --runtime-dir ${{ matrix.packaged_runtime_dir }} --plugin ${{ matrix.packaged_plugin }}
      - name: Validate package size budget
        run: pnpm check:size
      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          release_dir="apps/desktop/release/${{ matrix.scenario }}"
          find "$release_dir" -maxdepth 1 -type f \
            \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' \
               -o -name '*.AppImage' -o -name '*.deb' \) \
            -exec cp {} dist/ \;
          if [ "${{ matrix.scenario }}" = "full" ]; then
            find "$release_dir" -maxdepth 1 -type f \
              \( -name '*.blockmap' -o -name 'latest*.yml' \) \
              -exec cp {} dist/ \;
          fi
          ls -la dist/
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.artifact_os }}-${{ matrix.scenario }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifact-bundles
          pattern: desktop-*
          merge-multiple: false
      - name: Assemble release assets and merge macOS update metadata
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts
          mkdir -p artifacts

          while IFS= read -r file; do
            name=$(basename "$file")
            if [ "$name" = "latest-mac.yml" ]; then
              continue
            fi
            if [ -e "artifacts/$name" ]; then
              echo "duplicate release asset filename: $name" >&2
              exit 1
            fi
            cp "$file" "artifacts/$name"
          done < <(find artifact-bundles -type f -print | sort)

          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto'
          import { readFileSync, readdirSync, writeFileSync } from 'node:fs'
          import path from 'node:path'

          const dir = 'artifacts'
          const names = readdirSync(dir)
          const version = JSON.parse(readFileSync('package.json', 'utf8')).version
          const zipRe = /^HarnessDock-.*-mac-(x64|arm64)-full\.zip$/
          const zips = names
            .filter((name) => zipRe.test(name))
            .sort((a, b) => {
              const aa = a.includes('-arm64-') ? 0 : 1
              const bb = b.includes('-arm64-') ? 0 : 1
              return aa - bb || a.localeCompare(b)
            })

          if (zips.length > 0) {
            const files = []
            for (const zip of zips) {
              const match = zip.match(/-mac-(x64|arm64)-full\.zip$/)
              if (!match) throw new Error(`cannot resolve macOS architecture from ${zip}`)
              const arch = match[1]
              const dmg = names.find((name) => name.endsWith(`-mac-${arch}-full.dmg`))
              if (!dmg) throw new Error(`missing macOS ${arch} full DMG for combined update metadata`)

              for (const name of [zip, dmg]) {
                const data = readFileSync(path.join(dir, name))
                files.push({
                  url: name,
                  sha512: createHash('sha512').update(data).digest('base64'),
                  size: data.length,
                })
              }
            }

            let yml = `version: ${version}\nfiles:\n`
            for (const file of files) {
              yml += `  - url: ${file.url}\n`
              yml += `    sha512: ${file.sha512}\n`
              yml += `    size: ${file.size}\n`
            }
            yml += `releaseDate: '${new Date().toISOString()}'\n`
            writeFileSync(path.join(dir, 'latest-mac.yml'), yml, 'utf8')
          }
          NODE

          echo "Final release assets:"
          find artifacts -maxdepth 1 -type f -printf '%f\n' | sort
          test -n "$(find artifacts -maxdepth 1 -type f -print -quit)"
      - name: Validate combined macOS update metadata
        shell: bash
        run: |
          set -euo pipefail
          if compgen -G 'artifacts/HarnessDock-*-mac-*-full.zip' >/dev/null; then
            test -f artifacts/latest-mac.yml
            grep -q -- '-mac-arm64-full.zip' artifacts/latest-mac.yml
            grep -q -- '-mac-arm64-full.dmg' artifacts/latest-mac.yml
            grep -q -- '-mac-x64-full.zip' artifacts/latest-mac.yml
            grep -q -- '-mac-x64-full.dmg' artifacts/latest-mac.yml
            echo 'Combined latest-mac.yml contains x64 and arm64 full assets.'
          fi
      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "draft=false" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.release_tag }}" ]; then
            echo "tag=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
            echo "draft=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=unreleased-$(date +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"
            echo "draft=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate public release notes
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cat > notes.md <<EOF
          # HarnessDock v${VERSION} — 首个公开版本

          HarnessDock v${VERSION} 是 HarnessDock 的首个公开发行版本。它将 DeepSeek Harness / dsh Web 能力封装为 Windows、macOS 和 Linux 桌面客户端，并同时提供 Full 与 Thin 两类发行包，方便普通用户、开发者以及已经维护独立 dsh runtime 的高级用户按需选择。

          ## 最简单的选择方式

          - **第一次安装、希望下载后直接使用：选择 Full。** Full 内置经过完整性校验的 dsh runtime 和 embedded client plugin。
          - **已经自行维护 dsh/runtime、希望下载更小：选择 Thin。** Thin 不内置完整 dsh runtime，需要你自己的运行环境满足 HarnessDock 的要求。
          - **Windows 普通用户：优先下载 Full Setup EXE。**
          - **Windows 便携/临时使用：下载 Full Portable EXE。**
          - **Apple Silicon Mac（M1/M2/M3/M4 及后续 ARM Mac）：下载 mac-arm64-full DMG。**
          - **Intel Mac：下载 mac-x64-full DMG。**
          - **Ubuntu / Debian x86_64：优先下载 linux-amd64-full DEB。**
          - **Fedora / Arch / openSUSE 等常见 x86_64 Linux：优先下载 linux-x86_64-full AppImage。**

          ## Full 与 Thin 的区别

          | 版本 | 内置 dsh runtime | 体积 | 推荐对象 | 典型场景 |
          |---|---|---:|---|---|
          | **Full** | 是 | 较大 | 普通用户、首次安装、希望开箱即用 | 下载后直接运行；由 HarnessDock 管理随包 runtime |
          | **Thin** | 否 | 较小 | 开发者、运维、高级用户 | 已有 dsh/runtime；希望自行控制 runtime 版本和生命周期 |

          Full 包不是简单地“把 runtime 文件复制进去”。正式 Release 会在 runtime artifact 传输后再次执行 repair + integrity validation，校验平台原生依赖、隐藏兼容资源和 embedded plugin，并从**最终 Electron 打包目录**直接启动包内 dsh Web 进行 smoke test。

          ## Windows 安装包使用场景

          ### `HarnessDock-Setup-${VERSION}-win-x64-full.exe`
          **绝大多数 Windows 用户的首选。** 标准 NSIS 安装程序，会建立正常的系统安装记录，适合长期使用、开始菜单/卸载管理和后续升级。

          ### `HarnessDock-Portable-${VERSION}-win-x64-full.exe`
          **便携版本。** 不需要传统安装，适合临时测试、U 盘携带、受限办公环境，或不希望在系统中留下标准安装记录的场景。Full Portable 同样包含 bundled dsh runtime。

          ### `HarnessDock-${VERSION}-win-x64-full.zip`
          **完整压缩包。** 适合企业内部软件分发、自动化解压部署、问题排查，或需要直接检查完整文件结构的用户。

          ### Windows Thin 版本
          Thin Setup / Portable / ZIP 的使用方式与上面一致，但不携带完整 dsh runtime。只有在你明确知道如何提供和维护运行环境时才建议选择 Thin。

          ## macOS 安装包使用场景

          ### `HarnessDock-${VERSION}-mac-arm64-full.dmg`
          **Apple Silicon 推荐版本。** 适用于 M1/M2/M3/M4 及后续 ARM64 Mac。打开 DMG 后将 HarnessDock 拖入 Applications 即可。

          ### `HarnessDock-${VERSION}-mac-x64-full.dmg`
          **Intel Mac 推荐版本。** Intel 处理器 Mac 请选择 x64，不要下载 arm64 包。

          ### macOS ZIP
          对应架构 ZIP 与 DMG 提供相同应用内容，更适合自动化分发、CI/CD、远程部署或不便挂载 DMG 的环境。

          ### macOS Thin
          Thin 同时提供 x64 和 arm64，适合已经自行维护 dsh runtime 的开发环境。请选择与 Mac CPU 架构一致的文件。

          **当前公开构建尚未配置 Apple Developer ID 签名与 Notarization。** 首次启动时 macOS Gatekeeper 可能要求在“系统设置 → 隐私与安全性”中确认打开。这不影响本次包内 runtime 的构建和 smoke 验证结论。

          ## Linux 安装包使用场景

          ### `HarnessDock-${VERSION}-linux-amd64-full.deb`
          **Ubuntu / Debian 用户推荐。** 使用系统 DEB 包管理器安装，适合希望通过系统软件包方式统一安装、升级和卸载的用户。

          ### `HarnessDock-${VERSION}-linux-x86_64-full.AppImage`
          **通用 x86_64 Linux 便携版本。** 适合 Fedora、Arch、openSUSE 等发行版，或不希望安装系统软件包的环境。赋予执行权限后即可直接运行。

          ### Linux Thin
          Thin DEB / AppImage 适合已有 dsh runtime、希望减少下载体积或由开发/运维体系自行控制 runtime 生命周期的环境。

          ## 自动更新相关文件

          Release Assets 中的 `latest.yml`、`latest-mac.yml`、`latest-linux.yml` 和 `*.blockmap` 是 HarnessDock 自动更新/差分更新使用的元数据，**不是用户需要手动安装的文件**。

          macOS 的 `latest-mac.yml` 在发布汇总阶段统一生成，同时包含 **arm64 与 x64** Full 包的 ZIP/DMG 校验信息，避免多架构构建时同名更新元数据互相覆盖。

          ## v${VERSION} 发布验证

          - **Windows x64**：测试、Thin 打包、Full Setup / Portable / ZIP、最终包内 dsh runtime 启动与 Web 健康检查、逐文件体积门禁。
          - **Linux x64**：测试、Thin AppImage / DEB、Full AppImage / DEB、最终包内 dsh runtime 启动与 Web 健康检查、逐文件体积门禁。
          - **macOS arm64**：测试、Thin/Full DMG + ZIP、ARM64 最终 `.app` 包内 dsh runtime 原生启动与 Web 健康检查、逐文件体积门禁。
          - **macOS x64**：Full DMG + ZIP、runtime 完整性、embedded plugin、产物清单与体积门禁；由独立 x64 runtime 构建矩阵生成。
          - **runtime artifact**：上传包含 hidden files，下载后再次 repair + integrity validation；Unix 最终包恢复 bundled Node executable bit。
          - **发布汇总**：重复 Asset 名称直接失败；macOS x64/arm64 更新清单显式合并后再发布。

          ## 安装建议

          如果你不确定应该下载哪个文件，直接选择与你的操作系统和 CPU 架构匹配的 **Full** 安装包。Thin 版本主要面向明确知道如何配置和维护 dsh runtime 的开发者和高级用户。
          EOF
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: HarnessDock ${{ steps.tag.outputs.tag }}
          draft: ${{ steps.tag.outputs.draft }}
          files: artifacts/*
          body_path: notes.md
          generate_release_notes: false
          fail_on_unmatched_files: true
          overwrite_files: true
          make_latest: true

  cleanup:
    needs: publish
    if: needs.publish.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    steps:
      - name: Delete historical development branches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100" --jq '.[].name' | while IFS= read -r branch; do
            [ "$branch" = "main" ] && continue
            echo "Deleting branch: $branch"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/$branch" || true
          done
      - name: Delete historical Actions runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_run="${GITHUB_RUN_ID}"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" --jq '.workflow_runs[].id' | while IFS= read -r run_id; do
            [ "$run_id" = "$current_run" ] && continue
            echo "Deleting Actions run: $run_id"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/$run_id" || true
          done
