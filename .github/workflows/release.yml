name: release

on:
  workflow_run:
    workflows:
      - tauri-candidate
    types:
      - completed
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Exact release tag to publish (for example v0.2.1)'
        type: string
        required: true
      candidate_run_id:
        description: 'Successful tauri-candidate run id built from this exact main SHA'
        type: string
        required: true

concurrency:
  group: release-${{ github.event.workflow_run.id || inputs.release_tag || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.candidate_run_id }}
      RELEASE_TAG_INPUT: ${{ inputs.release_tag || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Validate exact green main candidate before creating tag
        id: release
        shell: bash
        run: |
          set -euo pipefail

          candidate_sha="$(git rev-parse HEAD)"
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')"
          test "$candidate_sha" = "$main_sha" || {
            echo "candidate is stale: candidate=$candidate_sha main=$main_sha" >&2
            exit 1
          }

          version="$(node -p "require('./package.json').version")"
          expected_tag="v${version}"
          release_tag="${RELEASE_TAG_INPUT:-$expected_tag}"
          test "$release_tag" = "$expected_tag" || {
            echo "release tag mismatch: expected $expected_tag, got $release_tag" >&2
            exit 1
          }
          test -s ".github/release-notes/${release_tag}.md"

          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}")"
          run_sha="$(printf '%s' "$run_json" | jq -r '.head_sha')"
          run_branch="$(printf '%s' "$run_json" | jq -r '.head_branch')"
          run_status="$(printf '%s' "$run_json" | jq -r '.status')"
          run_conclusion="$(printf '%s' "$run_json" | jq -r '.conclusion')"
          run_path="$(printf '%s' "$run_json" | jq -r '.path')"

          test "$run_sha" = "$candidate_sha" || {
            echo "candidate SHA mismatch: checkout=$candidate_sha candidate=$run_sha" >&2
            exit 1
          }
          test "$run_branch" = main || {
            echo "candidate was not built from main: $run_branch" >&2
            exit 1
          }
          test "$run_status" = completed && test "$run_conclusion" = success || {
            echo "candidate is not green: status=$run_status conclusion=$run_conclusion" >&2
            exit 1
          }
          test "$run_path" = '.github/workflows/tauri-candidate.yml' || {
            echo "unexpected candidate workflow path: $run_path" >&2
            exit 1
          }

          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${release_tag}" >/dev/null 2>&1; then
            echo "release tag already exists; refusing to overwrite ${release_tag}" >&2
            exit 1
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${release_tag}" >/dev/null 2>&1; then
            echo "release already exists; refusing to overwrite ${release_tag}" >&2
            exit 1
          fi

          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "sha=$candidate_sha" >> "$GITHUB_OUTPUT"

      - name: Download exact candidate artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release-input release-assets
          mkdir -p release-input release-assets
          gh run download "$CANDIDATE_RUN_ID" --repo "$GITHUB_REPOSITORY" --dir release-input

      - name: Assemble Tauri release assets
        shell: bash
        run: |
          set -euo pipefail

          version="$(node -p "require('./package.json').version")"
          runtime_version="$(node -p "require('./packages/docs-sync/origin.json').dshVersion")"

          copy_one() {
            local root="$1"
            local pattern="$2"
            local destination="$3"
            local source
            source="$(find "$root" -type f -name "$pattern" -print | sort | head -1)"
            test -n "$source" || {
              echo "missing release asset: root=$root pattern=$pattern" >&2
              exit 1
            }
            cp "$source" "$destination"
            test -s "$destination"
          }

          copy_one release-input/tauri-desktop-win-x64 '*.exe' "release-assets/HarnessDock-${version}-windows-x64-setup.exe"
          copy_one release-input/tauri-desktop-linux-x64 '*.deb' "release-assets/HarnessDock-${version}-linux-x64.deb"
          copy_one release-input/tauri-desktop-linux-x64 '*.AppImage' "release-assets/HarnessDock-${version}-linux-x64.AppImage"
          copy_one release-input/tauri-desktop-mac-x64 '*.dmg' "release-assets/HarnessDock-${version}-macos-x64.dmg"
          copy_one release-input/tauri-desktop-mac-arm64 '*.dmg' "release-assets/HarnessDock-${version}-macos-arm64.dmg"
          copy_one release-input/tauri-android-arm64-candidate '*.apk' "release-assets/HarnessDock-${version}-android-arm64-debug.apk"
          copy_one release-input/tauri-android-arm64-candidate '*.aab' "release-assets/HarnessDock-${version}-android-arm64-debug.aab"
          copy_one release-input/tauri-ios-simulator-candidate '*.zip' "release-assets/HarnessDock-${version}-ios-arm64-simulator.zip"

          pack_runtime() {
            local artifact="$1"
            local target="$2"
            local manifest
            local root
            manifest="$(find "release-input/tauri-runtime-${artifact}" -type f -name manifest.json -print -quit)"
            test -n "$manifest" || {
              echo "missing runtime manifest for $artifact" >&2
              exit 1
            }
            root="$(dirname "$manifest")"
            if [ "$target" != 'win32-x64' ]; then
              chmod 755 "$root/bin/node"
            fi
            tar -C "$root" -czf "release-assets/HarnessDock-runtime-${runtime_version}-${target}.tar.gz" .
            test -s "release-assets/HarnessDock-runtime-${runtime_version}-${target}.tar.gz"
          }

          pack_runtime win-x64 win32-x64
          pack_runtime linux-x64 linux-x64
          pack_runtime mac-x64 darwin-x64
          pack_runtime mac-arm64 darwin-arm64

          sha256sum release-assets/* > release-assets/SHA256SUMS
          test -s release-assets/SHA256SUMS
          ls -lh release-assets

      - name: Publish HarnessDock Tauri release and create tag
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ steps.release.outputs.sha }}
          name: HarnessDock ${{ steps.release.outputs.tag }}
          body_path: .github/release-notes/${{ steps.release.outputs.tag }}.md
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          files: release-assets/*
