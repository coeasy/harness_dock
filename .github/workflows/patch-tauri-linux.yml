name: patch-tauri-linux

on:
  push:
    branches:
      - integrate/tauri-v0.2.0
    paths:
      - '.github/workflows/patch-tauri-linux.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: integrate/tauri-v0.2.0
      - name: Align Linux Tauri dependencies with official AppImage CI baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/tauri-candidate.yml')
          text = path.read_text()
          old_deps = 'sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev'
          new_deps = 'sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2'
          old_build = 'run: cargo tauri build --bundles ${{ matrix.bundles }}'
          new_build = 'run: cargo tauri build --verbose --bundles ${{ matrix.bundles }}'

          if text.count(old_deps) != 2:
              raise SystemExit(f'expected two Linux dependency lines, found {text.count(old_deps)}')
          if text.count(old_build) != 1:
              raise SystemExit(f'expected one desktop build line, found {text.count(old_build)}')

          text = text.replace(old_deps, new_deps)
          text = text.replace(old_build, new_build)
          path.write_text(text)
          PY
          git diff --check
          git diff -- .github/workflows/tauri-candidate.yml
      - name: Commit candidate repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/tauri-candidate.yml
          git commit -m 'ci: fix Linux AppImage build dependencies'
          git push origin HEAD:integrate/tauri-v0.2.0
