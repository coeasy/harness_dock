# Shared electron-builder configuration for the thin and full scenarios.
# Scenario configs (electron-builder.yml / electron-builder.full.yml) extend
# this file via `extends` and only override what actually differs:
# artifact names, output directory, and the full scenario's bundled runtime.
appId: com.dsh.client
productName: HarnessDock
executableName: HarnessDock
icon: build/icon.ico
copyright: MIT
compression: maximum
# Auto-update feed (electron-updater Phase A) is intentionally NOT declared here:
# electron-builder throws on an undefined ${env.*} macro, so a build without a
# configured upstream would fail. Instead apps/desktop/scripts/pack.mjs injects
# `-c.publish.*` from the GH_OWNER / GH_REPO env vars when they are set, baking
# resources/app-update.yml into the package. Without them there is no feed and
# auto-update stays inert (guarded by hasUpdateFeed() at runtime).
files:
  - dist/main.js
  - dist/preload.cjs
  - dist/splash-preload.cjs
  - dist/diagnostics-preload.cjs
  - package.json
asar: true
# No asarUnpack: the app has no native modules — electron is external and the
# bundled deps (electron-updater + workspace packages) are pure JS, so nothing
# matches "**/*.node" and unpacking would only add asar complexity.
electronLanguages:
  - en-US
  - zh-CN
extraResources:
  - from: ../../apps/desktop/build/icon-256.png
    to: icon-256.png
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
    - target: zip
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  icon: build/icon-512.png
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
linux:
  icon: build/icons/
  category: Development
  maintainer: harnessdock
  syncDesktopName: true
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
