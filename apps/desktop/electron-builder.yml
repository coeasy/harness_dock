# Thin package: bundles the exact dsh module tree and reuses Electron's Node.
# It stays smaller than Full because it does not carry a second Node runtime,
# while remaining independent of whether the pinned upstream alpha is on npm.
extends: ./electron-builder.common.yml
artifactName: ${productName}-${version}-${os}-${arch}-thin.${ext}
directories:
  output: release/thin
extraResources:
  - from: ../../packages/docs-sync/origin.json
    to: origin.json
# node_modules is copied by the shared hook after electron-builder creates the
# unpacked app; extraResources cannot reliably retain nested node_modules.
afterPack: ./scripts/copy-runtime.cjs
nsis:
  artifactName: ${productName}-Setup-${version}-${os}-${arch}-thin.${ext}
portable:
  artifactName: ${productName}-Portable-${version}-${os}-${arch}-thin.${ext}
