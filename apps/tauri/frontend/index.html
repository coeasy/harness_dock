<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>HarnessDock Next</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b1120; color: #dbe7f5; }
      main { width: min(620px, calc(100vw - 48px)); padding: 28px; border: 1px solid #26354c; border-radius: 16px; background: #111a2a; }
      h1 { margin: 0 0 10px; font-size: 24px; }
      p { margin: 8px 0; line-height: 1.55; color: #99aac2; }
      #status { color: #71e5d2; font-weight: 650; }
      code { color: #c5d4e8; }
    </style>
  </head>
  <body>
    <main>
      <h1>HarnessDock Next</h1>
      <p id="status">Starting the shared Harness runtime…</p>
      <p>Tauri Next-Gen uses the same pinned <code>dsh</code>, official Harness Web UI, plugin bundle and runtime rollback contract as Electron LTS.</p>
      <p>Electron remains the compatibility fallback while v0.2.0 parity validation is in progress.</p>
    </main>
    <script>
      window.__HARNESSDOCK_SET_STATUS = function (message) {
        document.getElementById('status').textContent = String(message)
      }
    </script>
  </body>
</html>
