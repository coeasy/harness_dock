<!doctype html>
<html lang="zh-CN" data-state="loading">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" />
  <title>HarnessDock</title>
  <link rel="stylesheet" href="./splash.css" />
  <script src="./splash.js" defer></script>
</head>
<body>
  <main class="splash" aria-live="polite" aria-busy="true">
    <div class="ambient ambient-a" aria-hidden="true"></div>
    <div class="ambient ambient-b" aria-hidden="true"></div>
    <div class="mark-wrap" aria-hidden="true">
      <div class="orbit orbit-a"></div>
      <div class="orbit orbit-b"></div>
      <div class="mark"><span></span></div>
    </div>
    <div class="identity">
      <h1>HarnessDock</h1>
      <div class="sub">DeepSeek Harness · CLIENT</div>
    </div>
    <div class="stage" aria-hidden="true"><span></span><span></span><span></span></div>
    <div id="splash-status" class="status">正在启动 Harness Runtime…</div>
    <div class="progress" aria-hidden="true"><span></span></div>
    <div class="hint">保持窗口打开，Harness Web 就绪后会自动进入</div>
  </main>
</body>
</html>
