[[permission]]
identifier = "platform-info"
description = "Allows the bundled launcher to inspect its HarnessDock platform profile."
commands.allow = ["platform_info"]

[[permission]]
identifier = "gateway-health"
description = "Allows the bundled launcher to probe a user-supplied HarnessDock Gateway origin."
commands.allow = ["gateway_health"]

[[permission]]
identifier = "gateway-pair"
description = "Allows the bundled launcher to exchange an explicit one-time pairing code for a Gateway connection URL."
commands.allow = ["pair_gateway"]

[[permission]]
identifier = "gateway-host"
description = "Allows the local desktop control window to manage its owned Native GatewayActor."
commands.allow = ["gateway_host_status", "gateway_host_start", "gateway_host_create_pairing", "gateway_host_revoke", "gateway_host_revoke_all", "gateway_host_stop"]

[[permission]]
identifier = "host-protocol"
description = "Allows an eligible surface to use Host Protocol v2. Actual authority is re-derived from the real WebView label, current origin and RuntimeLease by the Capability Broker."
commands.allow = ["host_execute", "host_snapshot"]

[[permission]]
identifier = "harness-window"
description = "Allows only local control surfaces to open or orchestrate the managed Harness WebView."
commands.allow = ["harness_open", "harness_close", "harness_minimize", "harness_toggle_maximize", "harness_window_state", "control_show", "harness_reload_web", "harness_restart_web", "harness_safe_mode_restart", "harness_clear_quarantine_restart"]

[[permission]]
identifier = "runtime-status"
description = "Allows the bundled desktop launcher to read local Runtime state."
commands.allow = ["runtime_status"]

[[permission]]
identifier = "runtime-start"
description = "Allows the bundled desktop launcher to start the packaged DeepSeek Harness Runtime."
commands.allow = ["runtime_start"]

[[permission]]
identifier = "runtime-stop"
description = "Allows the bundled desktop launcher to stop its owned DeepSeek Harness Runtime."
commands.allow = ["runtime_stop"]

[[permission]]
identifier = "runtime-maintenance"
description = "Allows local HarnessDock control surfaces to clear a persisted plugin quarantine record."
commands.allow = ["runtime_clear_plugin_quarantine"]

[[permission]]
identifier = "update-check"
description = "Allows a trusted local window to check the official project release feed for a newer version."
commands.allow = ["update_check"]

[[permission]]
identifier = "update-install"
description = "Allows a trusted local desktop surface to install only a signed HarnessDock update and restart the client."
commands.allow = ["update_install"]

[[permission]]
identifier = "harness-shell"
description = "Allows the remote Harness Web shell only minimum native window primitives. All business operations must cross Host Protocol v2 and the Capability Broker."
commands.allow = ["harness_minimize", "harness_toggle_maximize", "harness_window_state", "harness_shell_close"]

[[permission]]
identifier = "shell-settings"
description = "Allows only the local on-demand Plugin Diagnostics window to inspect its Runtime and close itself."
commands.allow = ["shell_settings_close", "runtime_status"]

[[permission]]
identifier = "splash-status"
description = "Allows the bundled launcher to update its desktop startup animation."
commands.allow = ["splash_status"]

[[permission]]
identifier = "startup-recovery-status"
description = "Allows the bundled launcher to read a native startup recovery error that may have occurred before its page finished loading."
commands.allow = ["startup_recovery_status"]
